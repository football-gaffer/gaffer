name: Generate natural commentary audio
on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/generate-commentary.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate natural Marin and Cedar MP3s
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cat > /tmp/generate.mjs <<'NODE'
          import fs from 'node:fs/promises';
          import crypto from 'node:crypto';
          const html=await fs.readFile('index.html','utf8');
          await fs.mkdir('audio/marin',{recursive:true}); await fs.mkdir('audio/colour',{recursive:true});
          const voices={marin:{voice:'marin',instructions:'You are a natural British football match commentator. Sound like a real live broadcaster: warm, spontaneous, confident and expressive. Use believable football-commentary pacing and emphasis. Do not sound like an audiobook, GPS, advert, or customer-service voice. Read only the supplied line.'},colour:{voice:'cedar',instructions:'You are a natural British football co-commentator and analyst. Sound like a real former professional on a live broadcast: calm, observant, dry when appropriate, and genuinely engaged. Use human pacing and emphasis. Do not sound synthetic or theatrical. Read only the supplied line.'}};
          function block(name){const m=html.match(new RegExp('const\\s+'+name+'\\s*=\\s*\\{([\\s\\S]*?)\\n\\};'));return m?m[1]:''}
          function strings(src){const out=[];const re=/(?:"((?:\\.|[^"\\])*)"|'((?:\\.|[^'\\])*)')/g;let m;while((m=re.exec(src))){if(/^\\s*:/.test(src.slice(re.lastIndex)))continue;out.push(m[1]??m[2]);}return out}
          const texts=new Set();
          for(const n of ['CO_LINES','COLOUR'])for(const x of strings(block(n)))if(x.length>=8&&x.length<=220&&!/[{}]/.test(x))texts.add(x);
          const fm=html.match(/const\\s+FILLER\\s*=\\s*\\[([\\s\\S]*?)\\n\\s*\\];/);for(const x of strings(fm?fm[1]:''))if(x.length>=8&&x.length<=220&&!/[{}]/.test(x))texts.add(x);
          for(const x of ['Kick off.','Full time.','What a finish!','You cannot defend that. Nothing you can do about it.','The second half is underway.','Half time.','That is a huge moment in the match.'])texts.add(x);
          const manifest={version:1,items:{}};
          const hash=x=>crypto.createHash('sha256').update(x).digest('hex').slice(0,24);
          for(const [role,v] of Object.entries(voices)){
            for(const text of texts){const id=hash(text),rel=`${role}/${id}.mp3`,file=`audio/${rel}`;try{await fs.access(file)}catch{const r=await fetch('https://api.openai.com/v1/audio/speech',{method:'POST',headers:{Authorization:`Bearer ${process.env.OPENAI_API_KEY}`,'Content-Type':'application/json'},body:JSON.stringify({model:'gpt-4o-mini-tts',voice:v.voice,input:text,instructions:v.instructions,response_format:'mp3',speed:1})});if(!r.ok)throw new Error(`TTS ${r.status}: ${await r.text()}`);await fs.writeFile(file,Buffer.from(await r.arrayBuffer()));}manifest.items[`${role}|${text}`]=rel;}
          }
          await fs.writeFile('audio/manifest.json',JSON.stringify(manifest));
          NODE
          node /tmp/generate.mjs
      - name: Commit generated audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio
          git diff --cached --quiet || git commit -m 'Generate natural commentary audio'
          git push
