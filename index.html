    lines.push("squad=" + ((state.squads[state.clubId]||[]).length) +
      " balance=" + (club ? Math.round(club.balance) : 0) +
      " save=" + (state._lastSaveKB || "?") + "KB");
  } else {
    lines.push("no career loaded");
  }
  try{
    lines.push("ua=" + navigator.userAgent.slice(0, 90));
  }catch(e){}
  if(typeof ERROR_LOG !== "undefined" && ERROR_LOG.length){
    lines.push("--- errors (newest first) ---");
    ERROR_LOG.slice(0, 6).forEach(e=>{
      lines.push("[" + e.code + "] " + (e.msg||"").slice(0,110));
      if(e.where) lines.push("   at " + e.where.slice(0,90));
      lines.push("   S" + e.season + " wk" + e.week);
    });
  } else {
    lines.push("--- no errors recorded ---");
  }
  return lines.join("\n");
}

function copyDiagnostic(){
  const text = buildDiagnostic();
  const done = ()=> toast("Diagnostic copied — paste it into the chat", 3600);
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, ()=>fallbackCopy(text, done));
    } else fallbackCopy(text, done);
  }catch(e){ fallbackCopy(text, done); }
}

function fallbackCopy(text, done){
  try{
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    done();
  }catch(e){
    // Last resort: show it so it can be selected by hand.
    showError("SYS-03", text, "Diagnostic (copy this)");
  }
}

/* ---- Update checking ----
   The game is one file, so "updating" means fetching the current page fresh.
   On load we compare the running build against whatever the server now has;
   if they differ, the player is offered a one-tap reload.                    */
function checkForUpdate(){
  if(!window.fetch || location.protocol === "file:") return;
  // Cache-busted request for the page itself — cheap, and it only reads the
  // version constant out of the response.
  fetch(location.href.split("#")[0] + (location.href.indexOf("?")>=0 ? "&" : "?") + "v=" + Date.now(),
        {cache:"no-store"})
    .then(r=> r.ok ? r.text() : null)
    .then(txt=>{
      if(!txt) return;
      const m = txt.match(/const GAME_VERSION = "([^"]+)"/);
      if(m && m[1] !== GAME_VERSION) showUpdateBanner(m[1]);
    })
    .catch(()=>{});
}

function showUpdateBanner(newVersion){
  if(document.getElementById("updateBanner")) return;
  const bar = document.createElement("div");
  bar.id = "updateBanner";
  bar.innerHTML = `<span>Version ${newVersion} is available — your save is kept.</span>
    <button id="updateNow">Update</button>`;
  document.body.appendChild(bar);
  document.getElementById("updateNow").onclick = ()=>{
    // Clear the page cache and pull the new build.
    if(window.caches && caches.keys) caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));
    location.reload(true);
  };
}

// Confirms a save actually landed and reads back at full length. Without this
// a failed write looked identical to a successful one.
function verifySave(key, expected){
  try{
    const back = window.localStorage.getItem(key);
    if(back === null) return {ok:false, reason:"nothing was written"};
    if(back.length !== expected.length) return {ok:false, reason:"truncated on write"};
    return {ok:true, kb: Math.round(back.length/1024)};
  }catch(e){ return {ok:false, reason:e.message}; }
}

let _saveWarned = false;
let _lastSaveWeek = -99, _saveDirty = false;

// Most weeks nothing important changed, and compressing the whole world costs
// close to a second. `saveState()` is throttled; `saveState(true)` forces it.
function saveState(force){
  const wk = (state && state.week) || 0;
  const season = (state && state.season) || 0;
  const stamp = season * 1000 + wk;
  if(!force && _lastSaveWeek !== -99 && (stamp - _lastSaveWeek) < 4){
    _saveDirty = true;
    return;
  }
  _lastSaveWeek = stamp;
  _saveDirty = false;
  return _saveStateNow();
}

function _saveStateNow(){
  try{
    const slim = Object.assign({}, state);
    slim.squads = packSquads(state.squads);
    slim.freeAgents = (state.freeAgents||[]).map(p=>{
      p.clubId = "__free__";
      return encodePlayer(p);
    }).join(PACK_ROW);
    slim.tiers = packFixtures(state.tiers);
    // History is nice to have, not essential — trimmed so a career always saves.
    slim.wire = (state.wire||[]).slice(0,40);
    slim.news = (state.news||[]).slice(0,40);
    const payload = encodeSave(JSON.stringify({clubMeta:packClubMeta(CLUB_META), game:slim, packed:2}));
    window.localStorage.setItem(STORAGE_KEY, payload);
    const check = verifySave(STORAGE_KEY, payload);
    if(!check.ok) throw new Error("save did not persist — " + check.reason);
    state._lastSaveKB = Math.round(payload.length/1024);
    writeSlotMeta(activeSlot);
    _saveWarned = false;
  }catch(e){
    // Quota exceeded: shed everything non-essential and try once more before
    // telling the player their career isn't persisting.
    try{
      const rescue = Object.assign({}, state);
      rescue.squads = packSquads(state.squads);
      rescue.freeAgents = "";
      rescue.tiers = packFixtures(state.tiers);
      rescue.wire = []; rescue.news = (state.news||[]).slice(0,10);
      rescue.memorials = (state.memorials||[]).slice(0,20);
      window.localStorage.setItem(STORAGE_KEY,
        encodeSave(JSON.stringify({clubMeta:packClubMeta(CLUB_META), game:rescue, packed:2})));
      _saveWarned = false;
      return;                                  // rescued — no need to alarm anyone
    }catch(e2){ /* fall through to the warning below */ }
    const msg = String((e && e.name) || "") + " " + String((e && e.message) || "");
    if(/quota|exceed/i.test(msg)){
      reportError("SAV-01", e, "Storage is full. If you are viewing this inside a preview pane, download the file and open it directly — embedded previews get a much smaller storage allowance.");
    } else {
      reportError("SAV-02", e, "Storage is unavailable in this context (private browsing, or an embedded frame). Your career will not persist.");
    }
    // With ~7,900 players across 394 clubs the save is a few MB. If a browser
    // refuses it (quota, or private browsing), the player must know their
    // career isn't persisting rather than lose ten seasons silently.
    if(!_saveWarned){
      _saveWarned = true;
      try{ toast("Couldn't save — your browser is out of storage. Progress won't persist.", 5200); }catch(_){}
    }
  }
}

/* ---- News / inbox ---- */
function pushNews(title, body, kind){
  if(!state.news) state.news = [];
  state.news.unshift({title, body, kind:kind||"info", week:state.week, season:state.season, read:false});
  if(state.news.length>60) state.news.length = 60; // keep the inbox light for storage
}

/* ---- Board objectives ---- */
// Expectation scales with where the board thinks you should finish, which is
// approximated from squad strength relative to the rest of the division.
function setBoardObjective(){
  const tier = getUserTier();
  const ids = state.tiers[tier].clubIds;
  const strengths = ids.map(id=>{
    const r = teamRatings(state.squads[id]);
    return {id, strength:r.attack+r.defense};
  }).sort((a,b)=>b.strength-a.strength);
  const rank = strengths.findIndex(s=>s.id===state.clubId)+1;
  const size = ids.length;
  // Foreign top divisions have no promotion tier above them, so fall back to
  // their own relegation count. Without this, taking a job abroad crashed.
  const rules = TIER_RULES[tier] || {auto:0, playoff:0, releg:(FOREIGN_LEAGUES[tier]||{}).releg||3};

  let target, text;
  const topFlight = isTopDivision(tier);
  if(rank<=Math.max(2, Math.floor(size*0.15))){
    target = topFlight ? 2 : (rules.auto>0 ? rules.auto : 1);
    text = topFlight ? "The board expect a title challenge — finish in the top 2."
      : `The board expect automatic promotion — finish in the top ${target}.`;
  } else if(rank<=Math.floor(size*0.4)){
    target = topFlight ? Math.max(4, Math.floor(size*0.3)) : (rules.auto+rules.playoff || Math.floor(size*0.3));
    text = topFlight ? `The board want European qualification — finish in the top ${target}.`
      : rules.playoff>0 ? `The board want a play-off push — finish in the top ${target}.`
      : `The board want a top-${target} finish.`;
  } else if(rank<=Math.floor(size*0.75)){
    target = Math.floor(size*0.6);
    text = `The board want a comfortable mid-table finish — top ${target} will do.`;
  } else {
    target = size - rules.releg;
    text = `Survival is the priority — stay out of the bottom ${rules.releg||3}.`;
  }
  state.boardObjective = {target, text, tier};
}

function boardConfidence(){
  if(!state.boardObjective) return 50;
  const tier = getUserTier();
  const table = computeTable(tier);
  const myRow = table.find(r=>r.id===state.clubId);
  // Before any games are played the table is all zeroes and position is meaningless,
  // so the board starts neutral rather than judging you on an unplayed season.
  if(!myRow || myRow.played===0) return 60;
  const pos = table.findIndex(r=>r.id===state.clubId)+1;
  const target = state.boardObjective.target;
  const diff = target - pos;
  return clamp(Math.round(75 + diff*(diff>=0?4:6)), 0, 100);
}

function getUserTier(){
  for(const lid of getAllLeagueIds()){
    if(state.tiers[lid] && state.tiers[lid].clubIds.includes(state.clubId)) return lid;
  }
  return TIERS[0].id;
}

function computeTable(tierId){
  const league = state.tiers[tierId];
  const rows = {};
  league.clubIds.forEach(id=> rows[id] = {id, played:0,won:0,drawn:0,lost:0,gf:0,ga:0,pts:0});
  league.fixtures.filter(f=>f.played).forEach(f=>{
    const h=rows[f.home], a=rows[f.away];
    if(!h||!a) return;
    h.played++; a.played++; h.gf+=f.hg; h.ga+=f.ag; a.gf+=f.ag; a.ga+=f.hg;
    if(f.hg>f.ag){ h.won++; h.pts+=3; a.lost++; } else if(f.hg<f.ag){ a.won++; a.pts+=3; h.lost++; }
    else { h.drawn++; a.drawn++; h.pts++; a.pts++; }
  });
  // Administration penalties bite here, exactly as they do in real football.
  Object.values(rows).forEach(r=>{
    const c = CLUB_META[r.id];
    if(c && c.pointsDeduction) r.pts -= c.pointsDeduction;
  });
  return Object.values(rows).sort((x,y)=> y.pts-x.pts || (y.gf-y.ga)-(x.gf-x.ga) || y.gf-x.gf);
}

/* ---- Promotion / relegation ---- */

function simulateOneOff(idA, idB){
  const {hg,ag} = simulateScore(state.squads[idA], state.squads[idB]);
  return hg>=ag ? idA : idB; // higher seed favoured on a tie, same as a real home-leg advantage proxy
}

function resolvePlayoffBracket(seeds){
  let remaining = seeds.slice();
  while(remaining.length>1){
    const next=[];
    for(let i=0;i<remaining.length/2;i++){
      const high = remaining[i], low = remaining[remaining.length-1-i];
      next.push(simulateOneOff(high, low));
    }
    remaining = next;
  }
  return remaining[0] || null;
}

function computeMovementPlan(tierId){
  const rules = TIER_RULES[tierId] || {auto:0, playoff:0, releg:(FOREIGN_LEAGUES[tierId]||{}).releg||0};
  const sorted = computeTable(tierId).map(r=>r.id);
  const autoPromoted = sorted.slice(0, rules.auto);
  let playoffWinner = null;
  if(rules.playoff>0){
    const seeds = sorted.slice(rules.auto, rules.auto+rules.playoff);
    playoffWinner = resolvePlayoffBracket(seeds);
  }
  const relegated = rules.releg>0 ? sorted.slice(sorted.length-rules.releg) : [];
  return {autoPromoted, playoffWinner, relegated};
}

function runSeasonRollover(){
  const plans = {};
  TIERS.forEach(t=> plans[t.id] = computeMovementPlan(t.id));

  const current = {}; TIERS.forEach(t=> current[t.id] = state.tiers[t.id].clubIds.slice());
  const remove = (arr, ids) => arr.filter(id=>!ids.includes(id));
  const promotedIds = t => (plans[t].autoPromoted).concat(plans[t].playoffWinner?[plans[t].playoffWinner]:[]);

  // The National League's four relegated clubs split between North and South,
  // and each regional division sends two up.
  const nlDown = plans.nationalleague.relegated.slice();
  const nlnUp = (plans.nlnorth.autoPromoted).concat(plans.nlnorth.playoffWinner?[plans.nlnorth.playoffWinner]:[]);
  const nlsUp = (plans.nlsouth.autoPromoted).concat(plans.nlsouth.playoffWinner?[plans.nlsouth.playoffWinner]:[]);
  const nlDownNorth = nlDown.slice(0, Math.ceil(nlDown.length/2));
  const nlDownSouth = nlDown.slice(Math.ceil(nlDown.length/2));

  const newMembership = {
    premierleague: remove(current.premierleague, plans.premierleague.relegated).concat(promotedIds("championship")),
    championship: remove(current.championship, plans.championship.relegated.concat(promotedIds("championship")))
      .concat(plans.premierleague.relegated, promotedIds("leagueone")),
    leagueone: remove(current.leagueone, plans.leagueone.relegated.concat(promotedIds("leagueone")))
      .concat(plans.championship.relegated, promotedIds("leaguetwo")),
    leaguetwo: remove(current.leaguetwo, plans.leaguetwo.relegated.concat(promotedIds("leaguetwo")))
      .concat(plans.leagueone.relegated, promotedIds("nationalleague")),
    nationalleague: remove(current.nationalleague, promotedIds("nationalleague").concat(nlDown))
      .concat(plans.leaguetwo.relegated, nlnUp, nlsUp),
    nlnorth: remove(current.nlnorth, nlnUp).concat(nlDownNorth),
    nlsouth: remove(current.nlsouth, nlsUp).concat(nlDownSouth),
  };

  const userOldTier = getUserTier();
  // Foreign top divisions have no English-pyramid plan — their promotion and
  // relegation is handled by the shadow-league system instead. Without this
  // guard, managing Barcelona crashed the rollover outright.
  const userPlan = plans[userOldTier] || {relegated:[], autoPromoted:[], playoffWinner:null};
  let userMovement = "stayed";
  if(userPlan.relegated.indexOf(state.clubId) !== -1) userMovement = "relegated";
  else if(userPlan.autoPromoted.indexOf(state.clubId) !== -1 || userPlan.playoffWinner===state.clubId) userMovement = "promoted";

  // Read the final standings NOW, while the old tables and fixtures are still intact.
  // Once membership is swapped below, computeTable(userOldTier) describes next season.
  const finalTable = computeTable(userOldTier);
  const finalPos = finalTable.findIndex(r=>r.id===state.clubId)+1;
  const wonLeague = finalPos===1;
  const divisionTopScorer = (function(){
    let best = null;
    // `current` only covers the English pyramid, so fall back to the live club
    // list for foreign divisions — this crashed when managing abroad.
    const ids = current[userOldTier] ||
      (state.tiers[userOldTier] ? state.tiers[userOldTier].clubIds : []);
    ids.forEach(cid=>{
      (state.squads[cid] || []).forEach(p=>{ if(!best || (p.goals||0) > (best.goals||0)) best = p; });
    });
    return best;
  })();
  const hadTopScorer = !!(divisionTopScorer && divisionTopScorer.clubId===state.clubId && divisionTopScorer.goals>0);

  // Stature follows movement in the English pyramid as well.
  TIERS.forEach(t=>{
    const before = new Set(current[t.id]);
    newMembership[t.id].forEach(id=>{
      const c = CLUB_META[id];
      if(!c || c.stature===undefined || before.has(id)) return;
      const wasHigher = TIERS.findIndex(x=>x.id===c.tier) < TIERS.findIndex(x=>x.id===t.id);
      c.stature = clamp(c.stature + (wasHigher ? -1.0 : 1.0), 4, 18.6);
    });
  });

  TIERS.forEach(t=>{
    state.tiers[t.id].clubIds = newMembership[t.id];
    state.tiers[t.id].fixtures = generateFixtures(newMembership[t.id]);
    newMembership[t.id].forEach(id=>{ if(CLUB_META[id]) CLUB_META[id].tier = t.id; });
  });

  const youthResult = runYouthRotation();
  const youthLog = youthResult.graduates;
  const growthLog = youthResult.growth;
  // Life events run first so anyone who walks away from the game this season is
  // folded into the retirement list rather than vanishing silently.
  const contractResult = processContracts();   // deals run down; frees hit the market
  payLeaguePrizeMoney();
  paySponsorIncome();
  const lifeResult = runLifeEvents();

  // Rare life-altering events, generated players only.
  const worldEvents = [];
  Object.keys(state.squads).forEach(cid=>{
    const sq = state.squads[cid];
    for(let i=sq.length-1;i>=0;i--){
      const p = sq[i];
      if(p.isReal) continue;
      // Long-term illness: roughly one player in two thousand each season.
      if(!p.onLeave && Math.random() < 0.0005){
        applyLongTermIllness(p);
        worldEvents.push({kind:"illness", p, cid});
        continue;
      }
      // Mortality: deliberately rarer still. Reported with restraint.
      if(Math.random() < 0.00012){
        recordPassing(p, cid);
        sq.splice(i,1);
        worldEvents.push({kind:"passing", p, cid});
        if(cid === state.clubId) pushNews("A sad loss",
          `The club is mourning ${fullName(p)}. A minute's silence will be held before the next match.`, "season");
      }
    }
  });
  const retirements = (youthResult.retirements || [])
    .concat((lifeResult.quitters || []).map(q=>q.p));
  retirements.forEach(p=> pushNews("Retirement",
    `${fullName(p)} has announced his retirement at ${p.age}, after ${p.careerApps||0} career appearances and ${p.careerGoals||0} goals.`, "season"));
  const crises = runClubCrises();
  const life = lifeResult;
  const shadowChanges = runShadowPromotionRelegation();
  const returnedLoanees = returnLoanees();
  const loanedBack = resolveOutgoingLoans();
  const seasonAwards = runSeasonAwards();      // must run BEFORE stats are reset
  replenishAISquads();
  runMarketRefresh();
  const loanedOut = processOutgoingLoans();
  state.offers = [];
  const aiMoves = runAITransferWindow();

  if(wonLeague) state.honours.leagueTitles++;
  if(userMovement==="promoted") state.honours.promotions++;
  state.honours.seasons.push({
    season: state.season, tier: userOldTier, position: finalPos,
    played: state.seasonStats.played, won: state.seasonStats.won,
    drawn: state.seasonStats.drawn, lost: state.seasonStats.lost,
    goalsFor: state.seasonStats.goalsFor, goalsAgainst: state.seasonStats.goalsAgainst,
    movement: userMovement,
  });

  checkAchievements({
    seasonEnd:true, wonLeague, promoted:userMovement==="promoted",
    seasonLosses:state.seasonStats.lost, seasonPlayed:state.seasonStats.played,
    seasonGoalsFor:state.seasonStats.goalsFor, seasonGoalsAgainst:state.seasonStats.goalsAgainst,
    tier:userOldTier, hadTopScorer,
  });

  pushNews(`Season ${state.season} review`,
    `${clubById(state.clubId).name} finished ${ordinal(finalPos)} in ${tierName(userOldTier)}` +
    (userMovement==="promoted" ? " and won promotion!" : userMovement==="relegated" ? " and were relegated." : "."), "season");

  // (Awards were computed above, while this season's stats were still intact.)
  // Reset per-season player stats, keeping career totals.
  Object.keys(state.squads).forEach(cid=>{
    state.squads[cid].forEach(p=>{ p.apps=0; p.goals=0; p.assists=0; p.cleanSheets=0; p.form=[]; });
  });
  Object.keys(state.squads).forEach(cid=>{
    state.squads[cid].forEach(p=>{ p.yellows = 0; p.reds = 0; p.condition = 100;
      p.ratingSum = 0; p.ratingCount = 0; p.lastRating = null; p.form = []; });
  });
  state.seasonStats = {played:0, won:0, drawn:0, lost:0, goalsFor:0, goalsAgainst:0};
  state.streaks = {scoring:0, unbeaten:0, cleanSheet:0, win:0};

  // Remember European winners for next season's Super Cup.
  if(state.euro){
    if(state.euro.ucl && state.euro.ucl.champion) state.honours.lastUclWinner = state.euro.ucl.champion;
    if(state.euro.uel && state.euro.uel.champion) state.honours.lastUelWinner = state.euro.uel.champion;
    Object.keys(EURO_COMPS).forEach(k=>{
      const c = state.euro[k];
      if(c && c.champion===state.clubId){
        state.honours.cups.push({name:EURO_COMPS[k].name, season:state.season});
        pushNews("EUROPEAN CHAMPIONS!", `${clubById(state.clubId).name} have won the ${EURO_COMPS[k].name}.`, "trophy");
      }
    });
  }

  state.week = 1;
  state.season++;
  // Bank this season's European performance, re-rank the nations, and let the
  // slots move accordingly before the new competitions are seeded.
  rollCoefficients();
  const newRanking = recomputeEuroSlots();
  const topFive = newRanking.slice(0,5).map(n=>NATIONS[n].name).join(", ");
  pushNews("UEFA country rankings updated",
    `Top five associations: ${topFive}. Champions League places have been reallocated accordingly.`, "board");

  initCupsForSeason();
  initNationalCups();
  initEuroForSeason();
  setBoardObjective();
  assignWages();
  setSeasonBudgets();
  promptCaptainSelection();

  // Notable AI business involving clubs the player might care about.
  const bigMoves = aiMoves.filter(m=>m.fee>15e6).sort((a,b)=>b.fee-a.fee).slice(0,4);
  bigMoves.forEach(m=> pushNews("Transfer news",
    `${fullName(m.player)} joins ${m.to.name} from ${m.from.name} for ${fmtMoney(m.fee)}.`, "transfer"));

  // Surface the foreign promotions/relegations as news — it's how you notice the
  // rest of Europe is a living place.
  (shadowChanges||[]).forEach(ch=>{
    const upNames = ch.up.map(id=>CLUB_META[id].name).join(", ");
    const downNames = ch.down.map(id=>CLUB_META[id].name).join(", ");
    pushNews(`${leagueDisplayName(ch.leagueId)} — promotion & relegation`,
      `Up: ${upNames}. Down: ${downNames}.`, "season");
  });

  if(returnedLoanees.length) pushNews("Loan spells ended",
    returnedLoanees.map(p=>fullName(p)).join(", ") + " returned to their parent clubs.", "transfer");

  if(loanedOut.length) pushNews("Players sent out on loan",
    loanedOut.map(l=>`${fullName(l.p)} to ${l.dest.name}`).join(", "), "transfer");
  if(loanedBack.length) pushNews("Loanees returned",
    loanedBack.map(l=>`${fullName(l.p)} is back from ${l.dest?l.dest.name:"his loan"}`).join(", "), "transfer");

  state.transferRequests = [];
  return { userMovement, userOldTier, userNewTier: getUserTier(), youthLog, growthLog, aiMoves,
    shadowChanges, returnedLoanees, loanedOut, loanedBack, seasonAwards, retirements, crises,
    finalPos, wonLeague };
}

// Merges into persistent counters so streak/careers-based ones work across weeks.
function checkAchievements(ctx){
  if(!state.achievements) state.achievements = [];
  const have = unlockedSet();
  const full = Object.assign({
    tier:getUserTier(), balance:clubById(state.clubId).balance,

/* =========================================================================
   RICH MATCH RESULT — builds on simulateScore by additionally producing what a
   proper match screen needs: possession, shots, named scorers, per-player
   ratings, a player of the match, and any injuries picked up. Only built for
   matches involving the user's club; every other fixture in the pyramid still
   uses the cheap simulateScore path so a full matchweek stays fast.

/* =========================================================================
   POTENTIAL & DEVELOPMENT
   Every player carries a hidden ceiling. Young players climb toward it fast,
   peak around 27-29, then decline. Training facilities and recent form both
   nudge the rate. This is what makes a 16-year-old with a 55 rating and 88
   potential worth signing out of a National League academy — and what lets AI
   clubs poach him five seasons later once he's actually good.
   ========================================================================= */
// Rarity-weighted ceiling. `tierBonus` lets a good academy (or a big club's
// scouting) shift the odds upward without simply handing out maximum potential.
// Academy level drives the odds of unearthing a real one. Per intake player,
// the chance of an elite ceiling (87+) runs roughly:
//   level 1 ≈ 0.5%   level 2 ≈ 1.5%   level 3 ≈ 3%   level 4 ≈ 6%   level 5 ≈ 11%
// So a level-5 academy produces one most years and occasionally two, while a
// level-1 setup almost never does — which is the whole point of upgrading.
const ACADEMY_GEM_ODDS = [0.005, 0.015, 0.030, 0.060, 0.110];
function academyGemChance(youthLevel){
  return ACADEMY_GEM_ODDS[clamp(Math.round(youthLevel||1), 1, 5) - 1];
}

function rollPotential(currentOvr20, age, tierBonus){
  tierBonus = tierBonus || 0;
  const roll = Math.random();
  let ceiling;
  if(roll < 0.006 + tierBonus*0.004)      ceiling = rndInt(19,21);  // generational: ~94-98
  else if(roll < 0.035 + tierBonus*0.012) ceiling = rndInt(17,19);  // elite: ~86-94
  else if(roll < 0.13 + tierBonus*0.03)   ceiling = rndInt(15,17);  // very good: ~79-86
  else if(roll < 0.40 + tierBonus*0.04)   ceiling = rndInt(13,15);  // solid pro
  else                                     ceiling = rndInt(10,13);  // squad filler
  // Older players are already most of the way to whatever they were going to be.
  const ageDamp = age<=18 ? 0 : age<=21 ? 1 : age<=24 ? 2 : age<=27 ? 3 : 5;
  ceiling = ceiling - ageDamp;
  return clamp(Math.max(ceiling, currentOvr20), currentOvr20, 20);
}

// Runs once per player per season, after ageing.
function developPlayer(p, club){
  const trainingLevel = club && club.id===state.clubId ? club.facilities.training : 2;
  const formAvg = formAverage(p);
  const formBonus = formAvg===null ? 0 : (formAvg-6.8)*0.35; // playing well accelerates growth
  const pot = p.potential || p.overall;

  let delta = 0;
  if(p.age <= 23){
    // Rapid growth years — the closer to potential, the slower the gains.
    const gap = pot - p.overall;
    delta = gap>0 ? (0.55 + gap*0.22) * (0.8 + trainingLevel*0.12) + formBonus : formBonus*0.5;
  } else if(p.age <= 27){
    const gap = pot - p.overall;
    delta = gap>0 ? (0.3 + gap*0.14) * (0.85 + trainingLevel*0.1) + formBonus*0.6 : formBonus*0.3;
  } else if(p.age <= 30){
    delta = 0.05 + formBonus*0.3;
  } else if(p.age <= 33){
    delta = -0.45 + formBonus*0.2;
  } else {
    delta = -0.95 + formBonus*0.15;
  }

  // Apply as whole attribute points, spread across the five core stats.
  const steps = Math.round(delta + (Math.random()-0.5)*0.6);
  if(steps === 0) return 0;
  const keys = ["pace","passing","shooting","defending","physical"];
  const before = p.overall;
  // Growth spreads across 5 attributes and overall is their mean, so a step needs
  // several attribute points to actually move the rating. Young improvers get a
  // wider spread so a genuine prospect reaches his ceiling by his mid-20s rather
  // than retiring 4 points short of it.
  const spread = (steps > 0 && p.age <= 25) ? 3 : 2;
  for(let i=0; i<Math.abs(steps)*spread; i++){
    const k = pick(keys);
    // Pace is the first thing to go and the last to come back for older players.
    if(steps<0 && p.age>30 && Math.random()<0.4){ p.pace = clamp(p.pace-1,1,20); continue; }
    p[k] = clamp(p[k] + (steps>0?1:-1), 1, 20);
    if(steps>0){ recomputeOverall(p); if(p.overall >= (p.potential||20)) break; } // stop at the ceiling
  }
  recomputeOverall(p);
  if(p.overall > (p.potential||0)) p.potential = p.overall; // never cap below reality
  return p.overall - before;
}

/* =========================================================================
   AI TRANSFER MARKET — clubs with a mind of their own.
   Each close season, richer/bigger clubs scan the world for players who are
   clearly better than what they have, and buy them. Selling clubs bank the fee.
   This is what moves a League Two wonderkid up the pyramid over several years.
   ========================================================================= */
function clubStrength(clubId){
  const r = teamRatings(state.squads[clubId]);
  return r.attack + r.defense;
}

/* -------------------------------------------------------------------------
   SQUAD REPLENISHMENT — without this, every AI squad slowly decays: stars age
   out, youth intake replaces them at academy level, and after ~6 seasons the
   whole world converges to mediocrity and Real Madrid gets relegated. Real
   clubs don't work that way — a giant that has a bad year still reloads.
   Each club has a `stature` (the quality its squad should sit around, seeded
   from its opening squad). Every close season an AI club that has fallen below
   its stature signs replacements at that level. Stature itself drifts a little,
   and moves with promotion and relegation, so the pecking order can still change
   over a long save — just not randomly.
   ------------------------------------------------------------------------- */
// Expected squad level for a division, so a club with a fully researched real
// squad isn't handed an unfair head start over one filled with generated depth.
const TIER_EXPECTED_LEVEL = {
  premierleague:14.2, laliga:14.0, seriea:13.6, bundesliga:13.6, ligue1:13.0,
  championship:11.0, eredivisie:11.2, primeira:11.2, superlig:11.0, spfl:10.4,
  probelgium:10.4, austrian:10.0, swiss:10.0, greek:10.0, czech:9.6, danish:9.6,
  norwegian:9.4, croatian:9.4, serbian:9.4, polish:9.4, ukrainian:9.4, swedish:9.2,
  leagueone:9.2, leaguetwo:8.0, nationalleague:6.8, nlnorth:6.0, nlsouth:6.0,
};

function seedClubStature(){
  Object.values(CLUB_META).forEach(c=>{
    const sq = state.squads[c.id];
    if(!sq || sq.length===0){ c.stature = 8; return; }
    const squadAvg = sq.reduce((s,p)=>s+p.overall,0)/sq.length;
    const expected = TIER_EXPECTED_LEVEL[c.tier] || 9;
    // Weight toward the division's level; a real squad still shows through, but
    // it can't make a promoted side the strongest club in the league.
    const blended = squadAvg*0.45 + expected*0.55;
    // Newly promoted clubs start at the bottom end of their new division.
    const promoBias = c.justPromoted ? -0.7 : 0;
    c.stature = clamp(blended + promoBias + (c.eliteness||0)*1.2, 4, 18.6);
  });
}

function replenishAISquads(){
  // Squads must be refilled to a workable SIZE as well as quality. Contract
  // expiries and releases were shrinking clubs season on season — one side was
  // down to nine players by year four.
  const MIN_SQUAD = 18;
  Object.values(CLUB_META).forEach(club=>{
    const sq0 = state.squads[club.id];
    if(sq0){
      const target = club.hidden ? Math.max(SHADOW_SQUAD_TARGET, 13) : MIN_SQUAD;
      const shape = {GK:2, DF:6, MD:6, FW:4};
      sq0.forEach(p=>{ if(shape[p.pos] !== undefined) shape[p.pos]--; });
      let guard = 0;
      while(sq0.length < target && guard++ < 40){
        // Fill the position the squad is shortest in first.
        let need = "MD", worst = -99;
        Object.keys(shape).forEach(k=>{ if(shape[k] > worst){ worst = shape[k]; need = k; } });
        shape[need]--;
        const nat = rollNationality(club);
        const nm = nameForNationality(nat);
        const level = Math.round(clamp((club.stature || 9) - rnd(0.5, 2.5), 3, 20));
        const p = makePlayer(club.id, nm.first, nm.last, rndInt(19,31), need, level, false, nat);
        p.contractYears = defaultContractYears(p);
        p.wage = wageDemand(p);
        sq0.push(p);
      }
    }
  });

  Object.values(CLUB_META).forEach(club=>{
    if(club.id===state.clubId) return;          // the player earns their own squad
    const sq = state.squads[club.id];
    if(!sq || sq.length===0) return;
    if(club.stature===undefined) club.stature = sq.reduce((s,p)=>s+p.overall,0)/sq.length;

    // Slow drift so the hierarchy isn't frozen forever, weighted by wealth.
    const wealthPull = clamp((club.balance/1e8)*0.05, -0.05, 0.15);
    club.stature = clamp(club.stature + rnd(-0.18,0.18) + wealthPull, 4, 18.6);

    const avg = sq.reduce((s,p)=>s+p.overall,0)/sq.length;
    if(avg >= club.stature - 0.6) return;

    // Replace the weakest players with signings at the club's proper level.
    sq.sort((a,b)=>a.overall-b.overall);
    const toReplace = Math.min(4, Math.ceil((club.stature-avg)*2));
    for(let i=0;i<toReplace && i<sq.length;i++){
      const outgoing = sq[i];
      const nat = rollNationality(club);
      const nm = nameForNationality(nat);
      const target = Math.round(clamp(club.stature + rnd(-1,1.6), 3, 20));
      const age = rndInt(20,29);
      sq[i] = makePlayer(club.id, nm.first, nm.last, age, outgoing.pos, target, false, nat);
    }
  });
}

function runAITransferWindow(){
  const moves = [];
  const allClubs = Object.values(CLUB_META).filter(c=>c.id!==state.clubId && !c.hidden);
  // Bigger clubs act first, so they get first pick of the best talent.
  const buyers = allClubs.slice().sort((a,b)=> leagueRank(b) - leagueRank(a));

  buyers.forEach(buyer=>{
    const budget = buyer.balance * 0.45;
    if(budget < 50000) return;
    const squad = state.squads[buyer.id];
    if(!squad || squad.length===0) return;
    const buyerAvg = squad.reduce((s,p)=>s+p.overall,0)/squad.length;

    // Look at a random sample rather than all 5,000 players — keeps rollover fast
    // and produces pleasantly unpredictable markets.
    const candidates = [];
    for(let i=0;i<140;i++){
      const sellerId = pick(Object.keys(state.squads));
      if(sellerId===buyer.id || sellerId===state.clubId) continue; // never sells the user's players out from under them
      const seller = CLUB_META[sellerId];
      if(!seller) continue;
      const sq = state.squads[sellerId];
      if(!sq || sq.length<=16) continue; // don't gut a thin squad
      const target = pick(sq);
      if(!target || target.loanedFrom) continue;   // can't sell a player you don't own
      // Interested in players better than their average, or young with big potential.
      const upgrade = target.overall - buyerAvg;
      const prospect = (target.potential||target.overall) - buyerAvg;
      if(upgrade < 0.8 && !(target.age<=21 && prospect >= 2.5)) continue;
      const price = playerAskingPrice(target, seller.tier || seller.leagueId);
      if(price > budget) continue;
      candidates.push({target, seller, price, score: upgrade*2 + prospect});
    }
    if(candidates.length===0) return;
    candidates.sort((a,b)=>b.score-a.score);
    const deal = candidates[0];

    // Execute
    state.squads[deal.seller.id] = state.squads[deal.seller.id].filter(p=>p.id!==deal.target.id);
    deal.target.clubId = buyer.id;
    state.squads[buyer.id].push(deal.target);
    buyer.balance -= deal.price;
    deal.seller.balance += deal.price;
    moves.push({player:deal.target, from:deal.seller, to:buyer, fee:deal.price});
  });

  // Trim over-full squads by releasing the weakest.
  Object.keys(state.squads).forEach(cid=>{
    const sq = state.squads[cid];
    if(sq.length > SQUAD_TARGET+2){
      sq.sort((a,b)=> (b.overall + (b.potential||b.overall)*0.3) - (a.overall + (a.potential||a.overall)*0.3));
      sq.length = SQUAD_TARGET;
    }
  });
  return moves;
}

// Rough pecking order used to decide who shops first: league quality then wealth.
function leagueRank(club){
  const tierScore = {premierleague:100, laliga:98, seriea:95, bundesliga:94, ligue1:90,
    primeira:70, eredivisie:68, probelgium:60, spfl:58, championship:75,
    leagueone:45, leaguetwo:30, nationalleague:15};
  return (tierScore[club.tier]||20) * 1000 + Math.min(club.balance/1e6, 400);
}

// How many clubs swap places each season, per nation. Mirrors each league's real
// relegation count so the top division always ends up back at its proper size.
function shadowSwapCount(leagueId){
  const lg = FOREIGN_LEAGUES[leagueId];
  return lg ? lg.releg : 0;
}

function isHiddenClub(clubId){
  const c = CLUB_META[clubId];
  return !!(c && c.hidden);
}

// Shadow clubs are ranked by squad strength plus a season's worth of noise, which
// is a cheap stand-in for actually playing out a second-tier fixture list. The
// noise matters: it means the same two clubs don't go up every year.
function simulateShadowSeason(leagueId){
  const pool = Object.values(CLUB_META).filter(c=>c.hidden && c.shadowOf===leagueId);
  return pool.map(c=>({
    id: c.id,
    score: clubStrength(c.id) + rnd(-4.5, 4.5) + (c.justRelegated ? 1.6 : 0), // parachute-payment effect
  })).sort((a,b)=>b.score-a.score);
}

// Runs at season rollover for every foreign nation.
function runShadowPromotionRelegation(){
  const changes = [];
  Object.keys(FOREIGN_LEAGUES).forEach(leagueId=>{
    const n = shadowSwapCount(leagueId);
    if(n<=0) return;
    const league = state.tiers[leagueId];
    if(!league) return;

    const table = computeTable(leagueId);
    const goingDown = table.slice(-n).map(r=>r.id);
    const shadowRanked = simulateShadowSeason(leagueId);
    const comingUp = shadowRanked.slice(0, n).map(s=>s.id);
    if(comingUp.length < n) return; // not enough shadow clubs; leave the league as-is

    // Send the bottom clubs into the shadows.
    goingDown.forEach(id=>{
      const c = CLUB_META[id];
      c.hidden = true; c.shadowOf = leagueId; c.justRelegated = true;
      if(c.stature!==undefined) c.stature = clamp(c.stature-1.1, 4, 18.6); // squad quality follows the drop
      c.balance = Math.round(c.balance*0.55);   // revenue collapse on relegation
      c.capacity = Math.round(c.capacity*0.9);
      // Losing a division costs you your best players over time; the AI window
      // will finish the job, this just starts the slide.
      const sq = state.squads[id];
      if(sq) sq.sort((a,b)=>b.overall-a.overall).slice(0,3).forEach(p=>{
        p.morale = clamp(p.morale-4, 1, 20);
      });
    });

    // Bring the promoted clubs into the light.
    comingUp.forEach(id=>{
      const c = CLUB_META[id];
      c.hidden = false; c.justRelegated = false; c.shadowOf = null;
      if(c.stature!==undefined) c.stature = clamp(c.stature+1.0, 4, 18.6);
      // Promotion money buys better players; nudge the squad so newly promoted
      // sides are competitive-but-vulnerable rather than instant relegation fodder.
      const upSq = state.squads[id];
      // Promoted clubs bulk out from a 15-man second-tier squad to a full one.
      if(upSq){
        while(upSq.length < SQUAD_TARGET){
          const nat2 = rollNationality(c);
          const nm2 = nameForNationality(nat2);
          upSq.push(makePlayer(c.id, nm2.first, nm2.last, rndInt(20,29),
            pick(["GK","DF","DF","MD","MD","FW"]), Math.round(c.stature||9), false, nat2));
        }
      }
      if(upSq) upSq.forEach(p=>{
        if(Math.random()<0.5){
          const k = pick(["pace","passing","shooting","defending","physical"]);
          p[k] = clamp(p[k]+1,1,20); recomputeOverall(p);
          if(p.overall>(p.potential||0)) p.potential=p.overall;
        }
      });
      c.balance += Math.round(rnd(8e6, 30e6) * (c.nationBoost||0.6)); // promotion windfall
      c.capacity = Math.round(c.capacity*1.08);
    });

    league.clubIds = league.clubIds.filter(id=>!goingDown.includes(id)).concat(comingUp);
    league.fixtures = generateFixtures(league.clubIds);
    changes.push({leagueId, down:goingDown, up:comingUp});
  });

  // Second season down, the parachute effect wears off.
  Object.values(CLUB_META).forEach(c=>{ if(c.hidden && !c.justRelegated) c.justRelegated = false; });
  return changes;
}



/* =========================================================================
   NATIONAL LEAGUE NORTH & SOUTH — tiers 6a and 6b. Four go down from the
   National League (two into each regional division) and two come up from each.
   Club lists are best-effort for this level rather than verified line-ups.
   ========================================================================= */

/* =========================================================================
   ATTENDANCE & GATE RECEIPTS
   Attendance drives matchday income, which is why cup football matters so much
   lower down: a League Two side drawing a Premier League club at home sells out
   and banks more from one afternoon than from a month of league fixtures.
   ========================================================================= */
const TICKET_PRICE = { premierleague:52, laliga:42, seriea:38, bundesliga:34, ligue1:32,
  championship:28, primeira:22, eredivisie:24, probelgium:20, spfl:24,
  leagueone:20, leaguetwo:17, nationalleague:14, nlnorth:11, nlsouth:11,
  superlig:18, austrian:18, swiss:18, greek:18, czech:18, danish:18, norwegian:18, croatian:18, serbian:18, polish:18, ukrainian:18, swedish:18
};

function clubPullFactor(club){
  // How big a draw a club is, 0-1, from league standing and wealth.
  const leagueWeight = {premierleague:1.0, laliga:0.96, seriea:0.92, bundesliga:0.92, ligue1:0.86,
    championship:0.62, eredivisie:0.55, primeira:0.55, spfl:0.5, probelgium:0.45,
    leagueone:0.38, leaguetwo:0.26, nationalleague:0.16, nlnorth:0.1, nlsouth:0.1}[club.tier] || 0.3;
  const wealth = clamp(club.balance/3e8, 0, 1) * 0.25;
  return clamp(leagueWeight + wealth, 0.05, 1);
}

// Returns {attendance, revenue}. `competition` is "league" or a cup name.
function computeAttendance(homeClub, awayClub, competition){
  const cap = homeClub.capacity;
  let fill;
  if(competition === "league"){
    // Home support plus a modest bump for a glamour visitor.
    fill = 0.58 + clubPullFactor(homeClub)*0.22 + clubPullFactor(awayClub)*0.16 + rnd(-0.08,0.08);
  } else {
    const gap = clubPullFactor(awayClub) - clubPullFactor(homeClub);
    // A far bigger visitor in a cup tie is the classic sell-out: the whole town goes.
    fill = 0.55 + clubPullFactor(awayClub)*0.3 + Math.max(0,gap)*0.75 + rnd(-0.06,0.1);
  }
  fill = clamp(fill, 0.22, 1);
  const attendance = Math.round(cap * fill);
  const price = TICKET_PRICE[homeClub.tier] || 15;
  // Cup ties carry a ticket premium, and gate receipts in the domestic cups are
  // traditionally shared, so the home club banks the lion's share of a big day.
  const mult = competition === "league" ? 1 : 1.35;
  return {attendance, revenue: Math.round(attendance * price * mult), soldOut: fill >= 0.985};
}

/* =========================================================================
   PLAYER AWARDS
   Modelled on the real end-of-season slate: PFA-style Player and Young Player
   of the Season plus a Team of the Season for every division, Golden Boot and
   Golden Glove per league, and a global Ballon d'Or. Awards are recorded on the
   player and lift his market value, as they do in reality.
   ========================================================================= */
function awardScore(p, leaguePos, leagueSize){
  const teamBonus = leagueSize>1 ? (leagueSize-leaguePos)/(leagueSize-1) : 0.5;
  const goals = p.goals||0, apps = p.apps||0, cs = p.cleanSheets||0;
  const attacking = goals*3.2 + (p.assists||0)*1.4;
  const defending = (p.pos==="GK"||p.pos==="DF") ? cs*2.6 : 0;
  const presence = apps*0.25;
  return attacking + defending + presence + teamBonus*9 + p.overall*0.5;
}

function giveAward(p, name, season, league){
  if(!p.awards) p.awards = [];
  p.awards.push({name, season, league: league||null});
  // Keep a career's worth, not a lifetime's — the count still drives value.
  if(p.awards.length > 12){
    p.awardsExtra = (p.awardsExtra||0) + 1;
    p.awards.shift();
  }
}

// Awards lift value the way real silverware inflates a fee.
function awardValueMultiplier(p){
  const list = p.awards||[];
  let m = 1 + (p.awardsExtra||0) * 0.04;    // older honours still count

  list.forEach(a=>{
    if(a.name==="Ballon d'Or") m += 0.30;
    else if(a.name.includes("Player of the Season")) m += 0.12;
    else if(a.name.includes("Young Player")) m += 0.10;
    else if(a.name.includes("Golden Boot") || a.name.includes("Golden Glove")) m += 0.08;
    else if(a.name.includes("Team of the Season")) m += 0.05;
    else m += 0.03;
  });
  return clamp(m, 1, 2.6);
}

function runSeasonAwards(){
  const results = { leagues: [], ballonDor: null, userAwards: [] };
  const season = state.season;
  const globalPool = [];

  getAllLeagueIds().forEach(leagueId=>{
    const league = state.tiers[leagueId];
    if(!league || league.clubIds.length===0) return;
    const table = computeTable(leagueId);
    const posOf = {};
    table.forEach((r,i)=> posOf[r.id] = i+1);
    const size = table.length;

    // Everyone who actually played in this division.
    const players = [];
    league.clubIds.forEach(cid=>{
      (state.squads[cid]||[]).forEach(p=>{ if((p.apps||0) >= 5) players.push(p); });
    });
    if(players.length < 11) return;

    const scored = players.map(p=>({p, s: awardScoreWithRating(p, posOf[p.clubId]||size, size)}))
      .sort((a,b)=>b.s-a.s);

    const potm = scored[0].p;
    giveAward(potm, leagueDisplayName(leagueId)+" Player of the Season", season, leagueId);

    const young = scored.find(x=>x.p.age<=21);
    if(young) giveAward(young.p, leagueDisplayName(leagueId)+" Young Player of the Season", season, leagueId);

    const boot = players.slice().sort((a,b)=>(b.goals||0)-(a.goals||0))[0];
    if(boot && (boot.goals||0)>0) giveAward(boot, leagueDisplayName(leagueId)+" Golden Boot", season, leagueId);

    const keepers = players.filter(p=>p.pos==="GK").sort((a,b)=>(b.cleanSheets||0)-(a.cleanSheets||0));
    if(keepers.length && (keepers[0].cleanSheets||0)>0)
      giveAward(keepers[0], leagueDisplayName(leagueId)+" Golden Glove", season, leagueId);

    // Team of the Season: best available 4-4-2 by award score.
    const byPos = pos => scored.filter(x=>x.p.pos===pos).map(x=>x.p);
    const toty = [].concat(byPos("GK").slice(0,1), byPos("DF").slice(0,4), byPos("MD").slice(0,4), byPos("FW").slice(0,2));
    toty.forEach(p=> giveAward(p, leagueDisplayName(leagueId)+" Team of the Season", season, leagueId));

    results.leagues.push({leagueId, potm, young: young?young.p:null, boot, glove: keepers[0]||null, toty});

    // Feed the strongest divisions into the global Ballon d'Or shortlist.
    const prestige = {premierleague:1.0, laliga:0.98, seriea:0.94, bundesliga:0.94, ligue1:0.88,
      primeira:0.6, eredivisie:0.6, championship:0.55, probelgium:0.5, spfl:0.5}[leagueId] || 0.3;
    scored.slice(0,12).forEach(x=> globalPool.push({p:x.p, s:x.s*prestige}));
  });

  // Ballon d'Or — best player on the planet, weighted by league prestige and by
  // whether he actually won anything in Europe.
  if(globalPool.length){
    const euroWinners = new Set();
    if(state.euro) Object.keys(EURO_COMPS).forEach(k=>{
      const c = state.euro[k];
      if(c && c.champion) (state.squads[c.champion]||[]).forEach(p=>euroWinners.add(p.id));
    });
    globalPool.forEach(g=>{ if(euroWinners.has(g.p.id)) g.s *= 1.22; });
    globalPool.sort((a,b)=>b.s-a.s);
    const winner = globalPool[0].p;
    giveAward(winner, "Ballon d'Or", season, null);
    results.ballonDor = winner;
    pushNews("Ballon d'Or " + season,
      `${fullName(winner)} of ${clubById(winner.clubId) ? clubById(winner.clubId).name : "his club"} is named the best player in the world.`, "trophy");
  }

  // Anything won by one of the player's own squad, for the season summary.
  (state.squads[state.clubId]||[]).forEach(p=>{
    (p.awards||[]).filter(a=>a.season===season).forEach(a=> results.userAwards.push({p, award:a}));
  });
  if(results.userAwards.length){
    pushNews("End of season awards",
      results.userAwards.map(u=>`${fullName(u.p)} — ${u.award.name}`).join("; "), "trophy");
  }
  return results;
}

/* =========================================================================
   EFL TROPHY — for League One and League Two, extended in this save to include
   the National League and both regional divisions, so the lower pyramid always
   has silverware to chase and a genuine cup payday to bank.
   ========================================================================= */
const EFL_TROPHY = {
  name:"EFL Trophy", weeks:[7,13,19,27,33,39,45],
  eligibleTiers:["leagueone","leaguetwo","nationalleague","nlnorth","nlsouth"],
  prizePerRound:[12000,25000,50000,110000,240000,500000,900000], winnerBonus:1200000,
};



/* =========================================================================
   FINE-GRAINED RATINGS
   Attributes are integers 1-20 and overall was their ROUNDED mean, which gave
   only ~20 distinct ratings in the whole game — that's why everyone clustered
   on the same handful of numbers. Now we keep an unrounded mean plus a small
   permanent per-player offset ("flair"), so the display genuinely uses every
   value from 40 to 99. p.overall stays as a rounded int because every tuned
   simulation formula depends on it; p.ovrF is what the player actually sees.
   ========================================================================= */
function playerFlair(p){
  // Real players carry no flair offset — their displayed rating must match the
  // database value exactly. Generated players get a small deterministic nudge
  // so the world isn't quantised onto 20 values.
  if(p.isReal) return 0;
  if(p._flair === undefined) p._flair = ((hashStr(p.id) % 1000)/1000 - 0.5) * 0.9;
  return p._flair;
}

function fineOverall(p){
  const mean = (p.pace + p.passing + p.shooting + p.defending + p.physical) / 5;
  let f = mean + playerFlair(p);
  // Injuries and low morale visibly drag a player's effective level down.
  if(p.injuryWeeks > 0) f -= 0.4;
  if(p.morale <= 6) f -= 0.35;
  else if(p.morale >= 17) f += 0.25;
  // Allow a shade above the internal maximum so the very top of the display
  // scale (97-99) is reachable by a maxed-out player in form, rather than 98
  // being a hard wall that everyone piles against.
  return clamp(f, 1, 20.5);
}

/* =========================================================================
   INJURIES — real injury types with the layoffs they actually cause.
   Sources: UEFA Club Injury Study averages and standard clinical ranges —
   hamstring strains cost about 15 days, ankle ligament damage 3-12 weeks,
   metatarsal fractures 6-12, Achilles ruptures 4-6 months, and ACL tears
   6-12 months. Serious injuries leave a permanent mark on pace and physical,
   which is how careers actually get bent out of shape.
   ========================================================================= */
const INJURY_TYPES = [
  {name:"Dead leg",              min:1,  max:2,  weight:16, lasting:0},
  {name:"Bruised ribs",          min:1,  max:3,  weight:8,  lasting:0},
  {name:"Concussion",            min:1,  max:3,  weight:7,  lasting:0},
  {name:"Hamstring strain",      min:2,  max:8,  weight:20, lasting:0.15},
  {name:"Groin strain",          min:2,  max:6,  weight:11, lasting:0.1},
  {name:"Ankle sprain",          min:1,  max:6,  weight:14, lasting:0.05},
  {name:"Calf tear",             min:3,  max:8,  weight:8,  lasting:0.15},
  {name:"Ankle ligament damage", min:6,  max:12, weight:6,  lasting:0.35},
  {name:"Broken metatarsal",     min:6,  max:12, weight:5,  lasting:0.3},
  {name:"Medial knee ligament",  min:6,  max:10, weight:4,  lasting:0.35},
  {name:"Broken leg",            min:12, max:24, weight:2,  lasting:0.8},
  {name:"Achilles rupture",      min:16, max:26, weight:1.5,lasting:1.1},
  {name:"Cruciate ligament (ACL)",min:26,max:44, weight:1.5,lasting:1.3},
];

function rollInjuryType(){
  const total = INJURY_TYPES.reduce((s,t)=>s+t.weight,0);
  let r = Math.random()*total;
  for(const t of INJURY_TYPES){ r -= t.weight; if(r<=0) return t; }
  return INJURY_TYPES[0];
}

// Applies an injury, including any permanent damage a serious one leaves behind.
function applyInjury(p, medicalLevel){
  const type = rollInjuryType();
  const proneness = p.injuryProne ? 1.25 : 1;
  const weeks = Math.max(1, Math.round(rndInt(type.min, type.max+1) * proneness / (1 + (medicalLevel-1)*0.12)));
  p.injuryWeeks = weeks;
  p.injuryName = type.name;
  p.injuryHistory = (p.injuryHistory||0) + 1;
  p.morale = clamp(p.morale - (weeks>=12 ? 5 : weeks>=6 ? 3 : 1), 1, 20);

  // Serious damage costs pace and physical permanently — the classic story of a
  // quick winger who is never quite as quick again.
  if(type.lasting > 0 && Math.random() < type.lasting){
    const loss = type.lasting >= 1 ? 2 : 1;
    p.pace = clamp(p.pace - loss, 1, 20);
    if(type.lasting >= 0.8) p.physical = clamp(p.physical - 1, 1, 20);
    recomputeOverall(p);
    p.permanentDamage = (p.permanentDamage||0) + loss;
  }
  // Repeated long lay-offs mark a player as injury prone for the rest of his career.
  if(p.injuryHistory >= 3 && weeks >= 6) p.injuryProne = true;

  // Very long lay-offs late in a career can finish it.
  const careerEnding = weeks >= 24 && p.age >= 30 && Math.random() < 0.3;
  return {type, weeks, careerEnding};
}

/* =========================================================================
   MORALE — now actually does something. It moves with results, game time,
   injuries and transfer sagas, and it feeds back into performance, growth
   and whether a player asks to leave.
   ========================================================================= */
function applyMoraleFromResult(clubId, won, drew){
  const sq = state.squads[clubId];
  if(!sq) return;
  const delta = won ? 1 : drew ? 0 : -1;
  sq.forEach(p=>{
    if(!isAvailable(p)) return;
    p.morale = clamp(p.morale + delta + (Math.random()<0.25?rndInt(-1,2):0), 1, 20);
  });
}

// Squad morale multiplies team strength, so a happy dressing room genuinely
// overperforms and an unhappy one collapses.
function moraleMultiplier(clubId){
  const sq = state.squads[clubId];
  if(!sq || sq.length===0) return 1;
  let sum = 0;
  for(let i=0;i<sq.length;i++) sum += (sq[i].morale || 12);
  return clamp(0.9 + (sum/sq.length - 11)*0.014, 0.86, 1.12);
}

/* =========================================================================
   PLAYERS WITH A MIND OF THEIR OWN — transfer requests and retirements.
   ========================================================================= */
function generateTransferRequests(){
  if(!state.transferRequests) state.transferRequests = [];
  const sq = state.squads[state.clubId] || [];
  const club = clubById(state.clubId);
  const made = [];
  sq.forEach(p=>{
    if(p.loanedFrom || p.loanedOutTo) return;
    if(state.transferRequests.some(r=>r.playerId===p.id)) return;
    const appsShare = (p.apps||0) / Math.max(1, state.seasonStats.played);
    const benched = appsShare < 0.3 && state.seasonStats.played >= 8;
    const tooGoodForUs = (p.potential||p.overall) > (club.stature||10) + 2.5;
    const unhappy = p.morale <= 7;
    let chance = 0;
    if(unhappy) chance += 0.05;
    if(benched) chance += 0.04;
    if(tooGoodForUs) chance += 0.03;
    if(chance === 0 || Math.random() > chance) return;
    const reason = unhappy ? "is unhappy at the club"
      : benched ? "wants regular first-team football"
      : "believes he has outgrown the club";
    state.transferRequests.push({playerId:p.id, reason, week:state.week, season:state.season});
    made.push({p, reason});
  });
  made.forEach(m=> pushNews("Transfer request",
    `${fullName(m.p)} has handed in a transfer request — he ${m.reason}.`, "transfer"));
  return made;
}

function resolveTransferRequest(playerId, accept){
  const req = (state.transferRequests||[]).find(r=>r.playerId===playerId);
  const p = (state.squads[state.clubId]||[]).find(x=>x.id===playerId);
  if(!req || !p) return;
  state.transferRequests = state.transferRequests.filter(r=>r.playerId!==playerId);
  if(accept){
    p.listed = true;
    p.morale = clamp(p.morale+4, 1, 20);
    toast(`${fullName(p)} transfer listed at his request`);
  } else {
    p.morale = clamp(p.morale-4, 1, 20);
    toast(`${fullName(p)} is unhappy at being kept`);
  }
  saveState();
}

// Retirement is a decision the player makes, not a hard age cut-off: it comes
// from age, decline, injuries and how much football he's still getting.
function considerRetirement(p, club){
  if(p.age < 32) return false;
  let chance = 0;
  if(p.age >= 39) chance = 1;
  else if(p.age >= 37) chance = 0.55;
  else if(p.age >= 35) chance = 0.28;
  else if(p.age >= 33) chance = 0.1;
  else chance = 0.04;
  if((p.injuryHistory||0) >= 4) chance += 0.15;
  if((p.permanentDamage||0) >= 3) chance += 0.15;
  if((p.apps||0) < 8) chance += 0.1;             // not playing any more
  if(p.overall >= 15) chance -= 0.08;            // still good enough to go on
  return Math.random() < clamp(chance, 0, 1);
}

/* =========================================================================
   CLUB CRISES — the "anything can happen" layer. Real English football is full
   of clubs falling into administration and being docked points (Portsmouth,
   Bury, Derby), and of boards running out of patience. This gives a season
   genuine jeopardy beyond results.
   ========================================================================= */
function runClubCrises(){
  const events = [];
  Object.values(CLUB_META).forEach(club=>{
    if(club.hidden) return;
    // Administration: sustained heavy losses.
    if(club.balance < -8e6 && Math.random() < 0.3){
      const deduction = club.tier==="premierleague" ? 9 : 12;
      club.inAdministration = true;
      club.pointsDeduction = (club.pointsDeduction||0) + deduction;
      club.balance = Math.round(club.balance * 0.4) + 2e6;  // debts written down
      club.stature = clamp((club.stature||10) - 1.2, 4, 18.6);
      events.push({club, kind:"administration", deduction});
    }
  });
  events.forEach(e=> pushNews("Administration",
    `${e.club.name} have entered administration and been docked ${e.deduction} points.`, "board"));
  return events;
}


/* =========================================================================
   MANAGER CAREER — you are now a person with a reputation and a job, not a
   permanent fixture at one club. Boards lose patience and sack you. Other
   clubs watch your record and come calling. If you're out of work you can keep
   advancing weeks until an offer arrives, exactly as an unemployed manager
   waits for the phone to ring.
   ========================================================================= */

const MANAGER_FIRST = ["Sean","Michael","David","Paul","Steve","Gary","Neil","Chris","Ryan","Mark",
  "Carlos","Diego","Marco","Luca","Thomas","Jurgen","Erik","Pep","Xabi","Roberto","Andoni","Unai",
  "Vincent","Frank","Patrick","Ange","Enzo","Rafa","Kieran","Liam"];
const MANAGER_LAST = ["Doyle","Hartley","Whitlock","Brennan","Maguire","Sutton","Ferris","Aldridge",
  "Moreno","Sanchez","Bianchi","Rossi","Weber","Klein","Bakker","Larsen","Nowak","Kovac","Petrov",
  "Almeida","Fontaine","Marchetti","Vogel","Hendricks","Okafor","Ivanov","Sorensen","Duarte"];

function makeAIManager(club){
  const stature = club.stature || 10;
  return {
    name: pick(MANAGER_FIRST)+" "+pick(MANAGER_LAST),
    skill: clamp(Math.round(stature + rndInt(-2,3)), 3, 20),
    tenure: 0,
    reputation: clamp(Math.round(leagueRank(club)/6000 + rndInt(-1,2)), 1, 20),
  };
}

function ensureManagers(){
  Object.values(CLUB_META).forEach(c=>{
    if(c.id === state.clubId) return;
    if(!c.manager) c.manager = makeAIManager(c);
  });
}

// The user's own manager profile.
function initManagerProfile(clubId){
  const club = clubById(clubId);
  state.manager = {
    name: state.manager && state.manager.name ? state.manager.name : "You",
    reputation: clamp(Math.round((club.stature||10) * 0.8), 3, 20),
    clubId,
    unemployed: false,
    weeksUnemployed: 0,
    history: [{clubId, fromSeason: state.season, toSeason: null}],
    careerWins: 0, careerGames: 0, careerTrophies: 0,
  };
}

/* ---- Getting sacked ---- */
// Boards act on sustained underperformance against their stated objective,
// weighted by how far into the season it is — nobody gets sacked in week 3.
// Boards are more patient than they were: a rough patch is survivable, a
// season-long collapse is not.
function evaluateManagerJob(){
  if(!state.manager || state.manager.unemployed) return null;
  const conf = boardConfidence();
  const played = state.seasonStats.played;
  if(played < 12) return null;                   // longer grace period

  state.sackPressure = state.sackPressure || 0;
  if(conf < 15) state.sackPressure += 1.5;       // only a genuine collapse bites
  else if(conf < 30) state.sackPressure += 0.8;
  else if(conf > 55) state.sackPressure = Math.max(0, state.sackPressure - 3);
  else state.sackPressure = Math.max(0, state.sackPressure - 1);

  if(state.sackPressure >= 16){
    return sackUser("The board have lost patience with a run of poor results.");
  }
  // Early warning so it never feels arbitrary.
  if(state.sackPressure >= 6 && !state.sackWarned){
    state.sackWarned = true;
    pushNews("Board meeting",
      "The board have expressed serious concern about results. Your position is under review.", "board");
  }
  if(state.sackPressure < 4) state.sackWarned = false;
  return null;
}

function sackUser(reason){
  const club = clubById(state.clubId);
  state.manager.unemployed = true;
  state.manager.weeksUnemployed = 0;
  const spell = state.manager.history[state.manager.history.length-1];
  if(spell && spell.toSeason === null) spell.toSeason = state.season;
  state.manager.reputation = clamp(state.manager.reputation - 2, 1, 20);
  state.sackPressure = 0;
  // The club appoints someone else and carries on without you.
  club.manager = makeAIManager(club);
  pushNews("You have been sacked",
    `${club.name} have dismissed you. ${reason} ${club.manager.name} takes over.`, "board");
  return {sacked:true, club};
}

/* ---- Job offers ---- */
// Clubs that have just sacked their own manager, or that are drifting, look at
// the available names. Your reputation decides which jobs are realistic.
function generateManagerVacancies(){
  if(!state.manager) return [];
  const offers = [];
  const rep = state.manager.reputation;

  Object.values(CLUB_META).forEach(club=>{
    if(club.hidden || club.id === state.clubId) return;
    if(!club.manager) return;
    // AI clubs sack their own managers on a slow drip.
    const table = computeTable(club.tier);
    const pos = table.findIndex(r=>r.id===club.id)+1;
    const size = table.length || 20;
    const struggling = pos > size*0.75;
    if(struggling && state.week > 12 && Math.random() < 0.012){
      club.manager = makeAIManager(club);
      club.vacantSince = state.week;
      // Would they consider you?
      const clubRep = clamp(Math.round(leagueRank(club)/6000), 1, 20);
      if(state.manager.unemployed && clubRep <= rep + 3 && clubRep >= rep - 6 && Math.random() < 0.5){
        offers.push(club);
      }
    }
  });

  // An unemployed manager should never be stranded forever: the longer you wait,
  // the wider the net, and eventually somebody takes a chance on you.
  if(state.manager.unemployed && offers.length === 0){
    const patience = state.manager.weeksUnemployed;
    if(patience >= 3 && Math.random() < 0.10 + patience*0.03){
      const pool = Object.values(CLUB_META).filter(c=>{
        if(c.hidden || c.id===state.clubId) return false;
        const clubRep = clamp(Math.round(leagueRank(c)/6000), 1, 20);
        return clubRep <= rep + 1 + Math.floor(patience/4);
      });
      if(pool.length) offers.push(pick(pool));
    }
  }

  offers.forEach(c=>{
    if(!state.jobOffers) state.jobOffers = [];
    if(state.jobOffers.some(o=>o.clubId===c.id)) return;
    state.jobOffers.push({clubId:c.id, week:state.week, season:state.season});
    pushNews("Job offer",
      `${c.name} (${leagueDisplayName(c.tier)}) have approached you about their vacant manager's post.`, "board");
  });
  return offers;
}

function acceptJob(clubId){
  const club = clubById(clubId);
  if(!club) return false;
  const prev = state.manager.history[state.manager.history.length-1];
  if(prev && prev.toSeason === null) prev.toSeason = state.season;
  state.clubId = clubId;
  state.manager.clubId = clubId;
  state.manager.unemployed = false;
  state.manager.weeksUnemployed = 0;
  state.manager.history.push({clubId, fromSeason: state.season, toSeason: null});
  state.jobOffers = [];
  state.sackPressure = 0;
  state.offers = [];
  state.transferRequests = [];
  club.manager = null;                   // you are the manager now
  setBoardObjective();
  pushNews("New job", `You have been appointed manager of ${club.name}.`, "board");
  saveState();
  return true;
}

function declineJob(clubId){
  state.jobOffers = (state.jobOffers||[]).filter(o=>o.clubId!==clubId);
  saveState();
}

// Job offers go stale, and unemployment ticks along.
function tickManagerWeek(){
  if(!state.manager) return;
  if(state.manager.unemployed){
    state.manager.weeksUnemployed++;
  }
  state.jobOffers = (state.jobOffers||[]).filter(o=> (state.week - o.week) < 6 || o.season !== state.season);
}



/* =========================================================================
   UEFA COUNTRY COEFFICIENTS — live, not hardcoded.
   Every nation earns coefficient points from how its clubs actually perform in
   Europe: 2 for a win and 1 for a draw in the league phase, with bonuses for
   reaching each knockout round, divided by the number of clubs it entered —
   the same shape as the real UEFA calculation. A rolling five-season total
   sets the rankings, and the rankings set next season's slots. Do well over
   several years with Dutch or Portuguese clubs and those nations genuinely
   climb into extra Champions League places at England's expense.
   ========================================================================= */
const COEFF_WIN = 2, COEFF_DRAW = 1;
const COEFF_ROUND_BONUS = { playoff:1.5, r16:1.5, qf:1, sf:1, final:1, winner:1 };

function initCoefficients(){
  state.coeff = {};
  Object.keys(NATIONS).forEach(n=>{
    // Seed the five-year history from the starting order so the first season's
    // allocation matches the real-world pecking order rather than being blank.
    const rank = NATIONS[n].coeff || 25;
    const seed = Math.max(2, 24 - rank * 0.9);
    state.coeff[n] = { history:[seed, seed, seed, seed, seed], current:0 };
  });
}

function nationOfClubId(clubId){
  const c = CLUB_META[clubId];
  if(!c) return null;
  return c.leagueNation || "england";
}

function addCoeffPoints(clubId, points){
  if(!state.coeff) return;
  const n = nationOfClubId(clubId);
  if(!n || !state.coeff[n]) return;
  state.coeff[n].current += points;
}

// How many clubs each nation had in Europe this season, for the divisor.
function nationEntrantCounts(){
  const counts = {};
  if(!state.euro) return counts;
  Object.keys(EURO_COMPS).forEach(k=>{
    (state.euro[k].clubIds||[]).forEach(id=>{
      const n = nationOfClubId(id);
      if(n) counts[n] = (counts[n]||0) + 1;
    });
  });
  return counts;
}

// Called at season end: bank this season's score and drop the oldest year.
function rollCoefficients(){
  if(!state.coeff) initCoefficients();
  const counts = nationEntrantCounts();
  Object.keys(state.coeff).forEach(n=>{
    const entered = counts[n] || 0;
    const score = entered > 0 ? state.coeff[n].current / entered : 0;
    state.coeff[n].history.push(Math.round(score * 100) / 100);
    while(state.coeff[n].history.length > 5) state.coeff[n].history.shift();
    state.coeff[n].current = 0;
  });
}

function coeffTotal(nationId){
  const c = state.coeff && state.coeff[nationId];
  if(!c) return 0;
  return c.history.reduce((s,v)=>s+v, 0);
}

// Nations ranked best-first by their rolling five-year total.
function rankedNations(){
  return Object.keys(EURO_SLOTS)
    .filter(n=>NATIONS[n])
    .sort((a,b)=> coeffTotal(b) - coeffTotal(a) || ((NATIONS[a].coeff||99)-(NATIONS[b].coeff||99)));
}

// Slots follow RANK, not nation identity — so places genuinely move between
// countries as their coefficients rise and fall. Totals are exactly 36/29/36
// (the Europa League's remaining 7 come from domestic cup winners).
function slotsForRank(rank){
  if(rank <= 5)  return {ucl:4, uel:2, uecl:1};
  if(rank <= 8)  return {ucl:2, uel:2, uecl:2};
  if(rank <= 18) return {ucl:1, uel:1, uecl:2};
  if(rank <= 20) return {ucl:0, uel:1, uecl:2};
  return {ucl:0, uel:1, uecl:1};
}

// Rebuilds EURO_SLOTS from the live rankings, ready for the new season.
function recomputeEuroSlots(){
  const ranked = rankedNations();
  ranked.forEach((n, i)=>{ EURO_SLOTS[n] = slotsForRank(i+1); });
  return ranked;
}

/* =========================================================================
   NATIONAL CUPS — every nation gets its real domestic cup, and every winner
   takes a Europa League place, exactly as in reality. Previously only England
   had cups, so no foreign cup winner could ever qualify.
   ========================================================================= */
const NATIONAL_CUPS = {
  england:     "FA Cup",              spain:       "Copa del Rey",
  italy:       "Coppa Italia",        germany:     "DFB-Pokal",
  france:      "Coupe de France",     netherlands: "KNVB Cup",
  portugal:    "Taça de Portugal",    belgium:     "Belgian Cup",
  scotland:    "Scottish Cup",        turkey:      "Türkiye Kupası",
  austria:     "ÖFB-Cup",             switzerland: "Swiss Cup",
  greece:      "Greek Cup",           czechia:     "Czech Cup",
  denmark:     "DBU Pokalen",         norway:      "Norwegian Cup",
  croatia:     "Croatian Cup",        serbia:      "Serbian Cup",
  poland:      "Polish Cup",          ukraine:     "Ukrainian Cup",
  sweden:      "Svenska Cupen",
};
const NATIONAL_CUP_WEEKS = [13, 20, 26, 31, 36, 43];

// Foreign cups run as a compact knockout: entrants are that nation's top
// division plus its hidden second tier, so there's genuine cup-upset potential.
function initNationalCups(){
  state.natCups = {};
  Object.keys(NATIONAL_CUPS).forEach(nationId=>{
    if(nationId === "england") return;              // England already has the FA Cup proper
    const leagueId = getAllLeagueIds().find(l=> isTopDivision(l) && leagueNationId(l)===nationId);
    if(!leagueId || !state.tiers[leagueId]) return;
    let pool = state.tiers[leagueId].clubIds.slice();
    Object.values(CLUB_META).forEach(c=>{ if(c.hidden && c.shadowOf===leagueId) pool.push(c.id); });
    pool = shuffleArr(pool);
    state.natCups[nationId] = {
      name: NATIONAL_CUPS[nationId],
      pairings: makeBracketPairs(pool),
      round: 0,
      champion: null,
    };
  });
}

// One round of a national cup. Returns the user's tie if they were involved.
function advanceNationalCup(nationId){
  const cup = state.natCups && state.natCups[nationId];
  if(!cup || cup.champion || !cup.pairings) return null;
  const winners = [];
  let userTie = null;
  cup.pairings.forEach(([a,b])=>{
    const res = resolveCupTie(a,b);
    winners.push(res.winner);
    if(!res.bye){
      if(a===state.clubId || b===state.clubId){
        // Prize money scales with how far you've gone.
        const prize = Math.round(40000 * Math.pow(2.1, cup.round));
        clubById(state.clubId).balance += prize;
        userTie = {a, b, hg:res.hg, ag:res.ag, prize, round:cup.round};
      } else {
        recordQuickStats(a, res.hg, res.ag);
        recordQuickStats(b, res.ag, res.hg);
      }
    }
  });
  cup.round++;
  if(winners.length === 1){
    cup.champion = winners[0];
    if(cup.champion === state.clubId){
      clubById(state.clubId).balance += 2500000;
      state.honours.cups.push({name:cup.name, season:state.season});
      pushNews(cup.name + " winners!", `${clubById(state.clubId).name} have won the ${cup.name}.`, "trophy");
    }
  } else {
    const next = [];
    for(let i=0;i+1<winners.length;i+=2) next.push([winners[i], winners[i+1]]);
    cup.pairings = next;
  }
  return userTie;
}

// Every national cup winner, for European qualification.
function nationalCupWinners(){
  const out = [];
  if(state.cups && state.cups.facup && state.cups.facup.champion) out.push(state.cups.facup.champion);
  Object.keys(state.natCups||{}).forEach(n=>{
    const c = state.natCups[n];
    if(c && c.champion) out.push(c.champion);
  });
  return out;
}


/* =========================================================================
   FORMATIONS, TEAM SELECTION AND TACTICS
   You now pick your shape, your XI and your approach. A bad run can genuinely
   be turned around by changing formation or mentality, and picking a youngster
   gives him the game time he needs to grow toward his potential.
   ========================================================================= */
const FORMATIONS = {
  "4-4-2":   {gk:1, df:4, md:4, fw:2, attack:1.00, defense:1.00, desc:"Balanced and familiar."},
  "4-3-3":   {gk:1, df:4, md:3, fw:3, attack:1.10, defense:0.94, desc:"Attacking width, lighter in midfield."},
  "4-2-3-1": {gk:1, df:4, md:5, fw:1, attack:1.02, defense:1.06, desc:"Control the middle, one up top."},
  "3-5-2":   {gk:1, df:3, md:5, fw:2, attack:1.06, defense:0.96, desc:"Overload midfield, exposed at the back."},
  "5-3-2":   {gk:1, df:5, md:3, fw:2, attack:0.90, defense:1.14, desc:"Defensive solidity, hard to break down."},
  "4-5-1":   {gk:1, df:4, md:5, fw:1, attack:0.88, defense:1.12, desc:"Contain and frustrate."},
};

const MENTALITIES = {
  defensive:  {attack:0.86, defense:1.14, label:"Defensive"},
  cautious:   {attack:0.94, defense:1.07, label:"Cautious"},
  balanced:   {attack:1.00, defense:1.00, label:"Balanced"},
  positive:   {attack:1.08, defense:0.95, label:"Positive"},
  attacking:  {attack:1.18, defense:0.86, label:"Attacking"},
};

const PRESSING = {
  low:    {attack:0.97, defense:1.06, stamina:0.9,  label:"Low block"},
  normal: {attack:1.00, defense:1.00, stamina:1.0,  label:"Standard"},
  high:   {attack:1.07, defense:0.94, stamina:1.18, label:"High press"},
};

function defaultTactics(){
  return { formation:"4-4-2", mentality:"balanced", pressing:"normal" };
}

// Which positions a formation needs, as a flat list.
function formationSlots(name){
  const f = FORMATIONS[name] || FORMATIONS["4-4-2"];
  const slots = [];
  for(let i=0;i<f.gk;i++) slots.push("GK");
  for(let i=0;i<f.df;i++) slots.push("DF");
  for(let i=0;i<f.md;i++) slots.push("MD");
  for(let i=0;i<f.fw;i++) slots.push("FW");
  return slots;
}

// Auto-pick the best available XI for a formation.
function autoPickXI(squad, formationName){
  const slots = formationSlots(formationName);
  const avail = squad.filter(isAvailable).slice().sort((a,b)=>b.overall-a.overall);
  const used = new Set();
  const xi = [];
  slots.forEach(pos=>{
    const p = avail.find(x=>x.pos===pos && !used.has(x.id));
    if(p){ used.add(p.id); xi.push(p); }
  });
  // Fill any gaps out of position if necessary — but outfielders first, so a
  // thin squad never ends up fielding two goalkeepers.
  avail.forEach(p=>{
    if(xi.length<11 && !used.has(p.id) && p.pos!=="GK"){ used.add(p.id); xi.push(p); }
  });
  // Only if there is genuinely nobody else left.
  avail.forEach(p=>{ if(xi.length<11 && !used.has(p.id)){ used.add(p.id); xi.push(p); } });
  return xi;
}

// The user's chosen XI, validated: anyone injured, sold or missing is replaced.
function userStartingXI(){
  const squad = state.squads[state.clubId] || [];
  const tac = state.tactics || defaultTactics();
  if(!state.lineup || state.lineup.length !== 11) return autoPickXI(squad, tac.formation);
  const byId = {};
  squad.forEach(p=>byId[p.id]=p);
  const picked = state.lineup.map(id=>byId[id]).filter(p=>p && isAvailable(p));
  if(picked.length === 11) return picked;
  // Patch the holes rather than throwing the whole selection away.
  const used = new Set(picked.map(p=>p.id));
  const slots = formationSlots(tac.formation);
  const needed = slots.slice(picked.length);
  const avail = squad.filter(p=>isAvailable(p) && !used.has(p.id)).sort((a,b)=>b.overall-a.overall);
  needed.forEach(pos=>{
    const p = avail.find(x=>x.pos===pos && !used.has(x.id)) || avail.find(x=>!used.has(x.id));
    if(p){ used.add(p.id); picked.push(p); }
  });
  return picked.slice(0,11);
}

// How well the chosen XI fits the shape — playing people out of position hurts.
function formationFitPenalty(xi, formationName){
  const slots = formationSlots(formationName).slice();
  let mismatches = 0;
  xi.forEach(p=>{
    const i = slots.indexOf(p.pos);
    if(i >= 0) slots.splice(i,1);
    else mismatches++;
  });
  return 1 - Math.min(mismatches, 5) * 0.035;   // up to ~17% off for a badly picked side
}

// Combined tactical multipliers for the user's club.
function userTacticalMultipliers(){
  const tac = state.tactics || defaultTactics();
  const f = FORMATIONS[tac.formation] || FORMATIONS["4-4-2"];
  const m = MENTALITIES[tac.mentality] || MENTALITIES.balanced;
  const pr = PRESSING[tac.pressing] || PRESSING.normal;
  const xi = userStartingXI();
  const fit = formationFitPenalty(xi, tac.formation);
  return {
    attack:  f.attack * m.attack * pr.attack * fit,
    defense: f.defense * m.defense * pr.defense * fit,
    stamina: pr.stamina,
    xi,
  };
}

/* =========================================================================
   IN-SEASON FORM AND DEVELOPMENT
   Ratings now move during the season, not only at the summer rollover. Young
   players who are actually playing improve; anyone rotting on the bench, or
   past his peak, slips. This is what makes team selection matter.
   ========================================================================= */
function runInSeasonDevelopment(){
  const squad = state.squads[state.clubId] || [];
  const club = clubById(state.clubId);
  if(!club) return [];
  const changes = [];
  const played = state.seasonStats ? state.seasonStats.played : 0;
  if(played < 4) return [];

  squad.forEach(p=>{
    if(!isAvailable(p)) return;
    const share = (p.apps||0) / Math.max(1, played);
    const gap = (p.potential || p.overall) - p.overall;
    const training = club.facilities ? club.facilities.training : 1;
    let chance = 0;

    if(p.age <= 23 && gap > 0){
      // Regular football is what turns potential into ability.
      chance = 0.04 * share * (1 + training*0.15) * Math.min(gap, 6);
    } else if(p.age <= 28 && gap > 0){
      chance = 0.015 * share * (1 + training*0.1) * Math.min(gap, 4);
    }
    // Form feeds in: a player in good touch kicks on.
    const f = formAverage(p);
    if(f !== null){ if(f >= 7.4) chance *= 1.5; else if(f <= 6.2) chance *= 0.5; }

    if(chance > 0 && Math.random() < chance){
      const k = pick(["pace","passing","shooting","defending","physical"]);
      if(p[k] < 20){
        p[k]++; recomputeOverall(p);
        if(p.overall > (p.potential||20)) p.potential = p.overall;
        changes.push({p, dir:1});
      }
    }

    // Decline: older players who aren't playing lose their edge mid-season.
    if(p.age >= 31 && share < 0.35 && Math.random() < 0.02){
      const k = pick(["pace","physical"]);
      if(p[k] > 1){ p[k]--; recomputeOverall(p); changes.push({p, dir:-1}); }
    }
  });
  return changes;
}

/* =========================================================================
   SIGNING INTEREST — players decide whether they actually want to join you.
   A world-class footballer will not drop into a lower division because you can
   technically afford him. Young prospects are more open to a move, and more
   open still to a loan where they'll get games.
   ========================================================================= */
function signingInterest(player, buyingClub, kind){
  const from = clubById(player.clubId);
  const buyerPrestige = clubPrestige(buyingClub);
  const rating = ratingOf(player);
  const pot = potentialOf(player);
  // What level of club a player of this calibre expects.
  const expected = clamp((Math.max(rating, pot*0.85) - 40) * 1.55, 5, 95);
  const gap = expected - buyerPrestige;

  if(kind === "loan"){
    // A loan is about game time, so prospects drop down more readily — but a
    // parent club still sends them somewhere appropriate, not five levels down.
    if(player.age <= 21) return {willing: gap < 22, chance:1, reason:"wants regular football"};
    if(player.age <= 23) return {willing: gap < 16, chance:1, reason:"wants regular football"};
    return {willing: gap < 10, chance:1, reason:"open to a temporary move"};
  }
  if(gap <= 0)  return {willing:true, reason:"sees this as a step up"};
  if(gap <= 8)  return {willing:true, reason:"is open to the move"};
  if(gap <= 18){
    // Persuadable, but you'll need to be convincing — money helps.
    return {willing:true, reason:"would need convincing", wageDemand:1.35};
  }
  if(gap <= 30 && player.age <= 21){
