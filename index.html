     installs to a home screen as a standalone app once hosted. -->

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  :root{
    --bg:#0A0D12; --surface:#131822; --surface-2:#1B2230; --hairline:rgba(255,255,255,0.09);
    --text:#F2F4F8; --text-dim:#8B93A7; --accent:#E8B94E; --accent-ink:#14110A;
    --good:#3FBF6F; --bad:#E2544A;
    --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; overscroll-behavior:none;}
  body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; display:flex; justify-content:center;}
  #shell{width:100%; max-width:480px; min-height:100vh; display:flex; flex-direction:column; position:relative;}
  .num,.score,h1,h2,.brand{font-family:'Barlow Condensed',-apple-system,sans-serif; font-weight:700; letter-spacing:0.01em;}

  #topbar{display:flex; align-items:center; gap:10px; padding:calc(14px + var(--safe-top)) 16px 12px;
    background:linear-gradient(180deg, var(--surface), var(--bg) 130%); border-bottom:1px solid var(--hairline);
    position:sticky; top:0; z-index:5;}
  #topbar .info{flex:1; min-width:0;}
  #topbar .club-name{font-size:19px; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #topbar .meta{font-size:12px; color:var(--text-dim); margin-top:1px;}
  #topbar .balance{font-size:15px; text-align:right; white-space:nowrap;}
  #topbar .balance .label{font-size:10.5px; color:var(--text-dim); display:block; font-weight:400; font-family:inherit;}
  #topbar .menu-btn{background:var(--surface-2); border:none; color:var(--text); width:32px; height:32px; border-radius:50%;
    font-size:15px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}

  #content{flex:1; overflow-y:auto; padding:16px 16px calc(24px + var(--safe-bottom));}
  .screen{display:none; animation:fadeIn .2s ease;}
  .screen.active{display:block;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  /* Nav and advance bar are fixed to the viewport so they never scroll away. */
  #navbar{display:flex; border-top:1px solid var(--hairline); background:var(--surface);
    position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:480px;
    padding-bottom:var(--safe-bottom); z-index:8;}
  #advanceFab{position:fixed; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
    bottom:calc(52px + var(--safe-bottom)); z-index:7;}
  #content{padding-bottom:calc(132px + var(--safe-bottom)) !important;}
  .nav-btn{flex:1; background:none; border:none; color:var(--text-dim); padding:10px 0 8px; font-size:10.5px;
    font-family:inherit; display:flex; flex-direction:column; align-items:center; gap:4px;}
  .nav-btn .dot{width:6px; height:6px; border-radius:50%; background:transparent;}
  .nav-btn.active{color:var(--text);}
  .nav-btn.active .dot{background:var(--accent);}

  .shield{position:relative; display:inline-block; flex-shrink:0;}
  .shield svg{display:block;}
  .shield .initials{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Barlow Condensed','Helvetica Neue',Arial Narrow,system-ui,sans-serif; font-weight:700; letter-spacing:0.02em;}

  .tier-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-bottom:14px;}
  .tier-tab{flex-shrink:0; padding:7px 12px; border-radius:20px; border:1px solid var(--hairline); background:var(--surface);
    color:var(--text-dim); font-size:12.5px; font-family:inherit; white-space:nowrap;}
  .tier-tab.active{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:600;}

  .section-title{font-size:14px; color:var(--text-dim); margin:22px 0 10px; font-weight:600;}
  .section-title:first-child{margin-top:0;}
  .hero-card{background:var(--surface); border:1px solid var(--hairline); border-radius:14px; padding:16px;}
  .hero-vs{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .hero-vs .side{flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0;}
  .hero-vs .side .name{font-size:13.5px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .hero-vs .mid{font-size:13px; color:var(--text-dim); padding:0 8px;}

  .btn-primary{width:100%; margin-top:16px; padding:14px; border:none; border-radius:11px; background:var(--accent);
    color:var(--accent-ink); font-size:16px; font-weight:700; font-family:'Barlow Condensed','Helvetica Neue',Arial Narrow,system-ui,sans-serif; letter-spacing:0.02em;}
  .btn-primary:disabled{opacity:0.5;}
  .btn-secondary{width:100%; margin-top:10px; padding:12px; border:1px solid var(--hairline); border-radius:11px;
    background:transparent; color:var(--text); font-size:14px; font-family:inherit;}
  .btn-danger{color:var(--bad); border-color:rgba(226,84,74,0.35);}
  .btn-row{display:flex; gap:8px; margin-top:10px;}
  .btn-row .btn-secondary{margin-top:0;}

  .stat-row{display:flex; gap:10px; margin-top:14px;}
  .stat-box{flex:1; background:var(--surface); border:1px solid var(--hairline); border-radius:11px; padding:10px 12px; min-width:0;}
  .stat-box .v{font-size:19px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .stat-box .l{font-size:10.5px; color:var(--text-dim); margin-top:2px;}

  .list{background:var(--surface); border:1px solid var(--hairline); border-radius:14px; overflow:hidden;}
  .row{display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--hairline);}
  .row:last-child{border-bottom:none;}
  .row.me{background:rgba(255,255,255,0.035);}
  .row .pos-tag{width:28px; height:20px; border-radius:5px; background:var(--surface-2); color:var(--text-dim);
    font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-weight:600;}
  .row .pname{flex:1; font-size:14px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row .pname .tag{font-size:10px; color:var(--accent); margin-left:5px; font-weight:600;}
  .row .ovr{font-size:15px; color:var(--text-dim); width:22px; text-align:right; flex-shrink:0;}
  .row .age{font-size:12px; color:var(--text-dim); width:20px; text-align:right; flex-shrink:0;}
  .row.market-row .pinfo{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px;}
  .row.market-row .pinfo .name-line{font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row.market-row .pinfo .price-line{font-size:11.5px; font-weight:600;}

  .table-row{display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--hairline); font-size:12.5px;}
  .table-row:last-child{border-bottom:none;}
  .table-row.me{background:rgba(255,255,255,0.035);}
  .table-row.promo{box-shadow:inset 3px 0 0 var(--good);}
  .table-row.playoff{box-shadow:inset 3px 0 0 #E8B94E;}
  .table-row.releg{box-shadow:inset 3px 0 0 var(--bad);}
  .table-row .rank{width:16px; color:var(--text-dim); text-align:right; flex-shrink:0;}
  .table-row .tname{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .table-row .col{width:24px; text-align:right; color:var(--text-dim); flex-shrink:0;}
  .table-row .pts{width:26px; text-align:right; font-weight:700; color:var(--text); flex-shrink:0;}
  .table-head{display:flex; gap:8px; padding:6px 12px; font-size:10.5px; color:var(--text-dim);}
  .table-head span{width:24px; text-align:right; flex-shrink:0;}
  .table-head span:first-child{width:16px;}
  .table-head span:nth-child(2){flex:1; text-align:left; width:auto;}
  .table-head span:last-child{width:26px;}
  .legend{display:flex; gap:14px; margin-top:10px; font-size:11px; color:var(--text-dim); flex-wrap:wrap;}
  .legend span{display:flex; align-items:center; gap:5px;}
  .legend i{width:8px; height:8px; border-radius:2px; display:inline-block;}

  #clubSelect{padding:calc(20px + var(--safe-top)) 20px 20px; display:flex; flex-direction:column; height:100%;}
  #clubSelect h1{font-size:28px; margin:0 0 4px;}
  #clubSelect p{color:var(--text-dim); font-size:13.5px; margin:0 0 16px; line-height:1.5;}
  .club-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; overflow-y:auto;}
  .club-pick{background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:6px; padding:5px 0;}
  .club-pick .cname{font-size:10.5px; color:var(--text-dim); text-align:center; line-height:1.2;}
  .club-pick:active .shield{transform:scale(0.93);}

  .search-input{width:100%; padding:12px 14px; border-radius:11px; border:1px solid var(--hairline);
    background:var(--surface); color:var(--text); font-size:14px; font-family:inherit; margin-bottom:14px;}
  .search-input::placeholder{color:var(--text-dim);}
  .empty-hint{text-align:center; color:var(--text-dim); font-size:13px; padding:40px 20px;}

  .facility-card{background:var(--surface); border:1px solid var(--hairline); border-radius:14px; padding:14px; margin-bottom:12px;}
  .facility-card .top{display:flex; justify-content:space-between; align-items:baseline;}
  .facility-card .name{font-size:15px;}
  .facility-card .lvl{font-size:12px; color:var(--text-dim);}
  .facility-card .desc{font-size:12.5px; color:var(--text-dim); margin-top:4px; line-height:1.4;}
  .facility-card .pips{display:flex; gap:4px; margin-top:10px;}
  .facility-card .pip{flex:1; height:5px; border-radius:3px; background:var(--surface-2);}
  .facility-card .pip.on{background:var(--accent);}
  .facility-card button{width:100%; margin-top:10px; padding:10px; border-radius:9px; border:1px solid var(--hairline);
    background:transparent; color:var(--text); font-size:13px; font-family:inherit;}
  .facility-card button:disabled{opacity:0.4;}

  .modal-backdrop{position:fixed; inset:0; background:rgba(4,6,10,0.72); display:flex; align-items:flex-end;
    z-index:20; opacity:0; pointer-events:none; transition:opacity .2s ease;}
  .modal-backdrop.open{opacity:1; pointer-events:auto;}
  .modal{width:100%; max-width:480px; margin:0 auto; background:var(--surface); border-radius:18px 18px 0 0;
    padding:20px 20px calc(22px + var(--safe-bottom)); transform:translateY(16px); transition:transform .22s ease;
    max-height:84vh; overflow-y:auto; position:relative;}
  .modal-backdrop.open .modal{transform:translateY(0);}
  .modal-close{position:absolute; top:14px; right:16px; background:var(--surface-2); border:none; color:var(--text);
    width:30px; height:30px; border-radius:50%; font-size:16px;}
  .modal h2{font-size:21px; margin:0 0 2px;}
  .modal .sub{color:var(--text-dim); font-size:13px; margin-bottom:16px;}
  .attr-bar{margin-bottom:10px;}
  .attr-bar .lbl{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; color:var(--text-dim);}
  .attr-bar .lbl b{color:var(--text); font-weight:600;}
  .attr-track{height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden;}
  .attr-fill{height:100%; background:var(--accent); border-radius:3px;}

  #matchModal .score-line{display:flex; align-items:center; justify-content:center; gap:14px; margin:16px 0 6px;}
  #matchModal .score-line .side{flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; min-width:0;}
  #matchModal .score-line .side .n{font-size:12.5px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  #matchModal .score-num{font-size:42px; min-width:42px; text-align:center;}
  #matchModal .score-num.flash{animation:goalFlash .5s ease;}
  @keyframes goalFlash{0%{color:var(--accent); transform:scale(1.35);} 100%{color:var(--text); transform:scale(1);}}
  #matchModal .feed{margin-top:16px; display:flex; flex-direction:column; gap:8px; min-height:110px;}
  #matchModal .feed .line{font-size:12.5px; color:var(--text-dim); opacity:0; transform:translateY(4px);
    transition:opacity .25s ease, transform .25s ease;}
  #matchModal .feed .line.show{opacity:1; transform:none;}
  #matchModal .feed .line b{color:var(--text); font-weight:600;}
  #matchModal .ft-label{text-align:center; font-size:12px; color:var(--text-dim); margin-top:2px;}

  #seasonModal .movement{font-size:15px; margin:4px 0 2px;}
  #seasonModal .movement.up{color:var(--good);}
  #seasonModal .movement.down{color:var(--bad);}
  #seasonModal .youth-item{display:flex; justify-content:space-between; font-size:13px; padding:8px 0; border-bottom:1px solid var(--hairline);}
  #seasonModal .youth-item:last-child{border-bottom:none;}

  .toast{position:fixed; left:50%; bottom:calc(78px + var(--safe-bottom)); transform:translate(-50%,8px);
    background:var(--surface-2); border:1px solid var(--hairline); color:var(--text); font-size:13px;
    padding:10px 16px; border-radius:22px; opacity:0; transition:opacity .25s ease, transform .25s ease;
    z-index:30; max-width:88%; text-align:center; box-shadow:0 6px 20px rgba(0,0,0,0.35);}
  .toast.show{opacity:1; transform:translate(-50%,0);}

  .finance-list{background:var(--surface); border:1px solid var(--hairline); border-radius:14px; padding:4px 14px; margin-bottom:16px;}
  .finance-row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--hairline); font-size:13px;}
  .finance-row:last-child{border-bottom:none; font-weight:700;}
  .finance-row .neg{color:var(--bad);}
  .finance-row .pos{color:var(--good);}

  /* ---- Start screen ---- */
  #startScreen{display:none; flex-direction:column; align-items:center; justify-content:center; flex:1;
    min-height:100vh; position:relative; overflow:hidden; padding:32px 28px calc(32px + var(--safe-bottom));
    text-align:center;}
  /* A floodlit ground at dusk, built from gradients — quiet, not busy. */
  #startScreen .sky{position:absolute; inset:0 0 46% 0; z-index:0;
    background:linear-gradient(180deg,#05070C 0%,#0B1020 45%,#141C31 100%);}
  #startScreen .floodlights{position:absolute; inset:0 0 46% 0; z-index:0;}
  #startScreen .floodlights span{position:absolute; top:6%; width:2px; height:16%;
    background:linear-gradient(180deg, rgba(255,255,255,0.35), transparent);}
  #startScreen .floodlights span:before{content:""; position:absolute; top:-7px; left:-11px;
    width:24px; height:11px; border-radius:3px; background:#FFF6DA;
    box-shadow:0 0 26px 10px rgba(255,240,200,0.30), 0 0 70px 26px rgba(255,235,180,0.13);
    animation:lampPulse 5s ease-in-out infinite;}
  #startScreen .floodlights span:nth-child(1){left:12%;}
  #startScreen .floodlights span:nth-child(2){left:34%;}
  #startScreen .floodlights span:nth-child(3){left:64%;}
  #startScreen .floodlights span:nth-child(4){left:86%;}
  #startScreen .floodlights span:nth-child(2):before{animation-delay:1.2s;}
  #startScreen .floodlights span:nth-child(3):before{animation-delay:2.4s;}
  #startScreen .floodlights span:nth-child(4):before{animation-delay:3.1s;}
  @keyframes lampPulse{0%,100%{opacity:0.85;}50%{opacity:1;}}
  #startScreen .stand{position:absolute; left:0; right:0; top:34%; height:14%; z-index:0;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 5px),
      linear-gradient(180deg,#171E2E,#0D1220);
    border-bottom:1px solid rgba(255,255,255,0.08);}
  #startScreen .turf{position:absolute; left:0; right:0; top:48%; bottom:0; z-index:0; overflow:hidden;
    background:linear-gradient(180deg,#153A22 0%,#0C2416 100%);}
  #startScreen .turf-lines{position:absolute; inset:0;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,0.028) 0 22px, transparent 22px 44px);
    transform:perspective(300px) rotateX(62deg); transform-origin:50% 0%;}
  #startScreen .bg-glow{position:absolute; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse at 50% 38%, rgba(232,185,78,0.16), transparent 60%),
      linear-gradient(180deg, transparent 40%, rgba(5,7,12,0.86) 78%);
    animation:glowDrift 9s ease-in-out infinite;}
  @keyframes glowDrift{0%,100%{opacity:0.7; transform:scale(1);} 50%{opacity:1; transform:scale(1.08);}}
  #startScreen .stripes{position:absolute; inset:0; z-index:0; opacity:0.05;
    background:repeating-linear-gradient(115deg, #fff 0 2px, transparent 2px 46px);
    animation:stripeDrift 26s linear infinite;}
  @keyframes stripeDrift{from{background-position:0 0;} to{background-position:400px 0;}}
  #startScreen .inner{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; width:100%; max-width:320px;}
  #startScreen .app-icon{width:78px; height:78px; border-radius:20px; margin-bottom:14px;
    box-shadow:0 0 0 1px var(--hairline), 0 14px 34px rgba(232,185,78,0.18);
    animation:iconPop .6s cubic-bezier(.2,.9,.25,1.15) both, iconFloat 4.5s ease-in-out 0.6s infinite;}
  @keyframes iconPop{from{opacity:0; transform:scale(0.7) translateY(10px);} to{opacity:1; transform:scale(1) translateY(0);}}
  @keyframes iconFloat{0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);}}
  #startScreen h1{font-size:52px; margin:0; letter-spacing:0.02em; opacity:0;
    animation:riseIn .55s ease 0.15s forwards;
    background:linear-gradient(180deg,#FFF6DE 0%,var(--accent) 62%,#9A7529 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 4px 18px rgba(232,185,78,0.35));}
  #startScreen .tagline{font-size:12.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-dim);
    margin:2px 0 30px; opacity:0; animation:riseIn .55s ease 0.28s forwards;}
  @keyframes riseIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  #startScreen .menu{width:100%; display:flex; flex-direction:column; gap:10px;}
  #startScreen .menu button{opacity:0; animation:riseIn .5s ease forwards;}
  #startScreen .menu button:nth-child(1){animation-delay:0.4s;}
  #startScreen .menu button:nth-child(2){animation-delay:0.5s;}
  #startScreen .menu button:nth-child(3){animation-delay:0.6s;}
  #startScreen .continue-sub{display:block; font-size:11.5px; font-weight:400; margin-top:2px; opacity:0.75;}
  .world-stats{position:relative; z-index:2; display:flex; gap:8px; margin-top:24px; width:100%; max-width:320px;
    opacity:0; animation:riseIn .5s ease 0.7s forwards;}
  .world-stats .ws{flex:1; background:rgba(19,24,34,0.72); border:1px solid var(--hairline);
    border-radius:11px; padding:9px 6px; text-align:center; backdrop-filter:blur(6px);}
  .world-stats .ws b{display:block; font-family:'Barlow Condensed','Helvetica Neue',Arial Narrow,system-ui,sans-serif; font-size:19px; color:var(--text);}
  .world-stats .ws span{font-size:9.5px; color:var(--text-dim); letter-spacing:0.04em; text-transform:uppercase;}

  /* ---- Settings ---- */
  #settingsScreen{padding:calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom)); display:none; flex-direction:column; height:100%; overflow-y:auto;}
  #settingsScreen h1{font-size:26px; margin:0 0 18px;}
  .setting-row{background:var(--surface); border:1px solid var(--hairline); border-radius:12px; padding:14px;
    display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px;}
  .setting-row .label{font-size:14px;}
  .setting-row .sub{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .segmented{display:flex; background:var(--surface-2); border-radius:9px; padding:3px; flex-shrink:0;}
  .segmented button{border:none; background:none; color:var(--text-dim); font-size:12px; padding:6px 11px; border-radius:7px; font-family:inherit;}
  .segmented button.active{background:var(--accent); color:var(--accent-ink); font-weight:600;}
  .switch{width:44px; height:26px; border-radius:14px; background:var(--surface-2); border:none; position:relative; flex-shrink:0;}
  .switch .knob{position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:var(--text-dim); transition:left .18s ease, background .18s ease;}
  .switch.on{background:var(--accent);}
  .switch.on .knob{left:21px; background:var(--accent-ink);}

  /* ---- Achievement toast ---- */
  .ach-toast{position:fixed; left:50%; top:calc(16px + var(--safe-top)); transform:translate(-50%,-16px);
    background:linear-gradient(135deg, var(--surface-2), var(--surface)); border:1px solid var(--accent);
    border-radius:14px; padding:11px 16px; display:flex; align-items:center; gap:12px; z-index:40;
    opacity:0; transition:opacity .3s ease, transform .3s cubic-bezier(.2,.9,.3,1.2);
    box-shadow:0 8px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(232,185,78,0.2); max-width:90%;}
  .ach-toast.show{opacity:1; transform:translate(-50%,0);}
  .ach-toast .ach-icon{font-size:24px;}
  .ach-toast .ach-unlocked{font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent);}
  .ach-toast .ach-name{font-size:15px; font-family:'Barlow Condensed','Helvetica Neue',Arial Narrow,system-ui,sans-serif; font-weight:700;}

  /* ---- Match extras ---- */
  .match-clock{text-align:center; font-size:14px; color:var(--text-dim); margin-top:-2px;}
  .match-stats{margin-top:16px; background:var(--surface-2); border-radius:11px; padding:12px 14px;}
  .ms-row{display:flex; justify-content:space-between; align-items:center; font-size:13px; margin-bottom:6px;}
  .ms-row .ms-label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em;}
  .ms-bar{display:flex; height:5px; border-radius:3px; overflow:hidden; margin-bottom:10px;}
  .ms-fill{height:100%;}
  .motm{display:flex; align-items:center; gap:11px; margin-top:14px; background:var(--surface-2);
    border-radius:11px; padding:11px 14px; border:1px solid rgba(232,185,78,0.25);}
  .motm-label{font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent);}
  .motm-name{font-size:14.5px; margin-top:1px;}

  /* ---- Avatars + squad extras ---- */
  .avatar{flex-shrink:0; background:#1B2230;}
  .row .avatar{margin-right:2px;}
  .form-dots{display:flex; gap:2px; flex-shrink:0;}
  .form-dot{width:5px; height:5px; border-radius:50%;}
  .status-tag{font-size:9.5px; padding:2px 5px; border-radius:4px; font-weight:700; letter-spacing:0.04em; flex-shrink:0;}
  .status-inj{background:rgba(226,84,74,0.2); color:var(--bad);}
  .status-sus{background:rgba(232,185,78,0.2); color:var(--accent);}
  .stat-mini{font-size:11px; color:var(--text-dim); flex-shrink:0; width:38px; text-align:right;}

  /* ---- Achievements screen ---- */
  .ach-progress{background:var(--surface); border:1px solid var(--hairline); border-radius:14px; padding:14px; margin-bottom:14px;}
  .ach-progress .big{font-size:30px;}
  .ach-progress .track{height:6px; background:var(--surface-2); border-radius:3px; margin-top:10px; overflow:hidden;}
  .ach-progress .fill{height:100%; background:var(--accent); border-radius:3px; transition:width .5s ease;}
  .ach-item{display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--hairline);}
  .ach-item:last-child{border-bottom:none;}
  .ach-item.locked{opacity:0.42;}
  .ach-item .badge{width:34px; height:34px; border-radius:50%; background:var(--surface-2); display:flex;
    align-items:center; justify-content:center; font-size:17px; flex-shrink:0;}
  .ach-item.unlocked .badge{background:rgba(232,185,78,0.16); box-shadow:0 0 0 1px rgba(232,185,78,0.35);}
  .ach-item .t{font-size:14px;}
  .ach-item .d{font-size:11.5px; color:var(--text-dim); margin-top:1px;}

  /* ---- Inbox ---- */
  .news-item.tribute{border-color:rgba(232,185,78,0.35); background:linear-gradient(180deg, rgba(232,185,78,0.06), var(--surface));}
  .news-item{background:var(--surface); border:1px solid var(--hairline); border-radius:12px; padding:12px 14px; margin-bottom:9px;}
  .news-item .nt{font-size:14px; display:flex; align-items:center; gap:7px;}
  .news-item .nb{font-size:12.5px; color:var(--text-dim); margin-top:4px; line-height:1.45;}
  .news-item .nw{font-size:10.5px; color:var(--text-dim); margin-top:6px; opacity:0.7;}

  /* ---- Board confidence ---- */
  .board-card{background:var(--surface); border:1px solid var(--hairline); border-radius:14px; padding:14px; margin-bottom:14px;}
  .board-card .obj{font-size:13px; line-height:1.45;}
  .board-card .conf-label{display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-dim); margin:12px 0 5px;}
  .board-card .conf-track{height:7px; background:var(--surface-2); border-radius:4px; overflow:hidden;}
  .board-card .conf-fill{height:100%; border-radius:4px; transition:width .6s ease;}

  /* ---- Honours ---- */
  .honour-row{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--hairline); font-size:13px;}
  .honour-row:last-child{border-bottom:none;}
  .honour-row .yr{color:var(--text-dim); font-size:11.5px; width:52px; flex-shrink:0;}

  /* ---- Market rows ---- */
  .row.market-row .pinfo .sub-line{font-size:11px; color:var(--text-dim);}
  .ovr-pair{display:flex; flex-direction:column; align-items:flex-end; gap:1px; flex-shrink:0; width:30px;}
  .ovr-pair .ovr{font-size:15px; color:var(--text); line-height:1.05;}
  .ovr-pair .pot{font-size:11.5px; color:var(--good); line-height:1.05;}
  .mkt-badge{font-size:9px; padding:2px 5px; border-radius:4px; font-weight:700; letter-spacing:0.04em; margin-left:4px;}
  .mkt-badge.free{background:rgba(63,191,111,0.2); color:var(--good);}
  .mkt-badge.listed{background:rgba(232,185,78,0.2); color:var(--accent);}
  .mkt-badge.loan{background:rgba(108,171,221,0.2); color:#6CABDD;}
  .market-count{font-size:11.5px; color:var(--text-dim); margin:2px 0 8px; text-align:right;}
  .filter-row{display:flex; gap:12px; margin-bottom:10px;}
  .filter-row label{flex:1; font-size:11.5px; color:var(--text-dim); display:flex; flex-direction:column; gap:3px;}
  .filter-row label b{color:var(--text); font-weight:600;}
  .filter-row input[type=range]{width:100%; accent-color:var(--accent);}

  .awards-strip{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:14px;}
  .award-chip{font-size:10.5px; background:rgba(232,185,78,0.14); color:var(--accent);
    border:1px solid rgba(232,185,78,0.3); border-radius:6px; padding:3px 7px;}
  .attendance-line{margin-top:10px; font-size:12px; color:var(--text-dim); text-align:center;
    background:var(--surface-2); border-radius:9px; padding:8px;}

  .injury-box{background:var(--surface-2); border:1px solid rgba(226,84,74,0.3); border-radius:10px;
    padding:10px 12px; font-size:12.5px; margin-bottom:12px; line-height:1.45;}
  .morale-line{display:flex; align-items:center; gap:9px; font-size:12px; color:var(--text-dim); margin-bottom:10px;}
  .morale-track{flex:1; height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden;}
  .morale-fill{display:block; height:100%; border-radius:3px;}
  .alert-strip{display:flex; gap:14px; justify-content:center; font-size:12px; color:var(--text-dim);
    background:var(--surface); border:1px solid var(--hairline); border-radius:11px; padding:9px; margin-bottom:12px;}

  /* Fixed advance button — always in the same place, so advancing a week is
     one tap in one location no matter which screen you're on. */
  #fabAdvance{position:fixed; right:16px; bottom:calc(74px + var(--safe-bottom)); z-index:15;
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:16px;
    padding:11px 16px; display:flex; flex-direction:column; align-items:center; gap:1px;
    box-shadow:0 6px 20px rgba(0,0,0,0.45); font-family:'Barlow Condensed','Helvetica Neue',Arial Narrow,system-ui,sans-serif;}
  #fabAdvance .fab-label{font-size:15px; font-weight:700; letter-spacing:0.04em; line-height:1;}
  #fabAdvance .fab-week{font-size:10px; opacity:0.75; line-height:1;}
  #fabAdvance:disabled{opacity:0.45;}
  #fabAdvance:active{transform:scale(0.95);}
  @media (min-width:481px){ #fabAdvance{right:calc(50% - 240px + 16px);} }

  .job-card{background:var(--surface); border:1px solid var(--accent); border-radius:14px;
    padding:14px; margin-bottom:10px;}
  .job-card .jt{font-size:15px;}
  .job-card .js{font-size:12px; color:var(--text-dim); margin-top:3px;}
  .unemployed-banner{background:linear-gradient(135deg,var(--surface-2),var(--surface));
    border:1px solid rgba(226,84,74,0.4); border-radius:14px; padding:16px; text-align:center; margin-bottom:14px;}

  /* Persistent advance button — sits directly above the nav bar so the whole
     game can be played with the thumb in one place. */
  #advanceFab{position:sticky; bottom:0; z-index:6; width:100%; border:none;
    background:var(--accent); color:var(--accent-ink); padding:12px 16px;
    font-family:'Barlow Condensed','Helvetica Neue',Arial Narrow,system-ui,sans-serif; font-weight:700; letter-spacing:0.04em;
    display:flex; align-items:center; justify-content:center; gap:10px;
    box-shadow:0 -6px 18px rgba(0,0,0,0.28);}
  #advanceFab:disabled{opacity:0.55;}
  #advanceFab .fab-label{font-size:17px;}
  #advanceFab .fab-sub{font-size:12px; font-weight:600; opacity:0.75; font-family:inherit;}
  #advanceFab.busy .fab-label{opacity:0.6;}

  .tac-grid{display:flex; flex-wrap:wrap; gap:7px;}
  .tac-opt{padding:9px 13px; border-radius:9px; border:1px solid var(--hairline);
    background:var(--surface); color:var(--text-dim); font-size:13px; font-family:inherit;}
  .tac-opt.active{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:700;}
  .tac-note{font-size:11.5px; color:var(--text-dim); margin-top:8px; line-height:1.4;}
  .lineup-btn{width:30px; height:30px; border-radius:50%; border:1px solid var(--hairline);
    background:var(--surface-2); color:var(--text); font-size:16px; flex-shrink:0;}
  .filter-row label .dual{display:flex; flex-direction:column; gap:2px;}
  .filter-row label .dual input[type=range]{width:100%;}

  #errorHost{position:fixed; left:0; right:0; top:calc(8px + var(--safe-top)); z-index:60;
    display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; padding:0 12px;}
  .err-box{pointer-events:auto; width:100%; max-width:440px; background:#2A1416;
    border:1px solid rgba(226,84,74,0.55); border-radius:12px; padding:12px 14px;
    box-shadow:0 8px 26px rgba(0,0,0,0.5);}
  .err-head{font-family:'Barlow Condensed','Helvetica Neue',Arial Narrow,system-ui,sans-serif; font-weight:700; font-size:14px; color:var(--bad); letter-spacing:0.06em;}
  .err-msg{font-size:13px; margin-top:3px; line-height:1.45;}
  .err-detail{font-size:11px; color:var(--text-dim); margin-top:6px; font-family:monospace; word-break:break-word;}
  .err-close{margin-top:9px; background:var(--surface-2); border:none; color:var(--text);
    border-radius:8px; padding:7px 12px; font-size:12.5px; font-family:inherit;}
  .offer-panel{background:var(--surface-2); border-radius:11px; padding:12px; margin-top:14px;}
  .offer-panel label{display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:var(--text-dim); margin-bottom:9px;}
  .offer-panel label b{color:var(--text); font-weight:600;}
  .offer-panel input[type=range]{width:100%; accent-color:var(--accent);}
  .offer-kind{display:flex; gap:6px; margin-bottom:11px;}
  .offer-kind button{flex:1; padding:8px 4px; border-radius:8px; border:1px solid var(--hairline);
    background:transparent; color:var(--text-dim); font-size:12px; font-family:inherit;}
  .offer-kind button.active{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:600;}
  .interest-line{font-size:11.5px; margin-top:6px;}

  .err-badge{width:38px; height:38px; border-radius:50%; background:rgba(226,84,74,0.16);
    color:var(--bad); display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:700; margin-bottom:10px;}
  .err-code{font-family:'Barlow Condensed','Helvetica Neue',Arial Narrow,system-ui,sans-serif; font-size:12px; letter-spacing:0.08em;
    color:var(--text-dim); background:var(--surface-2); display:inline-block;
    padding:4px 9px; border-radius:6px; margin-bottom:4px;}
  .interest-row{display:flex; align-items:center; gap:8px; font-size:12.5px; margin:10px 0;}
  .interest-track{flex:1; height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden;}
  .interest-fill{display:block; height:100%; border-radius:3px;}
  .clause-chip{font-size:10.5px; background:var(--surface-2); border:1px solid var(--hairline);
    border-radius:6px; padding:3px 7px; margin-right:5px; color:var(--text-dim);}
  .range-pair{display:flex; gap:8px; align-items:center;}
  .range-pair input[type=range]{flex:1;}

  .pitch{position:relative; width:100%; padding-bottom:132%; border-radius:12px;
    background:linear-gradient(180deg,#16351f,#112a19); border:1px solid var(--hairline);
    overflow:hidden; margin-bottom:10px;}
  .pitch-lines{position:absolute; inset:0;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0 30px, transparent 30px 60px),
      radial-gradient(circle at 50% 50%, transparent 40px, rgba(255,255,255,0.12) 40px, rgba(255,255,255,0.12) 42px, transparent 42px);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,0.09);}
  .pitch-lines:before,.pitch-lines:after{content:""; position:absolute; left:24%; width:52%; height:12%;
    border:2px solid rgba(255,255,255,0.10);}
  .pitch-lines:before{top:0; border-top:none;}
  .pitch-lines:after{bottom:0; border-bottom:none;}
  .pitch-slot{position:absolute; transform:translate(-50%,-50%); width:50px; height:50px; border-radius:50%;
    background:var(--accent); color:var(--accent-ink); border:2px solid rgba(0,0,0,0.28); padding:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .pitch-slot .ps-rating{font-size:15px; line-height:1.05;}
  .pitch-slot .ps-name{font-size:8.5px; max-width:46px; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; font-weight:700;}
  .pitch-slot .ps-warn{position:absolute; top:-5px; right:-5px; background:var(--bad); color:#fff;
    font-size:8px; padding:1px 4px; border-radius:5px; font-weight:700;}
  .pitch-slot.wrong{background:#C9993C;}
  .pitch-slot.empty{background:rgba(255,255,255,0.10); border:2px dashed rgba(255,255,255,0.45); color:var(--text);}
  .pitch-slot.empty .ps-pos{font-size:12px; font-weight:700; font-family:'Barlow Condensed','Helvetica Neue',Arial Narrow,system-ui,sans-serif;}
  .pitch-slot.selected{box-shadow:0 0 0 3px var(--text); z-index:3;}
  .pitch-hint{font-size:11.5px; color:var(--text-dim); text-align:center; margin-bottom:10px;}
  /* Desktop squad layout: formation and squad remain side-by-side. */
  @media (min-width:700px){
    body{align-items:stretch;}
    #shell{max-width:1400px; min-height:100vh;}
    #mainApp{min-height:100vh;}
    #content{min-height:0; padding-left:28px; padding-right:28px; padding-bottom:140px;}
    #navbar{max-width:1400px;}
    #advanceFab{max-width:1400px;}
    .pitch-wrap{display:grid; grid-template-columns:minmax(420px,0.9fr) minmax(500px,1.1fr); gap:24px; align-items:start;}
    .pitch-col{min-width:0; max-width:600px; width:100%; justify-self:center;}
    .bench-col{min-width:0; height:calc(100vh - 230px); display:flex; flex-direction:column;}
    .bench-col .list{flex:1; min-height:0; overflow-y:auto;}
  }
  @media (max-width:699px){
    .pitch-wrap{display:block;}
  }

  .window-strip{font-size:11.5px; text-align:center; padding:8px; border-radius:10px; margin-bottom:12px;
    border:1px solid var(--hairline);}
  .window-strip.open{background:rgba(63,191,111,0.10); color:var(--good);}
  .window-strip.shut{background:rgba(226,84,74,0.08); color:var(--text-dim);}
  .cond-pill{font-size:10.5px; font-family:'Barlow Condensed','Helvetica Neue',Arial Narrow,system-ui,sans-serif; font-weight:700;
    padding:2px 5px; border-radius:5px; flex-shrink:0; min-width:26px; text-align:center;}

  .match-occasion{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:6px 0 2px;}
  .occ{font-size:10px; padding:3px 8px; border-radius:12px; border:1px solid var(--hairline);
    background:var(--surface-2); color:var(--text-dim); letter-spacing:0.04em;}
  .occ.derby{background:rgba(226,84,74,0.16); color:var(--bad); border-color:rgba(226,84,74,0.35); font-weight:700;}
  .occ.stakes{background:rgba(232,185,78,0.14); color:var(--accent); border-color:rgba(232,185,78,0.3);}
  #matchModal .feed .line.yellow{border-left:2px solid #E8B94E; padding-left:7px;}
  #matchModal .feed .line.red{border-left:2px solid var(--bad); padding-left:7px; color:var(--text);}

  .conv-list{display:flex; flex-direction:column; gap:8px; margin-bottom:12px;}
  .conv-card{display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    background:linear-gradient(180deg, rgba(232,185,78,0.10), var(--surface));
    border:1px solid rgba(232,185,78,0.30); border-radius:12px; padding:11px 13px; color:var(--text);}
  .conv-card .cc-icon{font-size:18px;}
  .conv-card .cc-body{flex:1; font-size:13.5px; line-height:1.3;}
  .conv-card .cc-go{color:var(--text-dim); font-size:20px;}
  .conv-speech{background:var(--surface-2); border-radius:12px; padding:13px 15px; font-size:13.5px;
    line-height:1.5; margin-bottom:14px; border-left:3px solid var(--accent);}
  .conv-opt{text-align:left; line-height:1.35;}
  .conv-note{display:block; font-size:11px; color:var(--text-dim); margin-top:3px; font-weight:400;}
  .leader-row{display:flex; align-items:center; gap:9px; font-size:12px; color:var(--text-dim); margin-bottom:10px;}
  .leader-track{flex:1; height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden;}

  if(KNOWN_COLORS[name]) return {primary:KNOWN_COLORS[name][0], secondary:KNOWN_COLORS[name][1], known:true};

}
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); }

// Welsh clubs playing in the English pyramid — these produce Welsh-skewed intakes.
const WELSH_CLUBS = new Set(["Cardiff City","Swansea City","Wrexham","Newport County"]);

function nationOfClub(club){
  if(club.leagueNation) return club.leagueNation;
  if(WELSH_CLUBS.has(club.name)) return "wales";
  return "england";
}

function rollNationality(club){
  const pool = NATION_PRODUCTION[nationOfClub(club)] || NATION_PRODUCTION.england;
  const total = pool.reduce((s,p)=>s+p[1],0);
  let roll = Math.random()*total;
  for(const [nat,weight] of pool){ roll -= weight; if(roll<=0) return nat; }
  return pool[0][0];
}

function nameForNationality(nat){
  const bank = NATIONALITIES[nat] || NATIONALITIES.English;
  return {first: pick(bank.first), last: pick(bank.last)};
}
function flagFor(nat){
  if(!nat || nat==="UNKNOWN") return "";               // no flag beats a wrong flag
  return (NATIONALITIES[nat] && NATIONALITIES[nat].flag) || "🌍";
}
function natLabel(nat){ return (!nat || nat==="UNKNOWN") ? "—" : nat; }

let CLUB_META = {}; // id -> {id,name,tier,primary,secondary,colorsKnown,crestVariant,balance,facilities}

function slugify(name){ return name.toLowerCase().replace(/[^a-z0-9]+/g,""); }

// Helpers that let the rest of the game treat English tiers and foreign top
// divisions uniformly. English tiers keep promotion/relegation between them;
// foreign top divisions are single-tier closed leagues in this build.
function getAllLeagueIds(){ return TIERS.map(t=>t.id).concat(Object.keys(FOREIGN_LEAGUES)); }
function isForeignLeague(id){ return !!FOREIGN_LEAGUES[id]; }
function isTopDivision(id){ return id==="premierleague" || isForeignLeague(id); }
function leagueNationId(id){ return isForeignLeague(id) ? FOREIGN_LEAGUES[id].nation : "england"; }
function leagueDisplayName(id){ return isForeignLeague(id) ? FOREIGN_LEAGUES[id].name : tierName(id); }
function leagueShort(id){ return isForeignLeague(id) ? FOREIGN_LEAGUES[id].short : tierShort(id); }
function clubNamesFor(id){ return isForeignLeague(id) ? FOREIGN_CLUB_NAMES[id] : CLUB_NAMES[id]; }

// Build-time integrity check. A player appearing at two clubs would be created
// twice — this catches it at boot rather than letting it hide in a save.
// Ben Davies is deliberately allowed: the Spurs left-back and the Bolton
// centre-back are two different people who share a name.
const DUPLICATE_ALLOWLIST = new Set(["ben davies"]);
function auditPlayerData(){
  const rows = [].concat(
    REAL_PLAYERS.map(r=>({club:r[0], name:(r[1]+" "+r[2]).trim()})),
    EURO_REAL_PLAYERS.map(r=>({club:r[0], name:(r[1]+" "+r[2]).trim()})),
    EURO_REAL_PLAYERS_2.map(r=>({club:r[0], name:(r[1]+" "+r[2]).trim()})),
    CARDIFF_AND_WALES.map(r=>({club:r[0], name:(r[1]+" "+r[2]).trim()})),
    WONDERKIDS.map(r=>({club:r[0], name:(r[1]+" "+r[2]).trim()}))
  );
  const byName = {};
  rows.forEach(r=>{ const k=r.name.toLowerCase(); (byName[k]=byName[k]||[]).push(r.club); });
  const offenders = [];
  Object.keys(byName).forEach(k=>{
    if(DUPLICATE_ALLOWLIST.has(k)) return;
    const clubs = [...new Set(byName[k])];
    if(clubs.length > 1) offenders.push(k + " (" + clubs.join(", ") + ")");
  });
  if(offenders.length) console.warn("[data] player listed at multiple clubs:", offenders.join("; "));
  return offenders;
}

function buildClubMeta(){
  CLUB_META = {};
  // Foreign top divisions first, so their clubs exist before Europe is seeded.
  Object.keys(FOREIGN_LEAGUES).forEach(lid=>{
    const lg = FOREIGN_LEAGUES[lid];
    FOREIGN_CLUB_NAMES[lid].forEach((name, idx)=>{
      const id = slugify(name);
      const {primary,secondary,known} = clubColors(name);
      // Strength roughly tracks listed order, which I ordered by real standing.
      const eliteness = 1 - (idx / FOREIGN_CLUB_NAMES[lid].length);
      const nationBoost = {spain:1.0, italy:0.95, germany:0.95, france:0.9,
        portugal:0.62, netherlands:0.6, belgium:0.5, scotland:0.48}[lg.nation] || 0.5;
      CLUB_META[id] = {
        id, name, tier:lid, leagueId:lid, leagueNation:lg.nation,
        primary, secondary, colorsKnown:known, crestVariant:hashStr(name)%6,
        balance: Math.round((15e6 + eliteness*380e6) * nationBoost),
        capacity: Math.round(12000 + eliteness*70000*nationBoost),
        facilities:{stadium:1,training:1,youth:1,medical:1},
        eliteness, nationBoost,
      };
    });
  });
  // Shadow (hidden) second-tier clubs for every foreign nation.
  Object.keys(SHADOW_CLUB_NAMES).forEach(lid=>{
    const lg = FOREIGN_LEAGUES[lid];
    SHADOW_CLUB_NAMES[lid].forEach((name, idx)=>{
      const id = slugify(name);
      if(CLUB_META[id]) return; // never shadow a club already in a top division
      const {primary,secondary,known} = clubColors(name);
      const eliteness = 1 - (idx / SHADOW_CLUB_NAMES[lid].length);
      const nationBoost = {spain:1.0, italy:0.95, germany:0.95, france:0.9,
        portugal:0.62, netherlands:0.6, belgium:0.5, scotland:0.48}[lg.nation] || 0.5;
      CLUB_META[id] = {
        id, name, tier:lid, leagueId:lid, leagueNation:lg.nation,
        primary, secondary, colorsKnown:known, crestVariant:hashStr(name)%6,
        balance: Math.round((2e6 + eliteness*30e6) * nationBoost),
        capacity: Math.round(6000 + eliteness*22000*nationBoost),
        facilities:{stadium:1,training:1,youth:1,medical:1},
        eliteness: eliteness*0.45, nationBoost,
        hidden:true, shadowOf:lid, justRelegated:false,
      };
    });
  });

  TIERS.forEach(t=>{
    CLUB_NAMES[t.id].forEach(name=>{
      const id = slugify(name);
      const {primary,secondary,known} = clubColors(name);
      const [balMin,balMax] = TIER_BALANCE[t.id];
      const [capMin,capMax] = TIER_STADIUM[t.id];
      CLUB_META[id] = {
        id, name, tier:t.id, primary, secondary, colorsKnown:known,
        crestVariant: hashStr(name) % 6,
        balance: Math.round(rnd(balMin,balMax)),
        capacity: Math.round(rnd(capMin,capMax)),
        facilities: {stadium:1, training:1, youth:1, medical:1},
      };
    });
  });
}

function clubById(id){ return CLUB_META[id]; }

/* =========================================================================
   GENERATION
   ========================================================================= */

let _pid = 0;
function rnd(a,b){ return a + Math.random()*(b-a); }
function rndInt(a,b){ return Math.floor(rnd(a,b)); }
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
function pick(arr){ return arr[rndInt(0,arr.length)]; }

// Builds a position-shaped attribute set whose mean is exactly `target`, so a
// real player's displayed rating is precisely the value in the data — no roll,
// no age penalty, no drift.
function exactAttrsForOverall(target, pos){
  const bias = {
    GK:{pace:-5, passing:-2, shooting:-7, defending:+3, physical:+1},
    DF:{pace:0,  passing:-1, shooting:-4, defending:+4, physical:+2},
    MD:{pace:0,  passing:+3, shooting:+1, defending:0,  physical:-1},
    FW:{pace:+2, passing:0,  shooting:+4, defending:-4, physical:0},
  }[pos] || {pace:0,passing:0,shooting:0,defending:0,physical:0};

  const keys = ["pace","passing","shooting","defending","physical"];
  const attrs = {};
  keys.forEach(k=>{ attrs[k] = clamp(Math.round(target + bias[k]), 1, 20); });

  // Correct any rounding/clamping drift so the mean lands exactly on target.
  for(let guard=0; guard<80; guard++){
    const sum = keys.reduce((s,k)=>s+attrs[k], 0);
    const diff = Math.round(target*5) - sum;
    if(diff === 0) break;
    const step = diff > 0 ? 1 : -1;
    // Adjust whichever attribute has room, preferring the least-biased ones.
    const candidates = keys.filter(k=> step>0 ? attrs[k] < 20 : attrs[k] > 1);
    if(candidates.length === 0) break;
    const k = candidates[Math.abs(diff) % candidates.length];
    attrs[k] = clamp(attrs[k] + step, 1, 20);
  }
  attrs.morale = 15;
  return attrs;
}

// A real player's ceiling follows his age, the way scouting actually treats it:
// a 32-year-old is what he is; a 17-year-old has years of room. Deterministic,
// so the same player always has the same ceiling — never a dice roll.
function realPotentialFor(overall, age){
  const headroom = age <= 17 ? 4 : age <= 18 ? 3.5 : age <= 20 ? 3
                 : age <= 22 ? 2 : age <= 24 ? 1.5 : age <= 26 ? 1
                 : age <= 28 ? 0.5 : 0;
  return clamp(overall + headroom, overall, 20);
}

function rollAttrsForOverall(overall, pos, age, variance){
  variance = variance===undefined?2:variance;
  const ageAdj = age<21?-2 : age<=29?1 : age<=33?-1 : -3;
  function roll(bias){ return clamp(overall+bias+ageAdj+rndInt(-variance,variance+1),1,20); }
  return {
    pace: roll(pos==="FW"?2:pos==="GK"?-4:0), passing: roll(pos==="MD"?3:pos==="GK"?-2:0),
    shooting: roll(pos==="FW"?4:pos==="MD"?1:pos==="GK"?-6:-2), defending: roll(pos==="DF"?4:pos==="GK"?2:pos==="FW"?-3:0),
    physical: roll(pos==="DF"?2:0), morale: rndInt(12,20),
  };
}

function recomputeOverall(p){
  p.overall = Math.round((p.pace+p.passing+p.shooting+p.defending+p.physical)/5);
  p.ovrF = fineOverall(p);   // continuous value used for display and valuation
}

function makePlayer(clubId, first, last, age, pos, overall, isReal, nationality, youthBoost){
  // Real players are exact; generated players keep their spread and variety.
  const attrs = isReal ? exactAttrsForOverall(overall, pos)
                       : rollAttrsForOverall(overall, pos, age, 3);
  const p = {id:"p"+(_pid++), clubId, first, last, age, pos, isReal:!!isReal, ...attrs};
  recomputeOverall(p);
  p.nat = nationality || rollNationality(clubById(clubId) || {name:"", tier:"england"});
  p.ambition = Math.round(rnd(0.2, 1.0)*100)/100;   // how choosy he is about a move
  p.potential = rollPotential(p.overall, age, youthBoost);  // youthBoost === tierBonus
  // Fine-grained ceiling so potential also spans the whole 40-99 range.
  p.potF = clamp(p.potential - Math.random()*0.9, p.ovrF !== undefined ? p.ovrF : p.overall, 20);
  // Season + career tracking. Season stats reset each rollover; career totals persist,
  // which is what makes a 10-season save feel like a real career history.
  p.apps=0; p.goals=0; p.assists=0; p.cleanSheets=0;
  p.careerApps=0; p.careerGoals=0;
  p.form=[];           // last 5 match ratings (6.0-10.0 scale), newest last
  p.injuryWeeks=0;     // >0 means unavailable for selection
  p.suspensionWeeks=0; // from red cards
  p.avatarSeed = hashStr(p.id + first + last); // deterministic, so a face never changes
  return p;
}

// Average of recent match ratings — drives the form arrow in the squad list.
function formAverage(p){
  if(!p.form || p.form.length===0) return null;
  return p.form.reduce((s,v)=>s+v,0)/p.form.length;
}
function isAvailable(p){ return (p.injuryWeeks||0)===0 && (p.suspensionWeeks||0)===0; }
// Display rating: the fine-grained value, so squads show 63, 64, 65... not
// everyone bunched on the same handful of numbers.
function ratingOf(p){
  // Cached, but keyed on everything that can change it — attributes, morale and
  // injury. Recomputing on every call was correct but far too slow: this runs
  // thousands of times per render and inside every sort.
  const key = (p.pace + p.passing + p.shooting + p.defending + p.physical) * 10000
            + (p.morale || 12) * 100 + Math.min(p.injuryWeeks || 0, 99);
  if(p._rKey !== key){
    p._rKey = key;
    p._rVal = to100(fineOverall(p));
  }
  return p._rVal;
}
function potentialOf(p){ return to100(p.potF !== undefined ? p.potF : (p.potential||p.overall)); }

function fillerOverall(tierId, isShadow){
  if(TIER_FILLER_OVR[tierId]){ const [lo,hi] = TIER_FILLER_OVR[tierId]; return rndInt(lo,hi+1); }
  if(isShadow){
    // Second-tier quality: good enough to promote, not good enough to stay up easily.
    const lgS = FOREIGN_LEAGUES[tierId];
    const bs = {spain:9, italy:9, germany:9, france:9, portugal:7,
      netherlands:7, belgium:6, scotland:6}[lgS ? lgS.nation : ""] || 6;
    return rndInt(bs-2, bs+3);
  }
  // Foreign leagues: quality scales with the nation's standing.
  const lg = FOREIGN_LEAGUES[tierId];
  const base = {spain:13, italy:13, germany:13, france:12, portugal:10,
    netherlands:10, belgium:9, scotland:9}[lg ? lg.nation : ""] || 9;
  return rndInt(base-3, base+3);
}

function generateSquad(club){
  const squad = [];
  // Real players: English/Championship list for domestic clubs, EURO list abroad.
  const seenEnglish = {};
  REAL_PLAYERS.filter(r=>r[0]===club.name).forEach(r=>{ seenEnglish[r[1]+"|"+r[2]] = r; });
  Object.values(seenEnglish).forEach(r=>{
    const key = r[2] ? r[1]+" "+r[2] : r[1];
    const p = makePlayer(club.id, r[1], r[2], r[3], r[4], r[5], true, REAL_PLAYER_NATIONS[key] || "UNKNOWN", 0);
    const ceiling = WONDERKID_CEILINGS[key] !== undefined ? WONDERKID_CEILINGS[key]
                  : realPotentialFor(r[5], r[3]);
    p.potential = clamp(Math.max(ceiling, p.overall), 1, 20);
    p.potF = clamp(Math.max(ceiling, p.ovrF !== undefined ? p.ovrF : p.overall), 1, 20.5);
    squad.push(p);
  });
  // Later lists win, so a wonderkid entry overrides a plainer earlier one and
  // nobody is created twice.
  const merged = {};
  EURO_REAL_PLAYERS.concat(EURO_REAL_PLAYERS_2, CARDIFF_AND_WALES, WONDERKIDS)
    .filter(r=>r[0]===club.name)
    .forEach(r=>{ merged[r[1]+"|"+r[2]] = r; });
  Object.values(merged).forEach(r=>{
    const p = makePlayer(club.id, r[1], r[2], r[3], r[4], r[5], true, r[6], 0);
    // r[7] is a hand-set ceiling where the player's projection is genuinely known;
    // otherwise it follows the deterministic age curve.
    const nameKey = (r[2] ? r[1]+" "+r[2] : r[1]);
    const ceiling = r[7] !== undefined ? r[7]
                  : (WONDERKID_CEILINGS[nameKey] !== undefined ? WONDERKID_CEILINGS[nameKey]
                  : realPotentialFor(r[5], r[3]));
    p.potential = clamp(Math.max(ceiling, p.overall), 1, 20);
    p.potF = clamp(Math.max(ceiling, p.ovrF !== undefined ? p.ovrF : p.overall), 1, 20.5);
    squad.push(p);
  });
  const shape = {GK:3,DF:8,MD:8,FW:5};
  squad.forEach(p=>{ if(shape[p.pos]!==undefined) shape[p.pos]--; });
  let remaining = (club.hidden ? SHADOW_SQUAD_TARGET : SQUAD_TARGET) - squad.length;
  Object.keys(shape).forEach(pos=>{
    let need = Math.max(0, shape[pos]);
    for(let i=0;i<need && remaining>0;i++, remaining--){
      const nat = rollNationality(club);
      const nm = nameForNationality(nat);
      squad.push(makePlayer(club.id, nm.first, nm.last, rollAge(), pos, fillerOverall(club.tier, club.hidden), false, nat));
    }
  });
  return squad;
}

function rollAge(){
  const r = Math.random();
  if(r<0.12) return rndInt(17,20);
  if(r<0.75) return rndInt(20,30);
  return rndInt(30,37);
}

// Internal attributes stay on a 1-20 scale (every sim/generation/youth formula is
// tuned against it) — to100() is a pure DISPLAY conversion so ratings read like a
// familiar 40-99 database scale without touching any tested game-balance code.
// Calibrated so PL stars land ~85-91, Championship regulars ~60-73, National League
// squad players ~45-55 — matches how a real ratings database is distributed.
function to100(ovr20){
  if(ovr20 && typeof ovr20 === "object") ovr20 = (ovr20.ovrF !== undefined ? ovr20.ovrF : ovr20.overall);
  // 1 -> 40, 10 -> 63, 15 -> 79, 18 -> 90, 19 -> 94, 20 -> 98.
  // Accepts fractional input so every value between 40 and 99 is reachable.
  // Quadratic so the top of the scale is stretched: the difference between a very
  // good player and a generational one should be visible, and 99 has to be
  // theoretically reachable or "potential" means nothing at the top end.
  return clamp(Math.round(38 + ovr20*1.9 + ovr20*ovr20*0.055), 1, 99);
}

/* =========================================================================
   PLAYER AVATARS — procedurally generated, deterministic per player.
   Real player photographs are copyrighted press images (Getty/PA and the
   clubs), so instead of photos every player gets a generated portrait built
   from their avatarSeed: skin tone, hair style/colour, facial hair and a
   shirt in their club's colours. Same seed always yields the same face, so a
   player looks identical everywhere he appears and across save reloads.
   ========================================================================= */
const AVATAR_SKIN = ["#F2D0B5","#E8BC96","#D9A578","#C08B5E","#9C6B42","#7A4F2E","#5C3A20"];
const AVATAR_HAIR = ["#1B1B1B","#2E2118","#4A3220","#6B4423","#8C6239","#B8863B","#D9C08A","#9A9A9A","#E5E5E5"];

function avatarSVG(p, size){
  size = size || 40;
  const seed = p.avatarSeed !== undefined ? p.avatarSeed : hashStr(p.id||"x");
  const skin = AVATAR_SKIN[seed % AVATAR_SKIN.length];
  const hair = AVATAR_HAIR[(seed >> 3) % AVATAR_HAIR.length];
  const hairStyle = (seed >> 6) % 5;   // 0 short, 1 buzz, 2 curly/afro, 3 bald, 4 long
  const beard = (seed >> 9) % 4;       // 0 none, 1 none, 2 stubble, 3 full
  const club = clubById(p.clubId);
  const shirt = club ? club.primary : "#2A3040";
  const shirtAlt = club ? club.secondary : "#8B93A7";
  const uid = "av"+(p.id||seed);

  let hairShape = "";
  if(hairStyle===0) hairShape = `<path d="M14 21 Q14 9 32 9 Q50 9 50 21 L50 24 Q46 15 32 15 Q18 15 14 24 Z" fill="${hair}"/>`;
  else if(hairStyle===1) hairShape = `<path d="M15 22 Q16 12 32 12 Q48 12 49 22 Q44 17 32 17 Q20 17 15 22 Z" fill="${hair}"/>`;
  else if(hairStyle===2) hairShape = `<ellipse cx="32" cy="18" rx="20" ry="13" fill="${hair}"/>`;
  else if(hairStyle===3) hairShape = `<path d="M17 24 Q18 17 24 15 Q20 20 19 25 Z" fill="${hair}"/>`;
  else hairShape = `<path d="M13 22 Q13 8 32 8 Q51 8 51 22 L51 36 Q49 26 46 24 Q40 16 32 16 Q24 16 18 24 Q15 26 13 36 Z" fill="${hair}"/>`;

  let beardShape = "";
  if(beard===2) beardShape = `<path d="M20 33 Q22 44 32 45 Q42 44 44 33 Q42 40 32 41 Q22 40 20 33 Z" fill="${hair}" opacity="0.35"/>`;
  else if(beard===3) beardShape = `<path d="M19 30 Q20 46 32 47 Q44 46 45 30 Q43 41 32 42 Q21 41 19 30 Z" fill="${hair}" opacity="0.75"/>`;

  return `<svg class="avatar" width="${size}" height="${size}" viewBox="0 0 64 64" style="border-radius:50%;">
    <defs><clipPath id="${uid}"><circle cx="32" cy="32" r="32"/></clipPath></defs>
    <g clip-path="url(#${uid})">
      <rect width="64" height="64" fill="#1B2230"/>
      <path d="M6 64 Q6 48 20 44 L44 44 Q58 48 58 64 Z" fill="${shirt}"/>
      <path d="M26 44 L32 52 L38 44 Z" fill="${shirtAlt}"/>
      <rect x="24" y="34" width="16" height="12" rx="4" fill="${skin}"/>
      <ellipse cx="32" cy="27" rx="15" ry="17" fill="${skin}"/>
      ${beardShape}
      <ellipse cx="26" cy="26" rx="1.8" ry="2.2" fill="#2A2A2A"/>
      <ellipse cx="38" cy="26" rx="1.8" ry="2.2" fill="#2A2A2A"/>
      <path d="M27 35 Q32 38 37 35" stroke="#8A5A4A" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      ${hairShape}
    </g>
  </svg>`;
}

function playerAskingPrice(p, tierId){
  // Clubs pay for what a player will BECOME, not only what he is today. Without
  // this a 17-year-old with a 97 ceiling was available for pocket change.
  const now = ratingOf(p);
  const pot = potentialOf(p);
  const youthWeight = p.age<=17 ? 0.70 : p.age<=19 ? 0.62 : p.age<=21 ? 0.50
                    : p.age<=23 ? 0.36 : p.age<=25 ? 0.20 : p.age<=27 ? 0.08 : 0;
  let rating = now + Math.max(0, pot-now) * youthWeight;
  // A raw teenager with a huge ceiling at a small club is a gamble, not a
  // finished article: his league drags the price down, but nowhere near to
  // pennies. A 45-rated 90-potential National League kid lands around £10-15M.
  const tierDamp = {nationalleague:0.90, nlnorth:0.86, nlsouth:0.86,
    leaguetwo:0.93, leagueone:0.96}[tierId];
  if(tierDamp && pot - now >= 15) rating *= tierDamp;
  const ageFactor = p.age<=23?1.15 : p.age<=29?1.0 : p.age<=33?0.55 : 0.25;
  // Anchored so ~94 lands near a world-record fee, ~72 is a solid Championship
  // price, and a National League squad player is a few tens of thousands.
  const base = 5793 * Math.pow(Math.max(rating-35,1)/10, 5.77);
  const mult = TIER_TRANSFER_MULT[tierId] !== undefined ? TIER_TRANSFER_MULT[tierId] : 0.8;
  // Silverware inflates a fee — a Ballon d'Or winner is not priced like a peer
  // with the same rating and an empty trophy cabinet.
  return Math.max(1000, Math.round(base * ageFactor * mult * awardValueMultiplier(p)));
}
function playerWage(p, tierId){ return Math.max(200, Math.round(playerAskingPrice(p, tierId)/1500)); }

function fullName(p){ return p.last ? (p.first+" "+p.last) : p.first; }

/* =========================================================================
   FIXTURES + SIMULATION (unchanged approach: circle-method round robin,
   Poisson goal-expectancy model)
   ========================================================================= */

function generateFixtures(clubIds){
  let ids = clubIds.slice();
  const n = ids.length, rounds = n-1;
  const totalRounds = rounds * 2;
  // Where each round actually falls in the calendar. A 24-club league needs 46
  // rounds in 42 weeks, so four of them become midweek fixtures.
  const schedule = buildRoundSchedule(totalRounds);

  const byRound = [];
  let rotation = ids.slice();
  for(let round=0; round<rounds; round++){
    const games = [];
    for(let i=0;i<n/2;i++){
      const home = rotation[i], away = rotation[n-1-i];
      const swap = (round+i)%2===1;
      games.push({home: swap?away:home, away: swap?home:away});
    }
    byRound.push(games);
    const last = rotation[n-1];
    for(let i=n-1;i>1;i--) rotation[i]=rotation[i-1];
    rotation[1]=last;
  }
  // Second half of the season is the reverse fixture.
  for(let r=0;r<rounds;r++){
    byRound.push(byRound[r].map(g=>({home:g.away, away:g.home})));
  }

  const fixtures = [];
  byRound.forEach((games, r)=>{
    const slot = schedule[r] || {week: SEASON_END, midweek:true};
    games.forEach(g=>fixtures.push({
      home:g.home, away:g.away, week:slot.week, midweek:!!slot.midweek,
      played:false, hg:0, ag:0,
    }));
  });
  return fixtures;
}

let _trCache = {}, _trKey = "";
function teamRatings(squad){
  // Cached per club per week: this is called twice per fixture, and every call
  // walked the whole squad several times over.
  if(squad && squad.length && squad[0].clubId){
    const key = state.season + ":" + state.week;
    if(_trKey !== key){ _trCache = {}; _trKey = key; }
    const cid = squad[0].clubId;
    if(_trCache[cid]) return {attack:_trCache[cid].attack, defense:_trCache[cid].defense};
    const computed = _teamRatingsRaw(squad);
    _trCache[cid] = computed;
    return {attack:computed.attack, defense:computed.defense};
  }
  return _teamRatingsRaw(squad);
}

function _teamRatingsRaw(squad){
  const attackers = squad.filter(p=>p.pos==="FW"||p.pos==="MD");
  const defenders = squad.filter(p=>p.pos==="DF"||p.pos==="GK");
  const avg = (arr,fn)=> arr.length? arr.reduce((s,p)=>s+fn(p),0)/arr.length : 10;
  return { attack: avg(attackers, p=>(p.shooting+p.passing+p.pace)/3), defense: avg(defenders, p=>(p.defending+p.physical)/2) };
}

function poisson(lambda){
  const L = Math.exp(-lambda); let k=0, p=1;
  do{ k++; p*=Math.random(); } while(p>L);
  return k-1;
}

function simulateScore(homeSquad, awaySquad, ctx){
  const h = teamRatings(homeSquad), a = teamRatings(awaySquad);
  // Formation, mentality and pressing shape the user's side.
  if(typeof userTacticalMultipliers === "function" && state.tactics){
    if(homeSquad.length && homeSquad[0].clubId === state.clubId){
      const t = userTacticalMultipliers(); h.attack *= t.attack; h.defense *= t.defense;
    }
    if(awaySquad.length && awaySquad[0].clubId === state.clubId){
      const t = userTacticalMultipliers(); a.attack *= t.attack; a.defense *= t.defense;
    }
  }
  // A happy dressing room overperforms; an unhappy one drops points it shouldn't.
  const capBonus = (homeSquad.length && homeSquad[0].clubId === state.clubId) ? captaincyBonus() : 1;
  const capBonusA = (awaySquad.length && awaySquad[0].clubId === state.clubId) ? captaincyBonus() : 1;
  const hm = (homeSquad.length ? moraleMultiplier(homeSquad[0].clubId) * fatigueMultiplier(homeSquad[0].clubId) : 1) * capBonus;
  const am = (awaySquad.length ? moraleMultiplier(awaySquad[0].clubId) * fatigueMultiplier(awaySquad[0].clubId) : 1) * capBonusA;
  h.attack *= hm; h.defense *= hm; a.attack *= am; a.defense *= am;
  // Derby, weather and what's riding on the fixture — this is what stops every
  // match being decided by the ratings alone.
  applyMatchContext(h, a, ctx);
  const leagueAvg = 1.35;
  // A derby crowd is worth more than an ordinary one.
  const homeAdv = 0.30 + (ctx && ctx.derby ? 0.06 : 0);
  const homeExp = leagueAvg * (h.attack/Math.max(a.defense,1)) + homeAdv;
  const awayExp = leagueAvg * (a.attack/Math.max(h.defense,1));
  return { hg: poisson(Math.max(homeExp,0.05)), ag: poisson(Math.max(awayExp,0.05)) };
}

function playTone(freq, duration, delay, type){
  if(!SETTINGS.sound || !_audioCtx) return;
  try{
    const t0 = _audioCtx.currentTime + (delay||0);
    const osc = _audioCtx.createOscillator(), gain = _audioCtx.createGain();
    osc.type = type||"sine"; osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.11, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
    osc.connect(gain); gain.connect(_audioCtx.destination);
    osc.start(t0); osc.stop(t0+duration+0.02);
  }catch(e){}
}

function loadState(){

      const fa = data.game.freeAgents;

        ? (fa === "" ? [] : fa.split(PACK_ROW).map(s=>{
            const p = decodePlayer(s);

            return p;
          }))
        : (fa||[]).map(unpackPlayer);

// Player records dominate the save (13,000+ of them), and JSON key names were
// costing more than the values. These maps shrink each record to short keys and
// drop anything we can recompute on load (ovrF, potF, flair).
// Order matters: hot fields first, rarely-set ones last, so trailing empties
// can be trimmed off the end of most records.
const P_KEYS = ["id","clubId","first","last","age","pos","isReal","nat","potential","overall",
  "pace","passing","shooting","defending","physical","morale","apps","goals","assists","cleanSheets",
  "careerApps","careerGoals","wage","contractYears","condition","potF","ratingSum","ratingCount",
  "injuryWeeks","suspensionWeeks","injuryName","injuryHistory",
  "injuryProne","permanentDamage","isYouth","listed","loanListed","loanedFrom","loanedOutTo","awards",
  // These were missing entirely — clauses, contracts and discipline were lost
  // every time a career was reloaded.
  "clauses","lifeEvents","yellows","reds",
  "fatherId","fatherName","siblingGroup","siblingType","marriedAt","formerLast",
  "onLeave","illnessRecoverChance",
  // Captaincy, promises and discipline history — without these the armband and
  // any promise you made would be forgotten every time the game reloaded.
  "isCaptain","isViceCaptain","promisedStart","finesReceived","unsettled","disciplinary","evt","awardsExtra","sponsor","stadiumName"];

function packPlayer(p){
  const out = [];
  for(let i=0;i<P_KEYS.length;i++){
    const v = p[P_KEYS[i]];
    out.push(v === undefined ? null : v);
  }
  // Trim trailing empties — most players carry no awards, clauses or injury,
  // and writing those nulls 13,000 times was a large slice of the save.
  while(out.length && (out[out.length-1] === null || out[out.length-1] === 0 ||
        (Array.isArray(out[out.length-1]) && out[out.length-1].length === 0))){
    out.pop();
  }
  return out;
}
function unpackPlayer(arr){
  const p = {};
  for(let i=0;i<P_KEYS.length;i++){
    if(arr[i] !== null && arr[i] !== undefined) p[P_KEYS[i]] = arr[i];
  }
  if(!p.form) p.form = [];
  if(!p.awards) p.awards = [];
  if(p.morale === undefined) p.morale = 12;
  recomputeOverall(p);                     // rebuilds ovrF from attributes
  // potF is stored now, so a reloaded player has exactly the ceiling he had.
  if(p.potF === undefined) p.potF = clamp(p.potential||p.overall, p.ovrF||p.overall, 20.5);
  return p;
}
/* ---- Save compaction ----
   The save was 3.2MB and browsers refused it (SAV-01). Three fixes:
     · Fixtures are DETERMINISTIC from the club list, so we store only the
       scorelines and rebuild the schedule on load. 688KB -> a few KB.
     · Packed players drop trailing empty fields — most players have no awards,
       no clauses and no injury, and those nulls were being written 13,000 times.
     · Club records store only what actually changes; names, colours and crests
       are rebuilt from the database.                                          */
function packFixtures(tiers){
  const out = {};
  Object.keys(tiers).forEach(lid=>{
    const lg = tiers[lid];
    out[lid] = {
      c: lg.clubIds,
      // One entry per fixture: 0 = unplayed, else [homeGoals, awayGoals].
      r: lg.fixtures.map(f=> f.played ? [f.hg, f.ag] : 0),
    };
  });
  return out;
}
function unpackFixtures(packed){
  const out = {};
  Object.keys(packed).forEach(lid=>{
    const blk = packed[lid];
    const fixtures = generateFixtures(blk.c);   // same order, every time
    (blk.r || []).forEach((res, i)=>{
      if(res && fixtures[i]){
        fixtures[i].played = true;
        fixtures[i].hg = res[0];
        fixtures[i].ag = res[1];
      }
    });
    out[lid] = { clubIds: blk.c, fixtures };
  });
  return out;
}

// Only the mutable half of a club record is worth writing.
const CLUB_SAVE_KEYS = ["balance","stature","capacity","facilities","hidden","shadowOf",
  "justRelegated","justPromoted","tier","wageBudget","transferEmbargo","pointsDeduction",
  "inAdministration","manager","vacantSince"];
function packClubMeta(meta){
  const out = {};
  Object.keys(meta).forEach(id=>{
    const c = meta[id], o = {};
    CLUB_SAVE_KEYS.forEach(k=>{ if(c[k] !== undefined && c[k] !== null) o[k] = c[k]; });
    out[id] = o;
  });
  return out;
}
function unpackClubMeta(packed){
  buildClubMeta();                       // rebuilds names, colours, crests
  Object.keys(packed).forEach(id=>{
    if(!CLUB_META[id]) return;
    Object.assign(CLUB_META[id], packed[id]);
  });
  return CLUB_META;
}

const PACK_SEP = "|";          // one byte in JSON, unlike a control character
const PACK_ROW = ";";
function packEsc(s){ return String(s).replace(/~/g,"~t").replace(/\|/g,"~p").replace(/;/g,"~s"); }
function packUnesc(s){ return String(s).replace(/~s/g,";").replace(/~p/g,"|").replace(/~t/g,"~"); }

// One string per club instead of an array of arrays: same data, far fewer
// quotes and commas. This is the difference between a save that fits and
// SAV-01.
function encodePlayer(p){
  return packPlayer(p).map(v=>{
    if(v === null || v === undefined) return "";
    // "~j" can never occur in escaped data, because packEsc turns any real ~
    // into ~t. A bare "J" prefix destroyed every name beginning with J.
    if(Array.isArray(v)) return v.length ? "~j" + packEsc(JSON.stringify(v)) : "";
    if(typeof v === "object") return "~j" + packEsc(JSON.stringify(v));
    if(v === true) return "T";
    if(v === false) return "";        // false and absent mean the same thing here
    return packEsc(v);
  }).join(PACK_SEP);
}
function decodePlayer(str){
  const parts = str.split(PACK_SEP);
  const arr = parts.map(s=>{
    if(s === "") return null;
    if(s === "T") return true;
    if(s === "F") return false;
    if(s.slice(0,2) === "~j"){ try{ return JSON.parse(packUnesc(s.slice(2))); }catch(e){ return null; } }
    if(s.charAt(0) === "J" && s.length > 1 && (s.charAt(1) === "[" || s.charAt(1) === "{")){
      try{ return JSON.parse(packUnesc(s.slice(1))); }catch(e){ return null; }   // older saves
    }
    const n = Number(s);
    if(s !== "" && !isNaN(n) && String(n) === s) return n;
    return packUnesc(s);
  });
  return unpackPlayer(arr);
}
function packSquads(squads){
  const out = {};
  Object.keys(squads).forEach(k=>{
    const isMine = (k === state.clubId);
    out[k] = squads[k].map(p=>{
      const savedClub = p.clubId, savedLife = p.lifeEvents;
      p.clubId = "";                      // implied by the group it's stored under
      // Only your own players keep readable history. Everyone else's story
      // lives in the news feed, which is capped.
      if(!isMine && savedLife) p.lifeEvents = null;
      const s = encodePlayer(p);
      p.clubId = savedClub;
      if(savedLife) p.lifeEvents = savedLife;
      return s;
    }).join(PACK_ROW);
  });
  return out;
}
function unpackSquads(packed){
  const out = {};
  Object.keys(packed).forEach(k=>{
    const blk = packed[k];
    if(typeof blk === "string"){
      out[k] = blk === "" ? [] : blk.split(PACK_ROW).map(s=>{
        const p = decodePlayer(s);
        if(!p.clubId) p.clubId = k;   // restored from the group key
        return p;
      });
    } else {
      out[k] = (blk||[]).map(unpackPlayer);      // older array format
    }
  });
  return out;
}


/* =========================================================================
   SAVE COMPRESSION
   A career is a couple of megabytes of highly repetitive delimited text, and
   embedded frames give a page far less storage than a normal tab. LZW squeezes
   it by roughly 5-8x, which is the difference between saving and SAV-01.

   Output is packed two bytes per character so the result stays a valid string
   that localStorage will accept, and the dictionary resets before codes can
   exceed what a UTF-16 code unit holds.
   ========================================================================= */
const LZW_MAX_CODE = 0xFBFF;          // stay clear of surrogate range

function lzwCompress(input){
  if(!input) return "";
  const dict = new Map();
  let nextCode = 256;
  let w = "";
  const out = [];
  for(let i=0;i<input.length;i++){
    const c = input.charAt(i);
    const wc = w + c;
    if(dict.has(wc) || (wc.length === 1 && wc.charCodeAt(0) < 256)){
      w = wc;
      continue;
    }
    // Emit the code for w.
    out.push(dict.has(w) ? dict.get(w) : w.charCodeAt(0));
    if(nextCode < LZW_MAX_CODE){
      dict.set(wc, nextCode++);
    }
    w = c;
  }
  if(w !== "") out.push(dict.has(w) ? dict.get(w) : w.charCodeAt(0));
  // Codes are already below the surrogate range, so they map straight to chars.
  let s = "";
  const CHUNK = 8192;
  for(let i=0;i<out.length;i+=CHUNK){
    s += String.fromCharCode.apply(null, out.slice(i, i+CHUNK));
  }
  return s;
}

function lzwDecompress(input){
  if(!input) return "";
  const dict = [];
  for(let i=0;i<256;i++) dict[i] = String.fromCharCode(i);
  let nextCode = 256;
  let prev = String.fromCharCode(input.charCodeAt(0));
  let out = prev;
  for(let i=1;i<input.length;i++){
    const code = input.charCodeAt(i);
    let entry;
    if(code < 256) entry = String.fromCharCode(code);
    else if(dict[code] !== undefined) entry = dict[code];
    else entry = prev + prev.charAt(0);          // the classic KwKwK case
    out += entry;
    if(nextCode < LZW_MAX_CODE) dict[nextCode++] = prev + entry.charAt(0);
    prev = entry;
  }
  return out;
}

// Wraps a payload with a marker so old, uncompressed saves still load.
// The compressor works on byte values 0-255. Names carry accents and flags are
// surrogate pairs, so the string is converted to UTF-8 bytes first — without
// this, "Gonçalo" and every flag emoji came back corrupted.
function toBinaryString(str){
  if(typeof TextEncoder !== "undefined"){
    const bytes = new TextEncoder().encode(str);
    let out = "";
    // Chunked so a large save doesn't blow the argument limit.
    for(let i=0;i<bytes.length;i+=8192){
      out += String.fromCharCode.apply(null, bytes.subarray(i, i+8192));
    }
    return out;
  }
  return unescape(encodeURIComponent(str));
}
function fromBinaryString(bin){
  if(typeof TextDecoder !== "undefined"){
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i) & 0xff;
    return new TextDecoder().decode(bytes);
  }
  return decodeURIComponent(escape(bin));
}

function encodeSave(jsonString){
  const packed = lzwCompress(toBinaryString(jsonString));
  // Only use it if it actually helped — tiny saves can round up.
  return (packed.length < jsonString.length) ? "LZW2" + packed : jsonString;
}
function decodeSave(raw){
  if(typeof raw !== "string") return raw;
  if(raw.indexOf("LZW2") === 0) return fromBinaryString(lzwDecompress(raw.slice(4)));
  if(raw.indexOf("LZW1") === 0) return lzwDecompress(raw.slice(4));   // older saves
  return raw;
}
