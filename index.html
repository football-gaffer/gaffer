    const fr = document.querySelector("#screen-transfers .filter-row"); if(fr) fr.style.display="none";
    const sr = document.querySelector("#screen-transfers .setting-row"); if(sr) sr.style.display="none";
  }

  renderPillTabs(document.getElementById("transferPosTabs"),
    [{value:"ALL",label:"All positions"},{value:"GK",label:"GK"},{value:"DF",label:"DF"},{value:"MD",label:"MD"},{value:"FW",label:"FW"}],
    transferFilters.position, v=>{ transferFilters.position=v; transferShown=60; renderTransfers(); });
  renderPillTabs(document.getElementById("transferTierTabs"),
    [{value:"ALL",label:"All"}].concat(getAllLeagueIds().map(id=>({value:id,label:leagueShort(id)}))),
    transferFilters.tier, v=>{ transferFilters.tier=v; transferShown=60; renderTransfers(); });

  const sortSel = document.getElementById("transferSort");
  sortSel.value = transferFilters.sort;
  sortSel.onchange = ()=>{ transferFilters.sort=sortSel.value; transferShown=60; renderTransferResultsOnly(); };

  document.getElementById("transferSearch").addEventListener("input", e=>{
    transferFilters.query = e.target.value; transferShown=60; renderTransferResultsOnly();
  });
  // Slider steps map to money non-linearly so the low end stays usable.
  function stepToMoney(step){
    if(step<=0) return 0;
    if(step>=60) return Infinity;
    return Math.round(1000 * Math.pow(1.235, step));
  }
  function refreshPriceLabel(){
    const lo = stepToMoney(transferFilters.minPriceStep||0);
    const hi = stepToMoney(transferFilters.maxPriceStep===undefined?60:transferFilters.maxPriceStep);
    document.getElementById("priceVal").textContent =
      (lo<=0 && hi===Infinity) ? "any" : `${lo<=0?"£0":fmtMoney(lo)} – ${hi===Infinity?"any":fmtMoney(hi)}`;
  }
  function bindDual(minId, maxId, apply){
    const a = document.getElementById(minId), b = document.getElementById(maxId);
    const handler = ()=>{
      let lo = +a.value, hi = +b.value;
      if(lo > hi){ const t = lo; lo = hi; hi = t; a.value = lo; b.value = hi; }
      apply(lo, hi);
      transferShown = 60; renderTransferResultsOnly();
    };
    a.addEventListener("input", handler); b.addEventListener("input", handler);
  }
  bindDual("minAgeSlider","maxAgeSlider",(lo,hi)=>{
    transferFilters.minAge = lo;
    transferFilters.maxAge = hi>=40 ? 99 : hi;
    document.getElementById("ageVal").textContent = `${lo}–${hi>=40?"any":hi}`;
  });
  bindDual("minRatingSlider","maxRatingSlider",(lo,hi)=>{
    transferFilters.minRating = lo<=40 ? 0 : lo;
    transferFilters.maxRating = hi>=99 ? 99 : hi;
    document.getElementById("ratingVal").textContent = `${lo}–${hi}`;
  });
  bindDual("minPriceSlider","maxPriceSlider",(lo,hi)=>{
    transferFilters.minPriceStep = lo; transferFilters.maxPriceStep = hi;
    transferFilters.minPrice = stepToMoney(lo);
    transferFilters.maxPrice = stepToMoney(hi);
    refreshPriceLabel();
  });
  refreshPriceLabel();
  const affordSwitch = document.getElementById("transferAffordSwitch");
  affordSwitch.onclick = ()=>{
    transferFilters.affordableOnly = !transferFilters.affordableOnly;
    affordSwitch.classList.toggle("on", transferFilters.affordableOnly);
    transferShown=60; renderTransferResultsOnly();
  };

  renderTransferResultsOnly();
}

// Market-aware player modal: buy / loan / sign free, depending on the tab.
function openMarketModal(p, kind, price){
  openPlayerModal(p, false);
  const area = document.getElementById("playerActionArea");
  if(!area) return;
  const myClub = clubById(state.clubId);
  const from = clubById(p.clubId);

  // Show how the player feels about joining BEFORE you commit to a bid.
  const interest = kind==="loan" ? loanInterest(p, myClub) : joiningInterest(p, myClub);
  const lab = interestLabel(interest);
  const col = lab.cls==="good" ? "var(--good)" : lab.cls==="warn" ? "var(--accent)" : "var(--bad)";
  const interestHTML = kind==="free" ? "" : `
    <div class="interest-row">
      <span style="color:var(--text-dim);">Interest</span>
      <span class="interest-track"><span class="interest-fill" style="width:${Math.round(interest*100)}%; background:${col};"></span></span>
      <span style="color:${col};">${lab.text}</span>
    </div>`;
  const clauseHTML = (p.clauses||[]).length ? `<div style="margin-bottom:10px;">${
    p.clauses.map(c=>{
      const other = clubById(c.club);
      if(c.type==="sellOn") return `<span class="clause-chip">${c.pct}% sell-on to ${other?other.name:"former club"}</span>`;
      if(c.type==="buyBack") return `<span class="clause-chip">Buy-back ${fmtMoney(c.fee)}</span>`;
      if(c.type==="optionBuy") return `<span class="clause-chip">Option to buy ${fmtMoney(c.fee)}</span>`;
      return `<span class="clause-chip">${CLAUSE_TYPES[c.type]?CLAUSE_TYPES[c.type].name:c.type}</span>`;
    }).join("")}</div>` : "";

  function fail(r){ showError(r.code || "OFR-00", r.reason || "The deal fell through.", "Deal rejected"); }

  if(kind==="free"){
    const bonus = Math.round(playerWage(p, myClub.tier)*12);
    area.innerHTML = `${clauseHTML}<button class="btn-primary" id="mktFree" style="margin-top:8px;">Sign on a free (bonus ${fmtMoney(bonus)})</button>`;
    document.getElementById("mktFree").onclick = ()=>{
      const r = signFreeAgent(p);
      if(r.ok){ closePlayerModal(); toast(`${fullName(p)} signs on a free`); render(); }
      else fail({code:"FA-01", reason:r.reason});
    };
    return;
  }

  const askBuy  = negotiatedFee(p, "buy");
  const askL2B  = negotiatedFee(p, "loanToBuy");
  const lFee    = loanFee(p);
  const listed  = !!p.listed;

  // Listed and loan-listed players can be signed straight off. Anyone else has
  // to be prised away with a bid their club will actually entertain.
  area.innerHTML = `
    ${interestHTML}${clauseHTML}
    <div style="font-size:11.5px; color:var(--text-dim); margin-bottom:8px;">
      ${listed ? from.name + " have listed him — they will deal at a discount."
               : from.name + " have not listed him. Expect to pay over the odds."}
    </div>
    <button class="btn-primary" id="offBuy" style="margin-top:4px;">Bid ${fmtMoney(askBuy)}</button>
    <button class="btn-secondary" id="offLoan">Loan for the season (${fmtMoney(lFee)})</button>
    <button class="btn-secondary" id="offL2B">Loan with option to buy (${fmtMoney(askL2B)})</button>
    <div class="range-pair" style="margin-top:12px;">
      <span style="font-size:11.5px; color:var(--text-dim); white-space:nowrap;">Your bid</span>
      <input type="range" id="bidSlider" min="${Math.round(askBuy*0.5)}" max="${Math.round(askBuy*1.8)}" value="${askBuy}" step="${Math.max(1000,Math.round(askBuy/80))}">
      <span class="num" id="bidVal" style="min-width:58px; text-align:right;">${fmtMoney(askBuy)}</span>
    </div>
    <button class="btn-secondary" id="offCustom">Submit custom bid</button>`;

  let bid = askBuy;
  const slider = document.getElementById("bidSlider");
  slider.addEventListener("input", e=>{
    bid = +e.target.value;
    document.getElementById("bidVal").textContent = fmtMoney(bid);
  });

  // Bids are submitted and considered — no instant signings.
  function sendBid(amount){
    const pre = submitOffer(p, "check", amount);      // wages, window, standing
    if(pre && pre.ok === false && pre.code !== "OFR-06"){ fail(pre); return; }
    const r = submitBid(p, amount, "buy");
    if(r.ok){
      closePlayerModal();
      toast(`Bid of ${fmtMoney(amount)} submitted for ${fullName(p)}`);
      render();
    } else fail(r);
  }
  document.getElementById("offBuy").onclick = ()=> sendBid(askBuy);
  document.getElementById("offCustom").onclick = ()=> sendBid(bid);
  document.getElementById("offLoan").onclick = ()=>{
    const r = submitOffer(p, "loan");
    if(r.ok){ closePlayerModal(); toast(`${fullName(p)} joins on loan`); render(); } else fail(r);
  };
  document.getElementById("offL2B").onclick = ()=>{
    const r = submitOffer(p, "loanToBuy", askL2B);
    if(r.ok){ closePlayerModal(); toast(`${fullName(p)} joins with an option to buy`); render(); } else fail(r);
  };
}

function renderTable(){
  if(!state || !state.clubId || !state.squads) return;   // no career loaded yet
  const club = clubById(state.clubId);
  const el = document.getElementById("screen-table");
  if(!activeTableTier || !state.tiers[activeTableTier]) activeTableTier = getUserTier();
  el.innerHTML = `<div class="section-title" style="margin-top:0;">${leagueDisplayName(activeTableTier)}</div>
    <div class="tier-tabs" id="tableTierTabs"></div>
    <div class="tier-tabs" id="tableViewTabs"></div>
    <div id="tableViewBody"></div>`;

  renderPillTabs(document.getElementById("tableTierTabs"),
    getAllLeagueIds().map(id=>({value:id, label:leagueShort(id)})),
    activeTableTier, tierId=>{ activeTableTier = tierId; renderTable(); });
  renderPillTabs(document.getElementById("tableViewTabs"), [
    {value:"table", label:"Table"},
    {value:"goals", label:"Goals"},
    {value:"assists", label:"Assists"},
    {value:"cleanSheets", label:"Clean sheets"},
    {value:"rating", label:"Ratings"},
  ], tableView, v=>{ tableView = v; renderTable(); });

  const viewBody = document.getElementById("tableViewBody");
  if(tableView !== "table"){
    renderLeaderboard(viewBody, activeTableTier, tableView);
    return;
  }

  viewBody.innerHTML = `
    <div class="table-head"><span>#</span><span>Club</span><span>P</span><span>GD</span><span>Pts</span></div>
    <div class="list" id="tableList"></div>
    <div class="legend">
      <span><i style="background:var(--good)"></i>Promotion</span>
      <span><i style="background:#E8B94E"></i>Play-offs</span>
      <span><i style="background:var(--bad)"></i>Relegation</span>
    </div>
    <div class="section-title">Top scorers</div>
    <div id="topScorersList"></div>`;
  const rules = TIER_RULES[activeTableTier] || {auto:0, playoff:0, releg:(FOREIGN_LEAGUES[activeTableTier]||{}).releg||0};
  const rows = computeTable(activeTableTier);
  const list = document.getElementById("tableList");
  list.innerHTML = "";
  rows.forEach((r,i)=>{
    const c = clubById(r.id);
    const pos = i+1;
    let zone = "";
    if(pos<=rules.auto) zone="promo";
    else if(pos<=rules.auto+rules.playoff) zone="playoff";
    else if(pos>rows.length-rules.releg && rules.releg>0) zone="releg";
    const row = document.createElement("div");
    row.className = "table-row"+(r.id===club.id?" me":"")+(zone?" "+zone:"");
    row.innerHTML = `<span class="rank">${pos}</span>
      ${crestSVG(c,20)}
      <span class="tname">${c.name}</span>
      <span class="col">${r.played}</span>
      <span class="col">${r.gf-r.ga>0?"+":""}${r.gf-r.ga}</span>
      <span class="pts">${r.pts}</span>`;
    list.appendChild(row);
  });

  // Top scorers for the selected tier, drawn from live per-player season stats.
  const scorers = [];
  state.tiers[activeTableTier].clubIds.forEach(cid=>{
    state.squads[cid].forEach(p=>{ if(p.goals>0) scorers.push(p); });
  });
  scorers.sort((a,b)=> b.goals-a.goals);
  const tsEl = document.getElementById("topScorersList");
  if(scorers.length===0){
    tsEl.innerHTML = `<div class="empty-hint">No goals scored yet this season.</div>`;
  } else {
    const tsList = document.createElement("div");
    tsList.className = "list";
    scorers.slice(0,10).forEach((p,idx)=>{
      const pc = clubById(p.clubId);
      const r = document.createElement("div");
      r.className = "row" + (p.clubId===state.clubId ? " me" : "");
      r.innerHTML = `<span style="width:16px; color:var(--text-dim); font-size:12px; text-align:right; flex-shrink:0;">${idx+1}</span>
        ${avatarSVG(p,28)}
        <span class="pname">${fullName(p)}<br><span style="font-size:11px; color:var(--text-dim);">${pc.name}</span></span>
        <span class="ovr num" style="color:var(--accent);">${p.goals}</span>`;
      r.onclick = ()=> openPlayerModal(p, p.clubId===state.clubId);
      tsList.appendChild(r);
    });
    tsEl.innerHTML = "";
    tsEl.appendChild(tsList);
  }

}

const NEWS_ICONS = {board:"📋", cup:"🏆", trophy:"🏆", transfer:"🔁", injury:"🚑", season:"📅", info:"📣"};

const WIRE_ICONS = {transfer:"🔁", offfield:"📰", personal:"👤", milestone:"⭐",
  health:"🏥", tribute:"🕯️", rumour:"💬", club:"🏟️"};
let wireFilter = "all";

function renderNews(){
  if(!state || !state.clubId || !state.squads) return;   // no career loaded yet
  const el = document.getElementById("screen-news");
  if(!el) return;
  const wire = (state.wire||[]).filter(n=> wireFilter==="all" || n.cat===wireFilter);

function renderCommercial(host, club){
  const sOffers = state.sponsorOffers || [];
  const nOffers = state.namingOffers || [];
  let html = `<div class="club-identity">
      <div><span class="ci-label">Stadium</span><span class="ci-value">${stadiumDisplayName(club)}</span></div>
      <div><span class="ci-label">Capacity</span><span class="ci-value">${club.capacity.toLocaleString()}</span></div>
      <div><span class="ci-label">Shirt sponsor</span><span class="ci-value">${club.sponsor?club.sponsor.name+" · "+fmtMoney(club.sponsor.perYear)+"/yr":"None"}</span></div>
      <div><span class="ci-label">Naming rights</span><span class="ci-value">${club.namingDeal?club.namingDeal.brand+" · "+fmtMoney(club.namingDeal.perYear)+"/yr":"None"}</span></div>
    </div>`;

  if(sOffers.length && !club.sponsor){
    html += `<div class="section-title">Shirt sponsorship offers</div><div id="sponsorOffers"></div>`;
  }
  if(nOffers.length && !club.namingDeal){
    html += `<div class="section-title">Stadium naming rights</div><div id="namingOffers"></div>`;
  }
  if((!sOffers.length || club.sponsor) && (!nOffers.length || club.namingDeal)){

      <span class="conv-note">${fmtMoney(o.perYear)} per season · ${o.years} year${o.years>1?"s":""}<br>${o.note}</span></span>`;
    b.onclick = ()=>{ acceptSponsor(o); state.sponsorOffers = []; toast(`${o.name} signed`); render(); };
    sHost.appendChild(b);
  });

  const nHost = document.getElementById("namingOffers");

      const b = document.createElement("button");
      b.className = "btn-secondary tour-opt";
      b.innerHTML = `<span class="tour-body"><b>${o.brand}</b>
        <span class="conv-note">${fmtMoney(o.perYear)} a season for ${o.years} years · ${fmtMoney(o.upfront)} up front</span></span>`;
      b.onclick = ()=>{ acceptNamingRights(o); state.namingOffers = []; toast(`Ground renamed`); render(); };
      nHost.appendChild(b);
    });
    const skip = document.createElement("button");
    skip.className = "btn-secondary";
    skip.textContent = "Keep the current name";
    skip.onclick = ()=>{ state.namingOffers = []; render(); };
    nHost.appendChild(skip);
  }
}

  </div>`;

    card.innerHTML = `

      ${level<5 && track.next ? `<div class="fac-next">${track.next(level)}</div>` : ""}
      <button ${level>=5?"disabled":""}>${level>=5?"Max level":"Upgrade to Lv."+(level+1)+" — "+fmtMoney(cost)}</button>
      ${level<5 && club.balance < cost ? `<div class="fac-short">Short by ${fmtMoney(cost - club.balance)}</div>` : ""}`;
    const btn = card.querySelector("button");

      btn.disabled = club.balance < cost;
      btn.onclick = ()=>{
        if(upgradeFacility(track.key)){

        }
      };

    content.appendChild(card);

}

// While out of work you can keep advancing: every league, cup and European
// fixture still plays out, and offers arrive, until somebody hires you.
async function simUnemployedWeek(){
  const week = state.week;
  getAllLeagueIds().forEach(lid=>{
    const league = state.tiers[lid];
    if(!league) return;
    league.fixtures.filter(f=>f.week===week && !f.played).forEach(f=>{
      const {hg,ag} = simulateScore(state.squads[f.home], state.squads[f.away]);
      f.hg=hg; f.ag=ag; f.played=true;
      recordQuickStats(f.home, hg, ag);
      recordQuickStats(f.away, ag, hg);
    });
  });
  const lpIdx = EURO_LEAGUE_WEEKS.indexOf(week);
  Object.keys(EURO_COMPS).forEach(key=>{
    const comp = state.euro[key];
    if(!comp || comp.champion) return;
    if(lpIdx>=0 && comp.stage==="league" && comp.round===lpIdx) playEuroLeagueRound(key);
    if(comp.stage==="ko" && comp.koStage && EURO_KO_WEEKS[comp.koStage]===week) playEuroKnockoutRound(key, comp.koStage);
  });
  Object.keys(CUP_CONFIG).forEach(key=>{
    const cup = state.cups[key];
    if(cup && !cup.champion && cup.pairings && CUP_CONFIG[key].weeks[cup.round]===week) advanceCupRound(key);
  });
  tickAvailability();
  tickManagerWeek();
  generateManagerVacancies();
  state.week++;
  if(state.week > CALENDAR_WEEKS){
    const result = runSeasonRollover();
    saveState(); render(); showSeasonSummary(result); return;
  }
  saveState(); render();
  const n = (state.jobOffers||[]).length;
  toast(n ? `${n} job offer${n>1?"s":""} waiting` : "No offers yet — keep waiting");
}

/* ---- Match day ---- */
async function advanceWeek(){
  const userTier = getUserTier();
  const week = state.week;

  // League fixtures across every league in the game (English pyramid + all
  // foreign top divisions), user's own held back for the modal treatment.
  getAllLeagueIds().forEach(lid=>{
    const league = state.tiers[lid];
    if(!league) return;
    const isUserTier = lid===userTier;
    const weekFixtures = league.fixtures.filter(f=>f.week===week && !f.played);
    const myFixture = isUserTier ? weekFixtures.find(f=>f.home===state.clubId || f.away===state.clubId) : null;
    weekFixtures.forEach(f=>{
      if(f===myFixture) return;
      // Derby, weather and league stakes apply to every fixture, not just yours.
      const ctx = buildMatchContext(f.home, f.away, lid, "league");
      const {hg,ag} = simulateScore(state.squads[f.home], state.squads[f.away], ctx);
      f.hg=hg; f.ag=ag; f.played=true;
      // THE fix (again, at the live call site): without these, no AI player in
      // any league records an appearance, goal, assist, clean sheet or rating.
      recordQuickStats(f.home, hg, ag);
      recordQuickStats(f.away, ag, hg);
    });
    league._pendingUserFixture = myFixture || null;
  });

  // Pre-season friendlies are ordinary fixtures on the calendar.
  const psFixture = preSeasonFixtureThisWeek();
  if(psFixture){
    const r = playPreSeasonFixture(psFixture);
    const detail = buildMatchDetail(r.home, r.away, r.hg, r.ag);
    detail.ctx = r.ctx;
    commitMatchStats(r.home, r.away, r.hg, r.ag, detail);
    await playMatchDay({home:r.home, away:r.away, hg:r.hg, ag:r.ag, week:r.week},
      "Pre-season friendly", detail);
    const opp = clubById(r.away);
    pushNews("Friendly result",
      `${clubById(r.home).name} ${r.hg}-${r.ag} ${opp?opp.name:""} in ${state.preSeason.name}.`, "info");
  }

  // Cup rounds scheduled for this week — resolved for every entrant; only the user's
  // own tie (if any) gets prize money paid out here and a modal below.
  const cupOutcomes = [];
  let pendingNatCupTie = null;
  Object.keys(CUP_CONFIG).forEach(key=>{
    const cup = state.cups[key];
    if(cup && !cup.champion && cup.pairings && CUP_CONFIG[key].weeks[cup.round]===week){
      const outcome = advanceCupRound(key);
      if(outcome) cupOutcomes.push(outcome);
    }
  });

  // European nights: league phase rounds, then knockout rounds on their weeks.
  const euroTies = [];
  if(state.euro){
    const lpIdx = EURO_LEAGUE_WEEKS.indexOf(week);
    Object.keys(EURO_COMPS).forEach(key=>{
      const comp = state.euro[key];
      if(!comp || comp.champion) return;
      if(lpIdx >= 0 && comp.stage==="league" && comp.round===lpIdx){
        const m = playEuroLeagueRound(key);
        if(m) euroTies.push({key, tie:m, label:`${EURO_COMPS[key].name} — League phase`});
      }
      if(comp.stage==="ko" && comp.koStage){
        const stageWeek = EURO_KO_WEEKS[comp.koStage];
        if(stageWeek === week){
          const stageName = {playoff:"Knockout play-off", r16:"Round of 16", qf:"Quarter-final", sf:"Semi-final", final:"FINAL"}[comp.koStage];
          const t = playEuroKnockoutRound(key, comp.koStage);
          if(t) euroTies.push({key, tie:{home:t.a, away:t.b, hg:t.hg, ag:t.ag, week}, label:`${EURO_COMPS[key].name} — ${stageName}`, prize:t.prize});
        }
      }
    });
  }

  // Super Cup, week 1.
  if(state.superCup && !state.superCup.played && week===SEASON_START){
    const sc = state.superCup;
    const res = resolveCupTie(sc.a, sc.b);
    sc.played = true; sc.winner = res.winner;
    if(sc.a===state.clubId || sc.b===state.clubId){
      const detail = buildMatchDetail(sc.a, sc.b, res.hg, res.ag);
      commitMatchStats(sc.a, sc.b, res.hg, res.ag, detail);
      await playMatchDay({home:sc.a, away:sc.b, hg:res.hg, ag:res.ag, week}, "UEFA Super Cup", detail);
      if(res.winner===state.clubId){
        clubById(state.clubId).balance += 5000000;
        state.honours.cups.push({name:"UEFA Super Cup", season:state.season});
        toast("🏆 UEFA Super Cup winners!", 4000);
      }
    }
  }

  for(const et of euroTies){
    const detail = buildMatchDetail(et.tie.home, et.tie.away, et.tie.hg, et.tie.ag);
    commitMatchStats(et.tie.home, et.tie.away, et.tie.hg, et.tie.ag, detail);
    await playMatchDay(et.tie, et.label, detail);
    if(et.prize) toast(`${EURO_COMPS[et.key].name} prize money: ${fmtMoney(et.prize)}`);
    pushNews(et.label, `${clubById(et.tie.home).name} ${et.tie.hg}-${et.tie.ag} ${clubById(et.tie.away).name}`, "cup");
  }

  // National cups across Europe.
  if(state.natCups && NATIONAL_CUP_WEEKS.indexOf(week) >= 0){
    const myNation = (clubById(state.clubId)||{}).leagueNation || "england";
    Object.keys(state.natCups).forEach(nid=>{
      const tie = advanceNationalCup(nid);
      if(tie && nid===myNation){
        pendingNatCupTie = {tie, name: state.natCups[nid].name};
      }
    });
  }

  // Domestic cup ties, then the league game.
  for(const outcome of cupOutcomes){
    if(outcome.userTie){
      const t = outcome.userTie;
      const detail = buildMatchDetail(t.a, t.b, t.hg, t.ag);
      commitMatchStats(t.a, t.b, t.hg, t.ag, detail);
      if(t.a===state.clubId){
        const gate = computeAttendance(clubById(t.a), clubById(t.b), outcome.cfg.name);
        detail.attendance = gate;
        state.pendingCupGate = (state.pendingCupGate||0) + gate.revenue;
        if(gate.soldOut) pushNews("Sell-out!",
          `${gate.attendance.toLocaleString()} packed in for the visit of ${clubById(t.b).name}. Gate receipts: ${fmtMoney(gate.revenue)}.`, "cup");
      }
      await playMatchDay({home:t.a, away:t.b, hg:t.hg, ag:t.ag, week}, `${outcome.cfg.name} — Round ${outcome.roundIdx+1}`, detail);
      toast(`${outcome.cfg.name} prize money: ${fmtMoney(t.prize)}`);
      pushNews(`${outcome.cfg.name} Round ${outcome.roundIdx+1}`,
        `${clubById(t.a).name} ${t.hg}-${t.ag} ${clubById(t.b).name}. Prize money: ${fmtMoney(t.prize)}.`, "cup");
      checkAchievements({cupRoundReached: outcome.roundIdx+1});
    }
    if(outcome.champion){
      toast(`🏆 You won the ${outcome.cfg.name}! +${fmtMoney(outcome.champion.prize)}`, 4200);
      if(!state.honours.cups) state.honours.cups = [];
      state.honours.cups.push({name:outcome.cfg.name, season:state.season});
      pushNews(`${outcome.cfg.name} winners!`,
        `${clubById(state.clubId).name} have lifted the ${outcome.cfg.name}. The board are delighted.`, "trophy");
      checkAchievements({wonCup:true});
    }
  }

  if(pendingNatCupTie){
    const t = pendingNatCupTie.tie;
    const detail = buildMatchDetail(t.a, t.b, t.hg, t.ag);
    commitMatchStats(t.a, t.b, t.hg, t.ag, detail);
    if(t.a===state.clubId){
      const gate = computeAttendance(clubById(t.a), clubById(t.b), pendingNatCupTie.name);
      detail.attendance = gate;
      state.pendingCupGate = (state.pendingCupGate||0) + gate.revenue;
    }
    await playMatchDay({home:t.a, away:t.b, hg:t.hg, ag:t.ag, week}, pendingNatCupTie.name, detail);
    toast(`${pendingNatCupTie.name} prize: ${fmtMoney(t.prize)}`);
  }

  const pending = state.tiers[userTier]._pendingUserFixture;
  let leagueResult = null;
  if(pending){
    const ctx = buildMatchContext(pending.home, pending.away, userTier, "league");
    const {hg,ag} = simulateScore(state.squads[pending.home], state.squads[pending.away], ctx);
    pending.hg=hg; pending.ag=ag; pending.played=true;
    const detail = buildMatchDetail(pending.home, pending.away, hg, ag);
    detail.ctx = ctx;
    commitMatchStats(pending.home, pending.away, hg, ag, detail);
    await playMatchDay(pending, null, detail);

    const isHome = pending.home===state.clubId;
    const myGoals = isHome?hg:ag, oppGoals = isHome?ag:hg;
    const won = myGoals>oppGoals, drew = myGoals===oppGoals;
    // Bookings, then fatigue — the two things that force real rotation.
    const cards = applyMatchDiscipline(state.clubId, true);
    cards.forEach(c=>{
      if(c.kind === "red") pushNews("Sent off",
        `${fullName(c.p)} was shown a red card and is banned for ${c.p.suspensionWeeks} match${c.p.suspensionWeeks>1?"es":""}.`, "injury");
      else pushNews("Suspension",
        `${fullName(c.p)} picked up his fifth booking of the season and misses the next match.`, "injury");
    });
    applyFatigue(state.clubId);
    const gateInfo = isHome ? computeAttendance(clubById(pending.home), clubById(pending.away), "league") : null;
    leagueResult = {played:true, isHome, won, drawn:drew, gate: gateInfo?gateInfo.revenue:0, attendance: gateInfo?gateInfo.attendance:0};
    if(gateInfo) detail.attendance = gateInfo;

    // Season running totals + streaks
    if(state.manager){ state.manager.careerGames++; if(won) state.manager.careerWins++; }
    const ss = state.seasonStats;
    ss.played++; ss.goalsFor+=myGoals; ss.goalsAgainst+=oppGoals;
    if(won) ss.won++; else if(drew) ss.drawn++; else ss.lost++;

    const st = state.streaks;
    st.scoring = myGoals>0 ? st.scoring+1 : 0;
    st.unbeaten = (won||drew) ? st.unbeaten+1 : 0;
    st.cleanSheet = oppGoals===0 ? st.cleanSheet+1 : 0;
    st.win = won ? st.win+1 : 0;

    const mySquad = state.squads[state.clubId];
    const myScorers = isHome?detail.homeScorers:detail.awayScorers;
    const scorerCounts = {};
    myScorers.forEach(s=>{ if(s) scorerCounts[s.id]=(scorerCounts[s.id]||0)+1; });
    const topScorerInMatch = Object.values(scorerCounts).reduce((m,v)=>Math.max(m,v),0);

    checkAchievements({
      playedMatch:true, wonMatch:won, goalsFor:myGoals, goalsAgainst:oppGoals,
      topScorerInMatch, concededFirst: !won ? false : (oppGoals>0),
      playedYouth: selectStartingXI(mySquad).some(p=>p.isYouth),
      seasonGoalsFor: ss.goalsFor,
    });

    if(detail.injuries.length){
      const mine = detail.injuries.filter(i=>i.clubId===state.clubId);
      mine.forEach(i=>{
        pushNews("Injury blow",
          `${fullName(i.player)} has suffered a ${i.name.toLowerCase()} and will be out for ${i.weeks} week${i.weeks>1?"s":""}.`, "injury");
        if(i.careerEnding){
          pushNews("Career over",
            `${fullName(i.player)} has been forced to retire through injury at ${i.player.age}.`, "injury");
          state.squads[state.clubId] = state.squads[state.clubId].filter(x=>x.id!==i.player.id);
        }
      });
      if(mine.length) toast(`${mine.length} injury${mine.length>1?" concerns":""} from that match`);
    }
  }

  if(leagueResult && leagueResult.played){
    applyMoraleFromResult(state.clubId, leagueResult.won, leagueResult.drawn);
  }
  tickOutgoingLoans();
  const devChanges = runInSeasonDevelopment();
  if(devChanges.length){
    const ups = devChanges.filter(c=>c.dir>0);
    if(ups.length && Math.random()<0.5) toast(`${fullName(ups[0].p)} is improving`);
  }
  runLifeEvents();
  // A long absence ending is a story in itself.
  Object.keys(state.squads).forEach(cid=>{
    state.squads[cid].forEach(p=>{
      if(p.onLeave && p.injuryWeeks <= 1){
        const r = resolveIllness(p);
        if(r.retired){
          state.squads[cid] = state.squads[cid].filter(x=>x.id!==p.id);
          if(cid===state.clubId) pushNews("Forced retirement",
            `${fullName(p)} has retired on medical advice.`, "injury");
        }
      }
    });
  });
  processPendingBids();
  generateConversations();
  checkPromises();
  if(isDeadlineWeek()) completeFutureDeals();
  enforceFinancialRules();
  generateWeeklyWire();
  tickAvailability();
  expireOffers();
  generateIncomingOffers();
  generateTransferRequests();

  tickManagerWeek();
  generateManagerVacancies();
  const sackResult = evaluateManagerJob();
  const finance = applyWeeklyFinance(leagueResult);
  state.week++;

  if(state.week > CALENDAR_WEEKS){
    const result = runSeasonRollover();
    saveState(); render();
    // Awards night first, then the summary, then pre-season.
    if(result.seasonAwards){
      try{ renderCeremony(buildCeremony(result.seasonAwards)); }catch(e){ reportError("SEA-04", e); }
    }
    state.awaitingPreSeason = true;
    showSeasonSummary(result);
    return;
  }

  saveState();
  render();
  if(sackResult && sackResult.sacked){
    toast("You have been sacked", 4200);
  } else if(finance.total!==0){
    toast(`This week: ${finance.total>=0?'+':''}${fmtMoney(finance.total)}`);
  }
}

function playMatchDay(fixture, label, detail){
  return new Promise(resolve=>{
    const home = clubById(fixture.home), away = clubById(fixture.away);
    const modal = document.getElementById("matchModal");
    modal.innerHTML = `
      <button class="modal-close" id="matchClose" style="visibility:hidden;">&times;</button>
      <div class="sub" style="text-align:center;">${label || ("Matchweek "+fixture.week)}</div>
      <div class="match-occasion" id="matchOccasion"></div>
      <div class="score-line">
        <div class="side">${crestSVG(home,46)}<div class="n">${home.name}</div></div>
        <div class="score-num num" id="homeScore">0</div>
        <div class="score-num num" id="awayScore">0</div>
        <div class="side">${crestSVG(away,46)}<div class="n">${away.name}</div></div>
      </div>
      <div class="match-clock num" id="matchClock">0'</div>
      <div class="feed" id="matchFeed"></div>
      <div class="ft-label" id="ftLabel"></div>
      <div id="matchSummary"></div>
      <button class="btn-secondary" id="skipBtn" style="margin-top:14px;">Skip to result</button>`;
    document.getElementById("matchBackdrop").classList.add("open");
    playWhistleSound();

    // The occasion — derby, weather, and anything riding on the result.
    const ctx = (detail && detail.ctx) || buildMatchContext(fixture.home, fixture.away, getUserTier(), label ? "cup" : "league");
    const occ = document.getElementById("matchOccasion");
    if(occ){
      const bits = [];
      if(ctx.derby) bits.push(`<span class="occ derby">🔥 DERBY</span>`);
      if(ctx.stakes) bits.push(`<span class="occ stakes">${ctx.stakes.label}</span>`);
      bits.push(`<span class="occ weather">${ctx.weather.icon} ${ctx.weather.label}</span>`);
      occ.innerHTML = bits.join("");
    }

    // A full match feed: goals, bookings, saves, woodwork, offsides and subs,
    // so even a goalless game has something to follow.
    const events = buildFeedEvents(fixture, detail, home, away, ctx);

    let hg=0, ag=0, i=0, finished=false;
    const feed = document.getElementById("matchFeed");
    const homeScoreEl = document.getElementById("homeScore"), awayScoreEl = document.getElementById("awayScore");
    const clockEl = document.getElementById("matchClock");

    function renderSummary(){
      if(!detail) return;
      const motm = detail.motmId ? findPlayerById(detail.motmId) : null;
      const poss = detail.possession;
      document.getElementById("matchSummary").innerHTML = `
        <div class="match-stats">
          <div class="ms-row"><span>${poss}%</span><span class="ms-label">Possession</span><span>${100-poss}%</span></div>
          <div class="ms-bar"><div class="ms-fill" style="width:${poss}%; background:${home.primary};"></div><div class="ms-fill" style="width:${100-poss}%; background:${away.primary};"></div></div>
          <div class="ms-row"><span>${detail.homeShots}</span><span class="ms-label">Shots</span><span>${detail.awayShots}</span></div>
          <div class="ms-row"><span>${events.filter(e=>e.side==="home"&&e.type==="yellow").length}🟨 ${events.filter(e=>e.side==="home"&&e.type==="red").length}🟥</span><span class="ms-label">Cards</span><span>${events.filter(e=>e.side==="away"&&e.type==="yellow").length}🟨 ${events.filter(e=>e.side==="away"&&e.type==="red").length}🟥</span></div>
        </div>
        ${detail.attendance ? `<div class="attendance-line">
          🎟 ${detail.attendance.attendance.toLocaleString()} attendance${detail.attendance.soldOut?' <span style="color:var(--accent);">· SOLD OUT</span>':''}
          · gate ${fmtMoney(detail.attendance.revenue)}
        </div>` : ""}
        ${motm ? `<div class="motm">
          ${avatarSVG(motm,38)}
          <div><div class="motm-label">Player of the match</div>
          <div class="motm-name">${fullName(motm)} <span class="num" style="color:var(--accent);">${detail.motmBest.toFixed(1)}</span></div></div>
        </div>` : ""}`;
    }

    function finish(){
      if(finished) return;
      finished = true;
      hg = fixture.hg; ag = fixture.ag;
      homeScoreEl.textContent=hg; awayScoreEl.textContent=ag;
      clockEl.textContent = "FT";
      document.getElementById("ftLabel").textContent = `Full-time: ${fixture.hg}-${fixture.ag}`;
      document.getElementById("skipBtn").style.display = "none";
      renderSummary();
      const closeBtn = document.getElementById("matchClose");
      closeBtn.style.visibility="visible";
      closeBtn.onclick = ()=>{ document.getElementById("matchBackdrop").classList.remove("open"); resolve(); };
      const cont = document.createElement("button");
      cont.className = "btn-primary"; cont.textContent = "Continue";
      cont.onclick = ()=>{ document.getElementById("matchBackdrop").classList.remove("open"); resolve(); };
      modal.appendChild(cont);
    }

    document.getElementById("skipBtn").onclick = ()=>{
      // Flush any unshown goals into the feed so the story still reads correctly.
      while(i<events.length){
        const ev = events[i++];
        if(ev.type !== "goal") continue;
        if(ev.side==="home") hg++; else ag++;
        addLine(ev, true);
      }
      finish();
    };

    function addLine(ev, instant){
      const line = document.createElement("div");
      line.className = "line" + (ev.type==="red" ? " red" : ev.type==="yellow" ? " yellow" : "");
      if(ev.type === "goal"){
        const who = ev.player ? fullName(ev.player) : (ev.side==="home"?home.name:away.name);
        line.innerHTML = `${ev.minute}&#39; ⚽ <b>GOAL</b> — ${who} makes it ${hg}-${ag}`;
      } else {
        const l = feedLineFor(ev, home, away);
        line.innerHTML = `${ev.minute}&#39; ${l.icon} ${l.text}`;
      }
      feed.appendChild(line);
      if(instant) line.classList.add("show");
      else requestAnimationFrame(()=>line.classList.add("show"));
      feed.scrollTop = feed.scrollHeight;
    }

    function step(){
      if(finished) return;
      if(i>=events.length){ finish(); return; }
      const ev = events[i++];
      clockEl.textContent = ev.minute+"'";
      if(ev.type === "goal"){
        if(ev.side==="home") hg++; else ag++;
        homeScoreEl.textContent=hg; awayScoreEl.textContent=ag;
        const flashEl = ev.side==="home"?homeScoreEl:awayScoreEl;
        flashEl.classList.remove("flash"); void flashEl.offsetWidth; flashEl.classList.add("flash");
        playGoalSound();
      }
      addLine(ev, false);
      const pace = ev.type === "goal" ? 750 : ev.type === "red" ? 650 : 380;
      setTimeout(step, pace * matchSpeedMultiplier());
    }
    setTimeout(step, 300 * matchSpeedMultiplier());
  });
}

function findPlayerById(id){
  for(const clubId in state.squads){
    const found = state.squads[clubId].find(p=>p.id===id);
    if(found) return found;
  }
  return null;
}

        <div><div class="motm-label">World Player of the Year</div>
        <div class="motm-name">${fullName(result.seasonAwards.ballonDor)}</div></div>
      </div>` : ""}
    ${(result.seasonAwards && result.seasonAwards.userAwards.length) ? `<div class="section-title">Your players' awards</div>
      ${result.seasonAwards.userAwards.slice(0,8).map(u=>

      ${result.retirements.map(p=>`<div class="youth-item"><span>${flagFor(p.nat)} ${fullName(p)}</span><span style="font-size:11.5px; color:var(--text-dim);">age ${p.age} · ${p.careerApps||0} apps</span></div>`).join("")}` : ""}
    <div class="section-title">Next season</div>

    b.innerHTML = `<span class="tour-icon">${d.icon}</span>
      <span class="tour-body"><b>${d.name}</b>
        <span class="conv-note">${fee>0?fmtMoney(fee)+" in fees":"No fees"} · +${d.fitness} sharpness${d.reputation?" · raises your profile":""}</span>
      </span>`;
    b.onclick = ()=>{
      schedulePreSeason(d.id);
      state.awaitingPreSeason = false;
      document.getElementById("preSeasonBackdrop").classList.remove("open");
      playClickSound();
      // Offers for the season ahead land in the inbox to deal with when you like.
      state.sponsorOffers = generateSponsorOffers();
      state.namingOffers = generateNamingOffers();
      pushNews("Commercial offers received",
        "Shirt sponsorship and stadium naming offers are on the table for the season ahead. Review them on the Club screen.", "board");
      render();
    };
    list.appendChild(b);
  });
  document.getElementById("preSeasonBackdrop").classList.add("open");
}

function renderSlotPicker(){
  const menu = document.getElementById("startMenu");
  if(!menu) return;
  menu.innerHTML = `<div class="slot-title">Choose a save</div>`;
  for(let n=1; n<=SLOT_COUNT; n++){
    const exists = slotExists(n);
    const row = document.createElement("div");
    row.className = "slot-row" + (n===activeSlot ? " active" : "");
    row.innerHTML = `
      <button class="slot-main" data-slot="${n}">
        <span class="slot-num">${n}</span>
        <span class="slot-body">
          <b>${exists ? "Continue" : "New career"}</b>
          <span class="slot-sub">${slotSummary(n)}</span>
        </span>
      </button>
      ${exists ? `<button class="slot-del" data-del="${n}" title="Delete">✕</button>` : ""}`;
    menu.appendChild(row);
  }

  menu.querySelectorAll(".slot-main").forEach(b=>{
    b.onclick = ()=>{
      const n = +b.dataset.slot;
      setActiveSlot(n);
      playClickSound();
      if(slotExists(n)){
        const loaded = loadState();
        if(loaded && loaded.game){
          CLUB_META = loaded.clubMeta;
          state = loaded.game;
          enterMainApp();
          render();
          return;
        }
      }
      showClubSelectFlow();          // empty slot: start a new career here
    };
  });
  menu.querySelectorAll(".slot-del").forEach(b=>{
    b.onclick = ()=>{
      const n = +b.dataset.del;
      confirmDialog("Delete save " + n + "?",
        "This career will be gone for good. Your other saves are untouched.")
        .then(ok=>{ if(ok){ deleteSlot(n); renderSlotPicker(); toast("Save " + n + " deleted"); } });
    };
  });

  const diag = document.createElement("button");
  diag.className = "btn-secondary slot-diag";
  diag.textContent = "Settings & diagnostics";
  diag.onclick = ()=> renderSettingsScreen();
  menu.appendChild(diag);

  const ver = document.createElement("div");
  ver.className = "version-tag";
  ver.textContent = "v" + GAME_VERSION;
  menu.appendChild(ver);
}

function renderStartScreen(){
  hideAllTopScreens();
  setTimeout(renderSlotPicker, 0);
  setTimeout(()=>{
    const ws = document.getElementById("worldStats");
    if(!ws) return;
    const clubs = Object.keys(CLUB_META).length;
    const real = REAL_PLAYERS.length + EURO_REAL_PLAYERS.length +
                 EURO_REAL_PLAYERS_2.length + CARDIFF_AND_WALES.length;
    ws.innerHTML = `
      <div class="ws"><b>${getAllLeagueIds().length}</b><span>Leagues</span></div>
      <div class="ws"><b>${clubs}</b><span>Clubs</span></div>
      <div class="ws"><b>${real}</b><span>Real players</span></div>`;
  }, 0);
  document.getElementById("startScreen").style.display="flex";
  const saved = loadState();
  const menu = document.getElementById("startMenu");
  menu.innerHTML = "";

  if(saved && saved.game){
    const club = saved.clubMeta[saved.game.clubId];
    const g = saved.game;
    const achCount = (g.achievements||[]).length;
    const continueBtn = document.createElement("button");
    continueBtn.className = "btn-primary"; continueBtn.style.marginTop="0";
    continueBtn.innerHTML = `Continue<span class="continue-sub">${club?club.name:"Saved game"} · Season ${g.season} · Week ${Math.min(g.week,GLOBAL_MAX_WEEK)} · 🏅${achCount}</span>`;
    continueBtn.onclick = ()=>{
      playClickSound(); CLUB_META=saved.clubMeta; state=saved.game;
      // Backfill anything a save from an older build won't have, so continuing
      // never lands on a half-initialised world.
      state.freeAgents = state.freeAgents||[]; state.offers = state.offers||[];
      state.transferRequests = state.transferRequests||[]; state.jobOffers = state.jobOffers||[];
      state.sackPressure = state.sackPressure||0; state.pendingCupGate = state.pendingCupGate||0;
      ensureManagers();
      if(!state.manager) initManagerProfile(state.clubId);
      enterMainApp();
    };
    menu.appendChild(continueBtn);
  }

  const newBtn = document.createElement("button");
  const hasSave = !!(saved && saved.game);
  newBtn.className = hasSave ? "btn-secondary" : "btn-primary";
  if(!hasSave) newBtn.style.marginTop="0";
  newBtn.textContent = "New game";
  newBtn.onclick = async ()=>{
    playClickSound();
    if(hasSave){ const ok = await confirmDialog("Start a new game?", "This will erase your current save."); if(!ok) return; }
    showClubSelectFlow();
  };
  menu.appendChild(newBtn);

  const settingsBtn = document.createElement("button");
  settingsBtn.className = "btn-secondary";
  settingsBtn.textContent = "Settings";
  settingsBtn.onclick = ()=>{ playClickSound(); renderSettingsScreen(renderStartScreen); };
  menu.appendChild(settingsBtn);
}

function makeToggleRow(label, sub, value, onChange){
  const row = document.createElement("div"); row.className="setting-row";
  row.innerHTML = `<div><div class="label">${label}</div><div class="sub">${sub}</div></div>`;
  const sw = document.createElement("button"); sw.className = "switch"+(value?" on":"");
  sw.innerHTML = '<span class="knob"></span>';
  sw.onclick = ()=>{ const nv = !sw.classList.contains("on"); sw.classList.toggle("on", nv); onChange(nv); };
  row.appendChild(sw);
  return row;
}

function renderSettingsScreen(onBack){
  hideAllTopScreens();
  document.getElementById("settingsScreen").style.display="flex";
  const body = document.getElementById("settingsBody");
  body.innerHTML = "";

  const speedRow = document.createElement("div");
  speedRow.className = "setting-row";
  speedRow.innerHTML = `<div><div class="label">Match speed</div><div class="sub">How fast match events play out</div></div>`;
  const seg = document.createElement("div"); seg.className="segmented";
  ["slow","normal","fast"].forEach(opt=>{
    const b = document.createElement("button");
    b.textContent = opt.charAt(0).toUpperCase()+opt.slice(1);
    b.className = SETTINGS.matchSpeed===opt ? "active" : "";
    b.onclick = ()=>{ SETTINGS.matchSpeed=opt; saveSettings(); renderSettingsScreen(onBack); };
    seg.appendChild(b);
  });
  speedRow.appendChild(seg);
  body.appendChild(speedRow);

  body.appendChild(makeToggleRow("Sound effects", "Goal horn, kickoff whistle, taps", SETTINGS.sound, v=>{ SETTINGS.sound=v; saveSettings(); }));
  body.appendChild(makeToggleRow("Reduce motion", "Calmer transitions, less animation", SETTINGS.reducedMotion, v=>{ SETTINGS.reducedMotion=v; saveSettings(); }));

  const diagRow = document.createElement("div");
  diagRow.className = "setting-row";
  diagRow.style.display = "block";
  diagRow.innerHTML = `<div class="label" style="margin-bottom:4px;">Report a problem</div>
    <div class="sub" style="margin-bottom:8px;">Copies the build, your save state and recent errors so they can be pasted straight into the chat.</div>
    <button class="btn-secondary" id="copyDiagBtn" style="margin-top:0;">Copy diagnostic</button>`;
  body.appendChild(diagRow);
  const cd = document.getElementById("copyDiagBtn");
  if(cd) cd.onclick = copyDiagnostic;

  // Recent errors, so a code can be reported after the fact.
  if(typeof ERROR_LOG !== "undefined" && ERROR_LOG.length){
    const errRow = document.createElement("div");
    errRow.className = "setting-row";
    errRow.style.display = "block";
    errRow.innerHTML = `<div class="label" style="margin-bottom:6px;">Recent errors</div>` +
      ERROR_LOG.slice(0,5).map(e=>
        `<div style="font-size:11px; color:var(--text-dim); margin-bottom:5px; line-height:1.35;">
           <b style="color:var(--bad);">${e.code}</b> ${(ERROR_AREAS[e.code]||"")}<br>
           ${(e.msg||"").slice(0,90)}<br>
           <span style="opacity:0.7;">${(e.where||"").slice(0,70)} · S${e.season} wk ${e.week}</span>
         </div>`).join("");
    body.appendChild(errRow);
  }

  const eraseRow = document.createElement("div");
  eraseRow.className = "setting-row";
  eraseRow.innerHTML = `<div><div class="label">Erase save</div><div class="sub">Deletes your current career permanently</div></div>`;
  const eraseBtn = document.createElement("button");
  eraseBtn.className = "btn-secondary btn-danger";
  eraseBtn.style.cssText = "width:auto; margin-top:0; padding:8px 14px; flex-shrink:0;";
  eraseBtn.textContent = "Erase";
  eraseBtn.onclick = async ()=>{
    const ok = await confirmDialog("Erase your save?", "This can't be undone.");
    if(ok){ try{ window.localStorage.removeItem(STORAGE_KEY); }catch(e){} renderSettingsScreen(onBack); }
  };
  eraseRow.appendChild(eraseBtn);
  body.appendChild(eraseRow);

  document.getElementById("settingsBackBtn").onclick = ()=>{ playClickSound(); (onBack||renderStartScreen)(); };
}

document.getElementById("fabAdvance").addEventListener("click", ()=>{
  if(state && state.manager && state.manager.unemployed) simUnemployedWeek();
  else advanceWeek();
});

const advanceFab = document.getElementById("advanceFab");
advanceFab.addEventListener("click", async ()=>{
  if(advanceFab.disabled) return;
  advanceFab.disabled = true; advanceFab.classList.add("busy");
  playClickSound();
  try { await advanceWeek(); }
  catch(e){ reportError("SIM-01", e); }
  finally { advanceFab.disabled = false; advanceFab.classList.remove("busy"); }
});

// With no club, squad/transfer/club tabs are meaningless — hide them.
function refreshNavForEmployment(){
  const unemployed = !!(state.manager && state.manager.unemployed);
  const allowed = ["dashboard","table","inbox","news"];
  document.querySelectorAll(".nav-btn").forEach(btn=>{
    const scr = btn.dataset.screen;
    const show = !unemployed || allowed.indexOf(scr) !== -1;
    btn.style.display = show ? "" : "none";
    if(!show && btn.classList.contains("active")){
      document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
      const dash = document.querySelector('.nav-btn[data-screen="dashboard"]');
      if(dash) dash.classList.add("active");
      const ds = document.getElementById("screen-dashboard");
      if(ds) ds.classList.add("active");
    }
  });
}

function refreshAdvanceFab(){
  refreshNavForEmployment();
  // Say what next week actually is: a friendly, a league game, or a quiet week.
  const subEl = document.getElementById("advanceFabSub");
  if(subEl && state && state.clubId && !(state.manager && state.manager.unemployed)){
    const phase = calendarPhase(state.week);
    const ps = preSeasonFixtureThisWeek();
    if(ps){
      const opp = clubById(ps.opp);
      subEl.textContent = "Friendly v " + (opp ? opp.name : "TBC");
      return;
    }
    if(phase === "preseason"){
      subEl.textContent = state.preSeason && state.preSeason.chosen
        ? "Pre-season · " + state.preSeason.name
        : "Pre-season · choose a tour";
      return;
    }
    if(phase === "summer"){ subEl.textContent = "Close season"; return; }
    const lg = state.tiers[getUserTier()];
    const fx = lg && lg.fixtures.find(f=>f.week===state.week && !f.played &&
      (f.home===state.clubId || f.away===state.clubId));
    if(fx){
      const opp = clubById(fx.home===state.clubId ? fx.away : fx.home);
      subEl.textContent = (fx.home===state.clubId ? "vs " : "@ ") + (opp?opp.name:"") +
        (fx.midweek ? " · midweek" : "");
      return;
    }
    subEl.textContent = "No fixture this week";
    return;
  }
  const sub = document.getElementById("advanceFabSub");
  if(!sub || !state) return;
  if(state.unemployed){
    sub.textContent = "Out of work · waiting for offers";
  } else {
    const tier = getUserTier();
    const tierMax = state.tiers[tier] && state.tiers[tier].clubIds.length===20 ? 38 : 46;
    const wk = Math.min(state.week, GLOBAL_MAX_WEEK);
    const fx = state.tiers[tier] ? state.tiers[tier].fixtures.find(f=>f.week===state.week && !f.played &&
      (f.home===state.clubId || f.away===state.clubId)) : null;
    if(fx){
      const opp = clubById(fx.home===state.clubId ? fx.away : fx.home);
      sub.textContent = (fx.home===state.clubId?"vs ":"@ ") + (opp?opp.name:"") + " · wk " + wk;
    } else {
      sub.textContent = state.week > tierMax ? "Season complete" : "No fixture · wk " + wk;
    }
  }
}

document.getElementById("gameMenuBtn").addEventListener("click", ()=>{
  playClickSound();
  document.getElementById("gameMenuBackdrop").classList.add("open");
});
document.getElementById("errorOkBtn").onclick = ()=> document.getElementById("errorBackdrop").classList.remove("open");
document.getElementById("errorBackdrop").addEventListener("click", e=>{ if(e.target.id==="errorBackdrop") e.currentTarget.classList.remove("open"); });
// Anything that escapes gets surfaced too, rather than dying silently.
// A last-resort net. Anything reaching here has escaped its guard, so capture
// as much as the browser will give us — "Script error." on its own is useless.
window.addEventListener("error", e=>{
  const detail = [
    e && e.message ? e.message : "Unknown error",
    e && e.filename ? e.filename.split("/").pop() : "",
    (e && e.lineno) ? ("line " + e.lineno + ":" + (e.colno||0)) : "",
  ].filter(Boolean).join(" — ");
  reportError("SYS-01", {message: detail, stack: (e && e.error && e.error.stack) || ""});
});
window.addEventListener("unhandledrejection", e=>{
  reportError("SYS-02", (e && e.reason) || {message:"A background task failed."});
});

document.getElementById("gameMenuClose").onclick = ()=> document.getElementById("gameMenuBackdrop").classList.remove("open");
document.getElementById("gameMenuBackdrop").addEventListener("click", e=>{ if(e.target.id==="gameMenuBackdrop") e.currentTarget.classList.remove("open"); });
document.getElementById("gameMenuSettingsBtn").onclick = ()=>{
  document.getElementById("gameMenuBackdrop").classList.remove("open");
  renderSettingsScreen(enterMainApp);
};
document.getElementById("gameMenuTitleBtn").onclick = ()=>{
  document.getElementById("gameMenuBackdrop").classList.remove("open");
  renderStartScreen();
};

// Attach an error code to every screen and system. A failure anywhere now
// names the exact area instead of escaping as a bare "Script error."
(function installGuards(){
  const map = [
    ["RND-01","renderDashboard"], ["RND-02","renderSquadList"], ["RND-03","renderTransfers"],
    ["RND-04","renderTable"],     ["RND-05","renderClub"],      ["RND-06","renderInbox"],
    ["RND-07","renderNews"],      ["RND-08","renderPitch"],     ["RND-09","renderTactics"],
    ["RND-10","renderStartScreen"],["RND-11","renderClubGrid"], ["RND-12","openPlayerModal"],
    ["RND-02","renderSquad"],     ["RND-03","renderTransferResultsOnly"],
    ["SIM-02","buildMatchDetail"],["SIM-03","advanceCupRound"], ["SIM-04","playEuroLeagueRound"],
    ["SEA-02","runShadowPromotionRelegation"], ["SEA-03","runYouthRotation"], ["SEA-04","runSeasonAwards"],
    ["TRF-01","submitOffer"],     ["TRF-02","loanInPlayer"],    ["TRF-03","renewContract"],
    ["FIN-01","applyWeeklyFinance"], ["FIN-02","setSeasonBudgets"],
  ];
  map.forEach(([code, name])=>{
    const fn = globalThis[name] || (typeof eval("typeof "+name) !== "undefined" ? eval(name) : null);
    if(typeof fn === "function"){
      try{ eval(name + " = guard('" + code + "', " + name + ");"); }catch(_){}
    }
  });
})();

function boot(){
  loadActiveSlot();
  try{ checkForUpdate(); }catch(e){}
  try{ auditPlayerData(); }catch(e){ reportError("DAT-01", e); }
  try{ buildClubMeta(); }catch(e){ return reportError("BOOT-01", e); } // provisional, so club-select has colors/crests even before a save exists
  try{ loadSettings(); }catch(e){ reportError("BOOT-02", e); }
  try{ renderStartScreen(); }catch(e){ reportError("BOOT-03", e); }
}

boot();

})();
