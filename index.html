    return {willing:true, reason:"would come for the opportunity", wageDemand:1.2};
  }
  return {willing:false,
    reason:`won't drop to ${leagueDisplayName(buyingClub.tier)} — he expects a club of far higher standing`};
}


/* =========================================================================
   TRANSFER NEGOTIATION, JOINING INTEREST AND CONTRACT CLAUSES
   Players are no longer vending machines. A star at a big club won't drop
   into a National League side for any money, an unlisted player has to be
   prised away with an offer his club will actually consider, and deals carry
   the clauses real transfers do: sell-on percentages, buy-backs, release
   clauses and loans with an option or obligation to buy.
   ========================================================================= */

// A club's standing in the game world, 0-100. Drives who will sign for whom,
// which clubs poach managers, and how hard a selling club bargains.
function clubPrestige(club){
  if(!club) return 25;
  const leagueWeight = {
    premierleague:88, laliga:87, seriea:84, bundesliga:84, ligue1:80,
    championship:60, eredivisie:58, primeira:58, superlig:56, spfl:52, probelgium:52,
    austrian:48, swiss:48, greek:48, czech:46, danish:46, norwegian:44, croatian:44,
    serbian:44, polish:44, ukrainian:44, swedish:42,
    leagueone:42, leaguetwo:30, nationalleague:20, nlnorth:12, nlsouth:12
  }[club.tier] || 28;
  const stature = (club.stature || 9) * 1.5;
  const wealth = clamp((club.balance || 0) / 4e8, 0, 1) * 8;
  const hidden = club.hidden ? -8 : 0;   // a second-tier side carries less pull
  return clamp(Math.round(leagueWeight * 0.68 + stature + wealth + hidden), 1, 99);
}

// How willing a player is to join YOUR club, 0-1. Stature gap is the big one:
// a 90-rated player simply will not sign for a non-league side.
function joiningInterest(p, targetClub){
  const from = clubById(p.clubId);
  const myPrestige = clubPrestige(targetClub);
  const theirPrestige = from ? clubPrestige(from) : 25;
  const rating = ratingOf(p);

  // A player's own level sets the floor of what he'll accept.
  const playerLevel = clamp((rating - 40) / 55, 0, 1) * 100;   // 40-95 -> 0-100
  const gap = playerLevel - myPrestige;

  let interest = 1 - clamp(gap / 45, 0, 1);

  // Ambition: the younger and better he is, the more he wants to move UP.
  if(theirPrestige > myPrestige + 12) interest *= p.age <= 21 ? 0.55 : 0.32;
  else if(theirPrestige > myPrestige + 5) interest *= 0.7;
  else if(myPrestige > theirPrestige + 10) interest = clamp(interest + 0.25, 0, 1);

  // Unhappy or out of the side? He'll listen to anyone.
  if(p.morale <= 7) interest = clamp(interest + 0.22, 0, 1);
  if((state.transferRequests||[]).some(r=>r.playerId===p.id)) interest = clamp(interest + 0.3, 0, 1);
  if(p.listed) interest = clamp(interest + 0.18, 0, 1);
  // Old pros are more willing to drop down for regular football.
  if(p.age >= 32) interest = clamp(interest + 0.2, 0, 1);
  // Young prospects will take a loan almost anywhere for game time.
  return clamp(interest, 0, 1);
}

function interestLabel(v){
  if(v >= 0.75) return {text:"Keen to join", cls:"good"};
  if(v >= 0.5)  return {text:"Open to it", cls:"good"};
  if(v >= 0.3)  return {text:"Would need convincing", cls:"warn"};
  if(v >= 0.12) return {text:"Reluctant", cls:"warn"};
  return {text:"Not interested", cls:"bad"};
}

// A loan is easier to sell to a young player than a permanent step down.
function loanInterest(p, targetClub){
  let base = joiningInterest(p, targetClub);
  if(p.age <= 23 && (p.potential||p.overall) > p.overall) base = clamp(base + 0.35, 0, 1);
  if((p.apps||0) < Math.max(1, (state.seasonStats.played||0) * 0.3)) base = clamp(base + 0.15, 0, 1);
  return clamp(base, 0, 1);
}

/* ---- Contract clauses, as they work in the real game ---- */
const CLAUSE_TYPES = {
  sellOn:     {name:"Sell-on clause",  desc:"They take a cut of any future fee you receive."},
  buyBack:    {name:"Buy-back clause", desc:"They may repurchase him later at a fixed price."},
  release:    {name:"Release clause",  desc:"You must accept any bid that meets this figure."},
  optionBuy:  {name:"Option to buy",   desc:"You may sign him permanently at the agreed fee."},
  obligation: {name:"Obligation to buy", desc:"You must sign him permanently at season's end."},
};

// Clauses a selling club will attach, based on the player's profile.
function proposeClauses(p, fee){
  const clauses = [];
  const young = p.age <= 23;
  const promising = (p.potential||p.overall) - p.overall >= 2;
  if(young && promising && Math.random() < 0.55){
    clauses.push({type:"sellOn", pct: pick([10,12,15,20,25])});
  }
  if(young && promising && Math.random() < 0.28){
    clauses.push({type:"buyBack", fee: Math.round(fee * rnd(1.6, 2.6))});
  }
  return clauses;
}

// A negotiated fee: unlisted players cost a premium, listed ones a discount.
function negotiatedFee(p, kind){
  const from = clubById(p.clubId);
  const base = playerAskingPrice(p, from ? from.tier : "leagueone");
  if(kind === "loanToBuy") return Math.round(base * 1.05);
  if(p.listed) return Math.round(base * LISTED_DISCOUNT);
  // Prising away a player nobody wants to sell costs 25-60% over the odds.
  const resistance = 1.25 + clamp((clubPrestige(from||{tier:"leagueone"}) - 40)/100, 0, 0.35);
  return Math.round(base * resistance);
}

/* ---- Making an offer ---- */
// Returns {ok, reason, code} so failures can be surfaced with a real error code.
function submitOffer(p, kind, fee, extras){
  extras = extras || {};
  const buyer = clubById(state.clubId);
  const from = clubById(p.clubId);
  if(!from) return {ok:false, code:"OFR-01", reason:"That player's club could not be found."};
  if(state.squads[buyer.id].length >= SQUAD_MAX) return {ok:false, code:"OFR-02", reason:"Your squad is full (30 maximum)."};

  const interest = kind === "loan" ? loanInterest(p, buyer) : joiningInterest(p, buyer);
  const wageAsk = playerWage(p, buyer.tier);

  if(kind === "loan"){
    if(!transferWindowOpen()) return {ok:false, code:"WIN-02",
      reason:`Loans can only be agreed while the window is open. It reopens in ${weeksUntilWindow()} week${weeksUntilWindow()===1?"":"s"}.`};
    const lf = loanFee(p);
    if(buyer.balance < lf) return {ok:false, code:"OFR-03", reason:"You cannot afford the loan fee."};
    if(interest < 0.25) return {ok:false, code:"OFR-04",
      reason:`${fullName(p)} does not want to join on loan — ${interestLabel(interest).text.toLowerCase()}.`};

    // League loan limits.
    const rules = checkLoanRules(buyer, p);
    if(!rules.ok) return rules;

    // The parent club's decision — the half that was missing. No elite club
    // sends a player to a level where the loan does nothing for him.
    const standing = clubPrestige(buyer);
    const allowance = p.age <= 21 ? 12 : 8;
    if(ratingOf(p) > standing + allowance){
      return {ok:false, code:"LON-03",
        reason:`${from.name} will not loan ${fullName(p)} to a club at your level. Clubs of your standing are offered players rated around ${Math.round(standing + allowance)}.`};
    }
    // And nobody loans out a first-team regular.
    const parentSquad = state.squads[from.id] || [];
    const rank = parentSquad.slice().sort((a,b)=>ratingOf(b)-ratingOf(a)).findIndex(x=>x.id===p.id);
    if(rank >= 0 && rank < 11 && p.age > 20){
      return {ok:false, code:"LON-04",
        reason:`${fullName(p)} is a first-team regular at ${from.name}. They will not loan him out.`};
    }

    // Wages: the parent club normally covers part of a loanee's salary.
    const loanWage = canAffordWages(buyer, p, 0.65);
    if(!loanWage.ok) return loanWage;

    if(Math.random() > 0.55 + interest*0.4) return {ok:false, code:"OFR-05",
      reason:`${from.name} have rejected the loan approach.`};
    return loanInPlayer(p);
  }

  // Permanent or loan-to-buy.
  const win = transferWindowOpen();
  if(!win) return {ok:false, code:"WIN-01",
    reason:`The transfer window is shut. It reopens in ${weeksUntilWindow()} week${weeksUntilWindow()===1?"":"s"}.`};
  if(buyer.transferEmbargo) return {ok:false, code:"FFP-01",
    reason:"The club is under a transfer embargo until the wage bill is back within budget."};
  const wageCheck = canAffordWages(buyer, p, 1);
  if(!wageCheck.ok) return wageCheck;

  if(kind === "check") return {ok:true};      // gates passed; the bid itself is handled elsewhere
  const ask = negotiatedFee(p, kind);
  if(fee < ask * 0.82) return {ok:false, code:"OFR-06",
    reason:`${from.name} have rejected your bid. They value him nearer ${fmtMoney(ask)}.`};
  if(buyer.balance < fee) return {ok:false, code:"OFR-07", reason:"You cannot afford that fee."};
  if(interest < 0.18) return {ok:false, code:"OFR-08",
    reason:`${fullName(p)} has no interest in joining — ${interestLabel(interest).text.toLowerCase()}.`};
  if(interest < 0.4 && Math.random() > interest + 0.35) return {ok:false, code:"OFR-09",
    reason:`${fullName(p)} has turned down personal terms.`};
  // Rich clubs will sometimes simply refuse to sell their best.
  if(!p.listed && ratingOf(p) > clubPrestige(buyer) + 14 && Math.random() < 0.4)
    return {ok:false, code:"OFR-10", reason:`${from.name} have told you he is not for sale.`};

  const clauses = proposeClauses(p, fee);
  const agreedWage = wageDemand(p);
  const res = buyPlayer(p, fee);
  if(!res.ok) return {ok:false, code:"OFR-11", reason:res.reason};
  p.wage = agreedWage;

  p.clauses = (p.clauses||[]).concat(clauses.map(c=>Object.assign({}, c, {club: from.id})));
  if(kind === "loanToBuy") p.clauses.push({type:"optionBuy", club: from.id, fee: Math.round(fee*0.9)});
  if(clauses.length){
    pushNews("Deal includes clauses",
      `${fullName(p)} signs for ${fmtMoney(fee)}. ` + clauses.map(c=>
        c.type==="sellOn" ? `${from.name} keep a ${c.pct}% sell-on.`
                          : `${from.name} hold a buy-back at ${fmtMoney(c.fee)}.`).join(" "), "transfer");
  }
  return {ok:true, fee, clauses};
}

// Honour sell-on clauses when you later sell the player on.
function applySellOn(p, fee){
  let net = fee;
  (p.clauses||[]).forEach(c=>{
    if(c.type !== "sellOn") return;
    const cut = Math.round(fee * c.pct/100);
    net -= cut;
    const owed = clubById(c.club);
    if(owed) owed.balance += cut;
    pushNews("Sell-on clause paid",
      `${owed?owed.name:"A former club"} received ${fmtMoney(cut)} (${c.pct}%) from the sale of ${fullName(p)}.`, "transfer");
  });
  return Math.max(0, net);
}

/* =========================================================================
   PLAYERS AS PEOPLE — newgens live lives outside football.
   Generated players (never the real named ones) can marry and change name,
   have their career derailed, lose form to problems off the pitch, or simply
   walk away from the game. Each event is recorded on the player so his story
   is readable years later. Real footballers in the database are exempt from
   all of this — these things only ever happen to fictional players.
   ========================================================================= */
const LIFE_EVENTS = [
  { id:"marriage", weight:14, minAge:22,
    apply:(p)=>{
      if(p.marriedAt) return null;
      p.marriedAt = state.season;
      p.morale = clamp(p.morale + 3, 1, 20);
      // Some players take a partner's surname — a real, if uncommon, thing.
      if(Math.random() < 0.18 && p.last){
        const nm = nameForNationality(p.nat || "English");
        p.formerLast = p.last;
        p.last = p.last + "-" + nm.last;
        return `${p.first} ${p.formerLast} has married and now plays as ${fullName(p)}.`;
      }
      return `${fullName(p)} has married in the close season.`;
    }},
  { id:"newborn", weight:12, minAge:22,
    apply:(p)=>{ p.morale = clamp(p.morale + 2, 1, 20);
      return `${fullName(p)} has become a father.`; }},
  { id:"homesick", weight:8, minAge:18,
    apply:(p)=>{ p.morale = clamp(p.morale - 5, 1, 20); p.unsettled = true;
      return `${fullName(p)} has been struggling to settle and wants to be closer to home.`; }},
  { id:"offFieldTrouble", weight:6, minAge:19,
    apply:(p)=>{ p.morale = clamp(p.morale - 6, 1, 20); p.disciplinary = (p.disciplinary||0)+1;
      return `${fullName(p)} has been disciplined by his club over off-field conduct.`; }},
  { id:"personalIssues", weight:7, minAge:20,
    apply:(p)=>{
      // Deliberately non-specific: the effect is a form slump and time out of
      // the side, without inventing a diagnosis for a fictional person.
      p.morale = clamp(p.morale - 7, 1, 20);
      p.injuryWeeks = Math.max(p.injuryWeeks||0, rndInt(2,6));
      p.injuryName = "Personal leave";
      return `${fullName(p)} is taking a short leave of absence for personal reasons.`;
    }},
  { id:"newFocus", weight:10, minAge:19,
    apply:(p)=>{
      const k = pick(["pace","passing","shooting","defending","physical"]);
      p[k] = clamp(p[k]+1, 1, 20); recomputeOverall(p);
      p.morale = clamp(p.morale + 4, 1, 20);
      return `${fullName(p)} has knuckled down after a spell of hard work in pre-season.`;
    }},
  { id:"walkAway", weight:2, minAge:24,
    apply:(p)=>{
      // Rare: a player simply falls out of love with the game and quits early.
      p.quitting = true;
      return `${fullName(p)} has announced he is walking away from football at ${p.age}.`;
    }},
  { id:"earlyRetirement", weight:3, minAge:26,
    apply:(p)=>{
      if((p.injuryHistory||0) < 2 && (p.permanentDamage||0) < 2) return null;
      p.quitting = true;
      return `${fullName(p)} has retired at ${p.age}, unable to shake off a run of injuries.`;
    }},
];

function rollLifeEvent(p){
  const eligible = LIFE_EVENTS.filter(e=> p.age >= e.minAge);
  const total = eligible.reduce((s,e)=>s+e.weight,0);
  let r = Math.random()*total;
  for(const e of eligible){ r -= e.weight; if(r<=0) return e; }
  return null;
}

// Runs each close season. Only ever touches generated players.
function runLifeEvents(){
  const stories = [];
  const quitters = [];
  Object.keys(state.squads).forEach(clubId=>{
    const sq = state.squads[clubId];
    for(let i=sq.length-1; i>=0; i--){
      const p = sq[i];
      if(p.isReal) continue;                       // never a real footballer
      if(Math.random() > 0.07) continue;           // most players have an uneventful year
      const ev = rollLifeEvent(p);
      if(!ev) continue;
      const line = ev.apply(p);
      if(!line) continue;
      // Keep the readable story only for the player's own squad; everyone else
      // keeps a compact marker. Storing prose on 10,000 players pushed the save
      // past 10MB and broke saving entirely.
      if(clubId === state.clubId){
        if(!p.lifeEvents) p.lifeEvents = [];
        p.lifeEvents.push({id:ev.id, season:state.season, text:line});
        if(p.lifeEvents.length > 6) p.lifeEvents.shift();
      } else {
        p.evt = (p.evt || "") + ev.id.charAt(0);
        if(p.evt.length > 6) p.evt = p.evt.slice(-6);
      }
      if(clubId === state.clubId) stories.push(line);
      if(p.quitting){ sq.splice(i,1); quitters.push({p, clubId}); }
    }
  });
  quitters.forEach(q=>{
    if(q.clubId === state.clubId){
      pushNews("Player leaves the game",
        (q.p.lifeEvents[q.p.lifeEvents.length-1]||{}).text || `${fullName(q.p)} has quit football.`, "season");
    }
  });
  stories.slice(0,6).forEach(s=> pushNews("Away from the pitch", s, "info"));
  return {stories, quitters};
}


/* =========================================================================
   THE FOOTBALL WORLD — news, families, illness and mortality.
   Everything here applies ONLY to generated players, never to the real
   footballers in the database. The aim is a world that keeps producing
   stories you haven't seen before across a ten-season save.
   ========================================================================= */

/* ---- News wire ---- */
const NEWS_CATEGORIES = ["transfer","offfield","personal","milestone","health","tribute","rumour","club"];

function pushWire(headline, body, cat, clubId){
  if(!state.wire) state.wire = [];
  state.wire.unshift({headline, body, cat: cat||"club", clubId: clubId||null,
    season: state.season, week: state.week});
  if(state.wire.length > 220) state.wire.length = 200;
}

/* ---- Long-term illness ----
   Modelled on real cases where a player steps away for treatment and, in most
   cases, comes back — Sébastien Haller returned to play after treatment for a
   tumour; Stiliyan Petrov's leukaemia ended his career. Both outcomes exist
   here. Kept deliberately non-graphic: the game reports it the way football
   news does, focusing on the club's support and the player's return.        */
const ILLNESS_TYPES = [
  {name:"Illness (treatment)", weeksMin:26, weeksMax:80, recoverChance:0.72},
  {name:"Heart condition",     weeksMin:20, weeksMax:60, recoverChance:0.6},
];

function applyLongTermIllness(p){
  const t = pick(ILLNESS_TYPES);
  p.injuryWeeks = rndInt(t.weeksMin, t.weeksMax);
  p.injuryName = t.name;
  p.onLeave = true;
  p.illnessRecoverChance = t.recoverChance;
  p.morale = clamp(p.morale - 4, 1, 20);
  const club = clubById(p.clubId);
  pushWire(`${fullName(p)} steps away from football`,
    `${club?club.name:"His club"} have confirmed ${fullName(p)} will be absent while receiving treatment. The club say he has their full support and the football community has sent its best wishes.`,
    "health", p.clubId);
  return t;
}

// Resolved when the absence ends: most return, some are forced to retire.
function resolveIllness(p){
  p.onLeave = false;
  const club = clubById(p.clubId);
  if(Math.random() < (p.illnessRecoverChance||0.7)){
    p.morale = clamp(p.morale + 6, 1, 20);
    // Time out costs sharpness, but he's back.
    p.pace = clamp(p.pace-1, 1, 20); recomputeOverall(p);
    pushWire(`${fullName(p)} returns to training`,
      `${fullName(p)} has been given the all-clear and has rejoined ${club?club.name:"his club"} in training after a long absence.`,
      "health", p.clubId);
    return {retired:false};
  }
  pushWire(`${fullName(p)} retires on medical advice`,
    `${fullName(p)} has announced his retirement at ${p.age} on medical advice, ending a career of ${p.careerApps||0} appearances.`,
    "health", p.clubId);
  return {retired:true};
}

/* ---- Mortality ----
   Very rare, and only for generated players. Reported with the restraint real
   football reporting uses: the fact, the tribute, nothing more.             */
function recordPassing(p, clubId){
  const club = clubById(clubId);
  const cause = pick(["a short illness", "an illness", "a road accident"]);
  pushWire(`Football mourns ${fullName(p)}`,
    `${club?club.name:"His club"} have announced with great sadness that ${fullName(p)} has died at the age of ${p.age} after ${cause}. Tributes have been paid across the game, and a minute's silence will be held before this weekend's fixtures. He made ${p.careerApps||0} career appearances.`,
    "tribute", clubId);
  if(!state.memorials) state.memorials = [];
  state.memorials.push({name:fullName(p), age:p.age, season:state.season, club:club?club.name:""});
}

/* ---- Football families ----
   Sons of players who came through the game, plus twins and the occasional
   set of triplets in a youth intake. Surnames and nationality carry down, so
   a dynasty is visible in the squad list years later.                        */
function makeRelatedYouth(parent, club, academyBonus){
  const nat = parent.nat || rollNationality(club);
  const bank = NATIONALITIES[nat] || NATIONALITIES.English;
  // Don't hand the son his father's first name — "Sergio Garcia, son of Sergio
  // Garcia" reads like a bug even when it isn't.
  let first = pick(bank.first);
  for(let i=0; i<8 && first === parent.first; i++) first = pick(bank.first);
  if(first === parent.first) first = parent.first + " Jr";
  const baseline = (TIER_YOUTH_BASE[club.tier] || 7) + (club.facilities?club.facilities.youth:2);
  // Talent runs in families, so a good father's son starts with a better roll.
  const inherited = Math.round((parent.potential||parent.overall) * 0.35);
  const overall = clamp(baseline + rndInt(-3,3), 3, 18);
  const p = makePlayer(club.id, first, parent.last, rndInt(16,18),
    pick(["GK","DF","DF","MD","MD","FW"]), overall, false, nat, academyBonus + 0.8);
  p.potential = clamp(Math.max(p.potential, Math.round(inherited*0.5) + rndInt(8,14)), p.overall, 20);
  p.potF = clamp(p.potential - Math.random()*0.5, p.overall, 20);
  p.isYouth = true;
  p.fatherId = parent.id;
  p.fatherName = fullName(parent);
  return p;
}

function makeSiblings(club, count, academyBonus){
  const nat = rollNationality(club);
  const bank = NATIONALITIES[nat] || NATIONALITIES.English;
  const surname = pick(bank.last);
  const age = rndInt(16,18);
  const baseline = (TIER_YOUTH_BASE[club.tier] || 7) + (club.facilities?club.facilities.youth:2);
  const sibGroup = "sib" + Math.random().toString(36).slice(2,8);
  const out = [];
  for(let i=0;i<count;i++){
    const overall = clamp(baseline + rndInt(-3,3), 3, 18);
    const p = makePlayer(club.id, pick(bank.first), surname, age,
      pick(["GK","DF","DF","MD","MD","FW"]), overall, false, nat, academyBonus);
    p.isYouth = true;
    p.siblingGroup = sibGroup;
    p.siblingType = count === 3 ? "triplet" : "twin";
    out.push(p);
  }
  return out;
}

/* ---- Off-field stories that make the news ---- */
const WIRE_STORIES = [
  {w:14, cat:"offfield", make:p=>({h:`${fullName(p)} charged with speeding offence`,
    b:`${fullName(p)} has been handed a driving ban after admitting a speeding charge. His club say the matter is being handled internally.`})},
  {w:10, cat:"offfield", make:p=>({h:`${fullName(p)} fined for social media post`,
    b:`${fullName(p)} has been fined two weeks' wages over a post his club described as "ill-judged".`})},
  {w:12, cat:"personal", make:p=>({h:`${fullName(p)} on life in the spotlight`,
    b:`${fullName(p)} has spoken about the pressure of constant attention, saying photographers outside his home have made normal life difficult for his family.`})},
  {w:9,  cat:"personal", make:p=>({h:`${fullName(p)} opens up on his season`,
    b:`In a wide-ranging interview, ${fullName(p)} admitted the last few months have been the hardest of his career.`})},
  {w:11, cat:"offfield", make:p=>({h:`${fullName(p)} launches foundation`,
    b:`${fullName(p)} has set up a foundation in his home town, funding pitches and coaching for children who cannot afford to play.`})},
  {w:8,  cat:"offfield", make:p=>({h:`${fullName(p)} in training-ground bust-up`,
    b:`Reports suggest ${fullName(p)} was involved in a heated exchange with a team-mate in training. The club have played the incident down.`})},
  {w:7,  cat:"personal", make:p=>({h:`${fullName(p)} to miss games for family reasons`,
    b:`${fullName(p)} has been excused from the squad to deal with a family matter. His manager asked for privacy on his behalf.`})},
  {w:10, cat:"milestone", make:p=>({h:`${fullName(p)} reaches career milestone`,
    b:`${fullName(p)} made his ${p.careerApps||100}th career appearance at the weekend.`})},
  {w:9,  cat:"offfield", make:p=>({h:`${fullName(p)} takes up a coaching badge`,
    b:`${fullName(p)} has begun his coaching qualifications, saying he wants to stay in the game when he stops playing.`})},
  {w:6,  cat:"offfield", make:p=>({h:`${fullName(p)} questioned over gambling advert`,
    b:`${fullName(p)} has been criticised for appearing in a betting campaign, with campaigners calling on the game to tighten its rules.`})},
];

function rollWireStory(){
  const total = WIRE_STORIES.reduce((s,x)=>s+x.w,0);
  let r = Math.random()*total;
  for(const s of WIRE_STORIES){ r -= s.w; if(r<=0) return s; }
  return WIRE_STORIES[0];
}

// A few stories a week, drawn from anywhere in the world.
function generateWeeklyWire(){
  const clubIds = Object.keys(state.squads);
  const count = rndInt(1,4);
  for(let i=0;i<count;i++){
    const cid = pick(clubIds);
    const sq = state.squads[cid];
    if(!sq || sq.length===0) continue;
    const p = pick(sq);
    if(!p || p.isReal) continue;                 // stories are about generated players only
    const s = rollWireStory();
    const {h, b} = s.make(p);
    pushWire(h, b, s.cat, cid);
  }
  // Transfer rumours involving anyone, real or not — rumours aren't claims.
  if(Math.random() < 0.6){
    const cid = pick(clubIds), sq = state.squads[cid];
    if(sq && sq.length){
      const p = pick(sq);
      const suitors = Object.values(CLUB_META).filter(c=>!c.hidden && c.id!==cid);
      const to = pick(suitors);
      if(p && to) pushWire(`${to.name} linked with ${fullName(p)}`,
        `Reports suggest ${to.name} are monitoring ${fullName(p)}, though no formal approach has been made.`,
        "rumour", cid);
    }
  }
}

/* =========================================================================
   INCOMING OFFERS & LOANING PLAYERS OUT
   Clubs now come after your players rather than the market being one-way.
   Bids arrive weekly, weighted toward anyone you've transfer-listed, and sit
   in an Offers tab until you accept or reject. You can also list players for
   loan, which sends youngsters out for regular football.
   ========================================================================= */

function generateIncomingOffers(){
  if(!state.offers) state.offers = [];
  if(state.offers.length >= 6) return [];          // don't flood the inbox
  const mySquad = state.squads[state.clubId] || [];
  if(mySquad.length <= 17) return [];              // nobody raids a threadbare squad
  const myClub = clubById(state.clubId);
  const made = [];

  mySquad.forEach(p=>{
    if(p.loanedFrom) return;                        // not yours to sell
    if(state.offers.some(o=>o.playerId===p.id)) return;
    // Listed players attract far more interest, which is the point of listing.
    const baseChance = p.listed ? 0.22 : 0.012;
    const quality = clamp((p.overall - 8) / 12, 0, 1);
    if(Math.random() > baseChance * (0.5 + quality)) return;

    // Find a plausible suitor: a club that can afford him and would want him.
    const candidates = Object.values(CLUB_META).filter(c=>
      c.id!==state.clubId && !c.hidden && c.balance > playerAskingPrice(p, myClub.tier)*1.1);
    if(candidates.length===0) return;
    const buyer = pick(candidates);

    const market = playerAskingPrice(p, myClub.tier);
    // Bids vary: some lowball, some over the odds if they're desperate.
    const fee = Math.round(market * rnd(p.listed ? 0.72 : 0.95, p.listed ? 1.05 : 1.35));
    if(buyer.balance < fee) return;

    state.offers.push({playerId:p.id, clubId:buyer.id, fee, week:state.week, season:state.season});
    made.push({p, buyer, fee});
  });

  made.forEach(o=> pushNews("Transfer offer received",
    `${o.buyer.name} have bid ${fmtMoney(o.fee)} for ${fullName(o.p)}.`, "transfer"));
  return made;
}

function acceptOffer(offer){
  const p = (state.squads[state.clubId]||[]).find(x=>x.id===offer.playerId);
  const buyer = clubById(offer.clubId);
  if(!p || !buyer) return {ok:false, reason:"That offer has expired."};
  const myClub = clubById(state.clubId);
  myClub.balance += offer.fee;
  buyer.balance -= offer.fee;
  state.squads[state.clubId] = state.squads[state.clubId].filter(x=>x.id!==p.id);
  p.clubId = buyer.id; p.listed = false; p.loanListed = false;
  state.squads[buyer.id].push(p);
  state.offers = state.offers.filter(o=>o.playerId!==offer.playerId);
  pushNews("Player sold", `${fullName(p)} joins ${buyer.name} for ${fmtMoney(offer.fee)}.`, "transfer");
  checkAchievements({soldPlayer:true, soldFee:offer.fee});
  saveState(true);
  return {ok:true};
}

function rejectOffer(offer){
  state.offers = (state.offers||[]).filter(o=>o.playerId!==offer.playerId);
  saveState();
}

// Offers go stale so the list doesn't accumulate forever.
function expireOffers(){
  if(!state.offers) return;
  state.offers = state.offers.filter(o=> (state.week - o.week) < 4 && o.season === state.season);
}

/* ---- Loaning your own players out ---- */
function toggleLoanListed(player){
  player.loanListed = !player.loanListed;
  saveState();
  return player.loanListed;
}

// At rollover, clubs take your loan-listed youngsters. They come back a season
// later having played games, which is the whole point of sending them out.
function processOutgoingLoans(){
  const sent = [];
  const mySquad = state.squads[state.clubId] || [];
  mySquad.slice().forEach(p=>{
    if(!p.loanListed || p.loanedFrom || p.loanedOutTo) return;
    if(mySquad.length <= 14) return;   // don't strip your own squad bare
    // Clubs a level or two below will take a player who'd get games there.
    const takers = Object.values(CLUB_META).filter(c=>{
      if(c.id===state.clubId || c.hidden) return false;
      const st = c.stature || 9;
      return st < p.overall + 3 && st > p.overall - 7;
    });
    if(takers.length===0) return;
    const dest = pick(takers);
    p.loanedOutTo = dest.id;
    p.loanListed = false;
    sent.push({p, dest});
  });
  return sent;
}

// Runs weekly so a loan listing is acted on within a week or two, rather than
// the player waiting the whole season wondering why nothing happened.
function tickOutgoingLoans(){
  const mySquad = state.squads[state.clubId] || [];
  if(!mySquad.some(p=>p.loanListed)) return [];
  if(Math.random() > 0.45) return [];
  const sent = processOutgoingLoans();
  sent.forEach(s=> pushNews("Loan agreed",
    `${fullName(s.p)} joins ${s.dest.name} on loan for the rest of the season.`, "transfer"));
  if(sent.length) toast(`${sent.length} player${sent.length>1?"s":""} out on loan`);
  return sent;
}

// Loaned-out players spend a season away: they gain development and games, then
// return. Modelled as a development bonus rather than moving them off the squad,
// so you never lose track of your own prospects.
function resolveOutgoingLoans(){
  const back = [];
  (state.squads[state.clubId]||[]).forEach(p=>{
    if(!p.loanedOutTo) return;
    const dest = clubById(p.loanedOutTo);
    p.loanedOutTo = null;
    // Regular football accelerates a young player's growth.
    if(p.age <= 23 && (p.potential||p.overall) > p.overall){
      const k = pick(["pace","passing","shooting","defending","physical"]);
      p[k] = clamp(p[k]+1, 1, 20);
      recomputeOverall(p);
      if(p.overall > (p.potential||20)) p.potential = p.overall;
    }
    p.morale = clamp(p.morale+2, 1, 20);
    back.push({p, dest});
  });
  return back;
}


/* =========================================================================
   FINANCES, WAGES AND SQUAD RULES — the systems that make FM hard.
   Previously nothing stopped a newly promoted club loaning a world-class
   player, because wages didn't exist as a constraint. FM's realism rests on
   four things this now implements:
     1. A board-set WAGE BUDGET separate from the transfer budget, with a
        Maximum Wage the board will sanction for any single player.
     2. WAGE DEMANDS that scale steeply with a player's level, so an elite
        player simply cannot be afforded by a smaller club — the real reason
        Cardiff can't sign Haaland, fee or no fee.
     3. LOAN LIMITS (five in at a time, no more than two from one club).
     4. FFP: sustained overspending locks your budget and brings sanctions.
   ========================================================================= */

// Weekly wage a player will demand, driven by his level and age. The curve is
// deliberately steep at the top: the gap between a 78 and a 92 is enormous in
// real wages, and that gap is what keeps elite players at elite clubs.
function wageDemand(p){
  const r = ratingOf(p);
  const base = 260 * Math.pow(1.115, Math.max(0, r - 40));
  const ageMult = p.age <= 20 ? 0.55 : p.age <= 23 ? 0.78 : p.age <= 30 ? 1 : 0.82;
  const potMult = 1 + Math.max(0, potentialOf(p) - r) * 0.006;   // prospects cost more too
  return Math.max(180, Math.round(base * ageMult * potMult));
}

// Total weekly wage bill for a club.
function wageBill(clubId){
  const sq = state.squads[clubId] || [];
  return sq.reduce((s,p)=> s + (p.wage || wageDemand(p)), 0);
}

// The board's weekly wage allowance, from income rather than the bank balance.
function wageBudgetFor(club){
  // Anchor to what the club already pays, so nobody begins the save in breach.
  const existing = (state && state.squads && state.squads[club.id])
    ? state.squads[club.id].reduce((s,p)=> s + (p.wage || wageDemand(p)), 0) : 0;
  if(existing > 0) return Math.round(existing * 1.18);
  const tier = club.tier;
  const income = (TIER_TV_BASE[tier]||1000) + (TIER_SPONSOR[tier]||500) +
                 (TIER_ADVERT[tier]||200) + (TIER_INCOME_BASE[tier]||500)*2;
  // Clubs run at roughly 55-70% of income on wages; stature nudges it.
  const statureMult = 0.85 + clamp(((club.stature||9) - 9) / 12, -0.25, 0.5);
  return Math.round(income * 0.62 * statureMult);
}

// The most the board will sanction for a single player — typically 12-18% of
// the wage bill. This is the hard ceiling that stops a smaller club buying a star.
function maxWageFor(club){
  const budget = club.wageBudget || wageBudgetFor(club);
  const share = club.tier === "premierleague" ? 0.16
              : isTopDivision(club.tier) ? 0.17 : 0.20;
  return Math.round(budget * share);
}

function wageHeadroom(clubId){
  const club = clubById(clubId);
  const budget = club.wageBudget || wageBudgetFor(club);
  return budget - wageBill(clubId);
}

// Can this club actually pay him? Returns a reason if not.
function canAffordWages(club, p, share){
  share = share === undefined ? 1 : share;      // loans may be part-funded
  const demand = Math.round(wageDemand(p) * share);
  const maxW = maxWageFor(club);
  if(demand > maxW){
    return {ok:false, code:"WAG-01",
      reason:`${fullName(p)} wants ${fmtMoney(demand)}/week. Your board will not sanction more than ${fmtMoney(maxW)} for one player.`};
  }
  const room = wageHeadroom(club.id);
  if(demand > room){
    return {ok:false, code:"WAG-02",
      reason:`${fullName(p)} wants ${fmtMoney(demand)}/week and you only have ${fmtMoney(Math.max(0,room))} of wage budget left.`};
  }
  return {ok:true, demand};
}

/* ---- Loan rules ---- */
const MAX_LOANS_IN = 5, MAX_LOANS_FROM_ONE_CLUB = 2;

function loansInCount(clubId){
  return (state.squads[clubId]||[]).filter(p=>p.loanedFrom).length;
}
function loansFromClub(clubId, parentId){
  return (state.squads[clubId]||[]).filter(p=>p.loanedFrom === parentId).length;
}
function checkLoanRules(club, p){
  if(loansInCount(club.id) >= MAX_LOANS_IN)
    return {ok:false, code:"LON-01", reason:`You already have ${MAX_LOANS_IN} players on loan. League rules allow no more.`};
  if(loansFromClub(club.id, p.clubId) >= MAX_LOANS_FROM_ONE_CLUB)
    return {ok:false, code:"LON-02", reason:`You cannot take more than ${MAX_LOANS_FROM_ONE_CLUB} players on loan from the same club.`};
  return {ok:true};
}

/* ---- Financial Fair Play ---- */
function ffpStatus(club){
  const budget = club.wageBudget || wageBudgetFor(club);
  const bill = wageBill(club.id);
  const ratio = budget > 0 ? bill/budget : 0;
  if(club.transferEmbargo) return {level:"embargo", ratio};
  if(ratio > 1.15) return {level:"breach", ratio};
  if(ratio > 1.0)  return {level:"warning", ratio};
  return {level:"ok", ratio};
}

// Weekly: pay wages, and enforce the rules if the club is living beyond its means.
function enforceFinancialRules(){
  const club = clubById(state.clubId);
  if(!club) return null;
  if(club.wageBudget === undefined) club.wageBudget = wageBudgetFor(club);
  const st = ffpStatus(club);
  state.ffpWeeks = state.ffpWeeks || 0;

  if(st.level === "breach"){
    state.ffpWeeks++;
    if(state.ffpWeeks === 4){
      pushNews("Wage bill under review",
        `Your wage bill is ${Math.round(st.ratio*100)}% of the budget the board set. Continue and they will impose a transfer embargo.`, "board");
    }
    if(state.ffpWeeks >= 10 && !club.transferEmbargo){
      club.transferEmbargo = true;
      pushNews("Transfer embargo",
        "The board have placed the club under a transfer embargo until the wage bill is brought back within budget.", "board");
    }
  } else if(st.level === "ok"){
    state.ffpWeeks = 0;
    if(club.transferEmbargo){
      club.transferEmbargo = false;
      pushNews("Embargo lifted", "The wage bill is back within budget and the transfer embargo has been lifted.", "board");
    }
  }
  return st;
}

// Budgets are reset by the board each summer, based on the division you're in.
function setSeasonBudgets(){
  Object.values(CLUB_META).forEach(club=>{
    club.wageBudget = wageBudgetFor(club);
  });
  const club = clubById(state.clubId);
  if(club){
    pushNews("Budgets set for the new season",
      `The board have set a weekly wage budget of ${fmtMoney(club.wageBudget)}, with a maximum of ${fmtMoney(maxWageFor(club))} for any single player.`, "board");
  }
}

// Every player carries a wage once the season starts.
function assignWages(){
  Object.keys(state.squads).forEach(cid=>{
    state.squads[cid].forEach(p=>{ if(p.wage === undefined) p.wage = wageDemand(p); });
  });
}

/* =========================================================================
   THE FULL TRANSFER MARKET — permanent deals, transfer-listed bargains,
   season-long loans, and a live free-agent pool. Modelled on how the FM
   series actually structures recruitment: listed players go cheap because
   the selling club wants them gone, loans cost nothing up front but the
   player goes home in the summer, and free agents cost only wages.
   ========================================================================= */

// Fee discount when a club has actively listed a player — they want him off the books.
const LISTED_DISCOUNT = 0.68;

function isFreeAgent(p){ return p.clubId === "__free__"; }

function effectivePrice(p){
  const club = clubById(p.clubId);
  if(isFreeAgent(p)) return 0;                       // free agents cost nothing but wages
  const tier = club ? club.tier : "leagueone";
  const base = playerAskingPrice(p, tier);
  return p.listed ? Math.round(base * LISTED_DISCOUNT) : base;
}

// Loan fee is a token amount; the real cost is that you don't own him.
function loanFee(p){
  const club = clubById(p.clubId);
  return Math.max(500, Math.round(playerAskingPrice(p, club ? club.tier : "leagueone") * 0.035));
}

/* =========================================================================
   REALISM LAYER — the things real football has that this game didn't.
   Auditing the whole thing turned up several gaps that matter more than any
   number tweak:

     1. TRANSFER WINDOWS. You could sign a striker in March. Football cannot.
     2. CONTRACTS. Nobody's deal ever expired, so no Bosman frees, no pressure
        to renew, and no reason a club would ever sell rather than lose a player.
     3. DISCIPLINE. No bookings, so no suspensions and no reason to rotate.
     4. FATIGUE. Players played 60 games a season at full sharpness.
     5. PRIZE MONEY. Finishing 4th paid the same as finishing 20th.
   ========================================================================= */

/* ---- 1. Transfer windows ---- */
// Summer runs to the start of the season, January reopens mid-campaign.
// The summer window runs through pre-season and the opening weeks of the
// campaign; January reopens mid-season. Both sit on the real calendar now.
const WINDOW_SUMMER = {from:1,  to:11, name:"Summer window"};
const WINDOW_WINTER = {from:26, to:30, name:"January window"};

function transferWindowOpen(){
  const w = state.week;
  if(w >= WINDOW_SUMMER.from && w <= WINDOW_SUMMER.to) return WINDOW_SUMMER;
  if(w >= WINDOW_WINTER.from && w <= WINDOW_WINTER.to) return WINDOW_WINTER;
  return null;
}
function weeksUntilWindow(){
  const w = state.week;
  if(w < WINDOW_SUMMER.from) return WINDOW_SUMMER.from - w;
  if(w > WINDOW_SUMMER.to && w < WINDOW_WINTER.from) return WINDOW_WINTER.from - w;
  if(w > WINDOW_WINTER.to) return (CALENDAR_WEEKS - w) + WINDOW_SUMMER.from;
  return 0;
}

/* ---- 2. Contracts ---- */
function defaultContractYears(p){
  if(p.age <= 21) return rndInt(3,6);
  if(p.age <= 27) return rndInt(2,5);
  if(p.age <= 31) return rndInt(1,4);
  return rndInt(1,3);
}
function assignContracts(){
  Object.keys(state.squads).forEach(cid=>{
    state.squads[cid].forEach(p=>{
      if(p.contractYears === undefined) p.contractYears = defaultContractYears(p);
    });
  });
}

// Runs at season end: contracts tick down, expiring players leave on frees.
function processContracts(){
  const expiring = [], leaving = [];
  Object.keys(state.squads).forEach(cid=>{
    const sq = state.squads[cid];
    for(let i=sq.length-1;i>=0;i--){
      const p = sq[i];
      p.contractYears = (p.contractYears === undefined ? defaultContractYears(p) : p.contractYears) - 1;
      if(p.contractYears > 0) continue;

      const club = clubById(cid);
      if(cid === state.clubId){
        // Yours: you get told, and he walks unless you renewed him.
        expiring.push(p);
        sq.splice(i,1);
        releaseToFreeAgents(p);
        continue;
      }
      // AI clubs renew the players they rate and let the rest go.
      const worthKeeping = isKeyPlayer(p) || (p.age <= 24 && potentialOf(p) > ratingOf(p) + 4);
      const canPay = wageDemand(p) <= maxWageFor(club);
      if(worthKeeping && canPay){
        p.contractYears = defaultContractYears(p);
      } else {
        sq.splice(i,1);
        releaseToFreeAgents(p);
        leaving.push(p);
      }
    }
  });
  const mySquad = state.squads[state.clubId] || [];
  if(mySquad.length < 16){
    pushNews("Squad dangerously thin",
      `You have only ${mySquad.length} players registered. Sign free agents or promote from the academy before the window shuts.`, "board");
  }
  if(expiring.length){
    pushNews("Contracts expired",
      expiring.map(p=>fullName(p)).join(", ") + " left the club on free transfers. Renew deals before they run down.",
      "transfer");
  }
  return {expiring, leaving};
}

// Offer a new deal to one of your own.
function renewContract(p, years){
  const club = clubById(state.clubId);
  const demand = wageDemand(p);
  if(demand > maxWageFor(club))
    return {ok:false, code:"CON-01",
      reason:`${fullName(p)} wants ${fmtMoney(demand)}/week to re-sign. Your board sanctions ${fmtMoney(maxWageFor(club))}.`};
  const room = wageHeadroom(club.id) + (p.wage||0);
  if(demand > room)
    return {ok:false, code:"CON-02",
      reason:`Renewing at ${fmtMoney(demand)}/week would take you past your wage budget.`};
  p.wage = demand;
  p.contractYears = years || defaultContractYears(p);
  p.morale = clamp(p.morale + 3, 1, 20);
  return {ok:true, wage:demand, years:p.contractYears};
}

/* ---- 3. Discipline: bookings and suspensions ---- */
// Yellows accumulate across a season; five means a ban, a red is immediate.
const YELLOW_BAN_THRESHOLD = 5;

function applyMatchDiscipline(clubId, isUserClub){
  const sq = state.squads[clubId];
  if(!sq) return [];
  const xi = selectStartingXI(sq);
  const out = [];
  xi.forEach(p=>{
    // Defenders and holding midfielders pick up more cards, as in life.
    const base = p.pos === "DF" ? 0.13 : p.pos === "MD" ? 0.11 : p.pos === "GK" ? 0.02 : 0.07;
    if(Math.random() < base){
      p.yellows = (p.yellows || 0) + 1;
      if(p.yellows >= YELLOW_BAN_THRESHOLD){
        p.yellows = 0;
        p.suspensionWeeks = 1;
        out.push({p, kind:"yellows"});
      }
    }
    if(Math.random() < 0.011){
      p.reds = (p.reds || 0) + 1;
      p.suspensionWeeks = Math.max(p.suspensionWeeks || 0, rndInt(1,4));
      p.morale = clamp(p.morale - 3, 1, 20);
      out.push({p, kind:"red"});
    }
  });
  return out;
}

/* ---- 4. Fatigue ---- */
// Playing week after week drains sharpness; resting restores it. Below 60 a
// player is visibly leggy, which is what forces genuine rotation.
function applyFatigue(clubId){
  const sq = state.squads[clubId];
  if(!sq) return;
  const xi = selectStartingXI(sq);
  const played = new Set(xi.map(p=>p.id));
  sq.forEach(p=>{
    if(p.condition === undefined) p.condition = 100;
    if(played.has(p.id)){
      const drain = p.age >= 32 ? rndInt(14,24) : p.age <= 21 ? rndInt(9,17) : rndInt(11,20);
      p.condition = clamp(p.condition - drain, 20, 100);
    } else {
      p.condition = clamp(p.condition + rndInt(16,28), 20, 100);
    }
  });
}

// A tired XI genuinely underperforms.
function fatigueMultiplier(clubId){
  const sq = state.squads[clubId];
  if(!sq || !sq.length) return 1;
  // Average across the squad rather than picking an XI: selecting one means a
  // sort, and this runs for both sides of every fixture in the world each week.
  let sum = 0, n = 0;
  for(let i=0;i<sq.length;i++){
    if(!isAvailable(sq[i])) continue;
    sum += (sq[i].condition === undefined ? 100 : sq[i].condition); n++;
  }
  if(!n) return 1;
  return clamp(0.86 + (sum/n/100) * 0.16, 0.86, 1.02);
}

/* ---- 5. Prize money ---- */
// Finishing position pays, and it pays very differently by division.
function payLeaguePrizeMoney(){
  const tier = getUserTier();
  const table = computeTable(tier);
  const pos = table.findIndex(r=>r.id===state.clubId) + 1;
  if(pos === 0) return null;
  const size = table.length;
  const perPlace = {premierleague:2.8e6, laliga:2.2e6, seriea:1.9e6, bundesliga:2.0e6, ligue1:1.4e6,
    championship:180000, leagueone:60000, leaguetwo:28000,
    nationalleague:12000, nlnorth:5000, nlsouth:5000}[tier] || 90000;
  const merit = Math.round(perPlace * (size - pos + 1));
  const club = clubById(state.clubId);
  club.balance += merit;
  pushNews("Prize money",
    `Finishing ${ordinal(pos)} in ${leagueDisplayName(tier)} earns ${fmtMoney(merit)} in merit payments.`, "board");
  return {pos, merit};
}

function isDerby(a,b){ return !!(RIVAL_MAP[a] && RIVAL_MAP[a].indexOf(b) !== -1); }

/* ---- Weather ----
   Conditions shift by matchweek, so a January night in the National League is
   a different game to an August afternoon. Heavy weather flattens quality and
   pushes results toward the scrappy.                                          */
const WEATHER_TYPES = [
  {id:"clear",   label:"Clear",          icon:"☀️", chaos:0.00, goals:1.00},
  {id:"overcast",label:"Overcast",       icon:"☁️", chaos:0.02, goals:1.00},
  {id:"rain",    label:"Rain",           icon:"🌧️", chaos:0.08, goals:0.96},
  {id:"heavy",   label:"Heavy rain",     icon:"⛈️", chaos:0.16, goals:0.90},
  {id:"wind",    label:"Strong wind",    icon:"💨", chaos:0.14, goals:0.93},
  {id:"snow",    label:"Snow",           icon:"❄️", chaos:0.22, goals:0.85},
  {id:"frost",   label:"Frozen pitch",   icon:"🥶", chaos:0.18, goals:0.88},
  {id:"hot",     label:"Blazing heat",   icon:"🔥", chaos:0.06, goals:0.95},
];
function weatherForWeek(week, clubId){
  // Deterministic per fixture so the same match always has the same weather.
  const seed = hashStr((clubId||"x") + "_" + week + "_" + (state.season||1));
  const mid = week >= 14 && week <= 30;          // deep winter
  const early = week <= 6 || week >= 42;         // late summer
  let pool;
  if(mid) pool = ["overcast","rain","heavy","wind","snow","frost","rain","overcast"];
  else if(early) pool = ["clear","clear","hot","overcast","rain","wind"];
  else pool = ["overcast","rain","clear","wind","rain","overcast"];
  const pick_ = pool[seed % pool.length];
  return WEATHER_TYPES.find(w=>w.id===pick_) || WEATHER_TYPES[0];
}

/* ---- Title race and relegation tension ----
   Late in a season, games between clubs with something on the line are tighter
   and more nervous. This is what makes April feel different to September.     */
let _tableCache = {}, _tableCacheKey = "";
// One table per league per week, reused by every fixture in it.
function cachedTable(leagueId){
  const key = state.season + ":" + state.week;
  if(_tableCacheKey !== key){ _tableCache = {}; _tableCacheKey = key; }
  if(!_tableCache[leagueId]) _tableCache[leagueId] = computeTable(leagueId);
  return _tableCache[leagueId];
}

function matchStakes(homeId, awayId, leagueId){
  if(!leagueId || !state.tiers[leagueId]) return null;
  const table = cachedTable(leagueId);
  const size = table.length;
  const played = table[0] ? table[0].played : 0;
  const seasonPct = size > 1 ? played / ((size-1)*2) : 0;
  if(seasonPct < 0.55) return null;               // stakes only build later on

  const rules = TIER_RULES[leagueId] || {auto:0, playoff:0, releg:(FOREIGN_LEAGUES[leagueId]||{}).releg||0};
  const posOf = id => table.findIndex(r=>r.id===id) + 1;
  const hp = posOf(homeId), ap = posOf(awayId);
  if(!hp || !ap) return null;

  const titleZone = Math.max(1, rules.auto || 1);
  const relZone = size - (rules.releg||0) + 1;
  const bothTitle = hp <= titleZone + 1 && ap <= titleZone + 1;
  const bothRel = rules.releg > 0 && hp >= relZone - 2 && ap >= relZone - 2;
  const leaders = table[0];
  const gap = leaders ? Math.abs((table[hp-1]||{}).pts - leaders.pts) : 99;

  if(bothTitle) return {kind:"title", label:"Title six-pointer", tension:0.9};
  if(bothRel)   return {kind:"relegation", label:"Relegation six-pointer", tension:0.85};
  if(hp <= titleZone && gap <= 6) return {kind:"title", label:"Top of the table", tension:0.6};
  if(rules.releg > 0 && (hp >= relZone || ap >= relZone)) return {kind:"relegation", label:"Relegation scrap", tension:0.55};
  return null;
}

/* ---- Match context: everything that makes this fixture specific ---- */
function buildMatchContext(homeId, awayId, leagueId, competition){
  const derby = isDerby(homeId, awayId);
  const weather = weatherForWeek(state.week, homeId);
  const stakes = competition === "league" ? matchStakes(homeId, awayId, leagueId) : null;
  // Chaos flattens the favourite's edge; a derby, bad weather or a nervy
  // occasion all pull a result toward the unexpected.
  let chaos = weather.chaos;
  if(derby) chaos += 0.18;
  if(stakes) chaos += stakes.tension * 0.12;
  if(competition && competition !== "league") chaos += 0.06;   // cup football
  return {derby, weather, stakes, chaos: clamp(chaos, 0, 0.45), goalMod: weather.goals};
}

// Applied inside the scoreline model: pulls both sides toward the middle by the
// chaos factor, so an upset is genuinely possible on a wet night in a derby.
function applyMatchContext(h, a, ctx){
  if(!ctx) return;
  const mid = (h.attack + a.attack) / 2;
  const midD = (h.defense + a.defense) / 2;
  h.attack = h.attack*(1-ctx.chaos) + mid*ctx.chaos;
  a.attack = a.attack*(1-ctx.chaos) + mid*ctx.chaos;
  h.defense = h.defense*(1-ctx.chaos) + midD*ctx.chaos;
  a.defense = a.defense*(1-ctx.chaos) + midD*ctx.chaos;
  h.attack *= ctx.goalMod; a.attack *= ctx.goalMod;
}

/* ---- Live feed events ----
   The feed now reports bookings, saves, woodwork, misses and substitutions
   alongside goals, so a 0-0 still has something to watch.                     */
function buildFeedEvents(fixture, detail, homeClub, awayClub, ctx){
  const events = [];
  const hs = (detail && detail.homeScorers) || [];
  const as = (detail && detail.awayScorers) || [];
  const pickFrom = side => {
    const sq = state.squads[side === "home" ? fixture.home : fixture.away] || [];
    const xi = selectStartingXI(sq);
    return xi.length ? xi[rndInt(0, xi.length)] : null;
  };

  for(let i=0;i<fixture.hg;i++) events.push({minute:rndInt(1,91), side:"home", type:"goal", player:hs[i]||null});
  for(let i=0;i<fixture.ag;i++) events.push({minute:rndInt(1,91), side:"away", type:"goal", player:as[i]||null});

  // Bookings — more in a derby, more in bad weather.
  const cardCount = rndInt(1,5) + (ctx && ctx.derby ? rndInt(1,4) : 0);
  for(let i=0;i<cardCount;i++){
    const side = Math.random()<0.5 ? "home" : "away";
    events.push({minute:rndInt(1,91), side, type: Math.random()<0.055 ? "red" : "yellow", player:pickFrom(side)});
  }
  // Chances, saves and woodwork give a goalless game some shape.
  for(let i=0;i<rndInt(3,7);i++){
    const side = Math.random()<0.5 ? "home" : "away";
    const roll = Math.random();
    const type = roll < 0.45 ? "save" : roll < 0.72 ? "chance" : roll < 0.88 ? "woodwork" : "offside";
    events.push({minute:rndInt(1,91), side, type, player:pickFrom(side)});
  }
  // Substitutions in the second half.
  for(let i=0;i<rndInt(1,4);i++){
    const side = Math.random()<0.5 ? "home" : "away";
    events.push({minute:rndInt(58,89), side, type:"sub", player:pickFrom(side)});
  }
  events.sort((a,b)=>a.minute-b.minute);
  return events;
}

function feedLineFor(ev, homeClub, awayClub){
  const club = ev.side === "home" ? homeClub : awayClub;
  const who = ev.player ? fullName(ev.player) : club.name;
  switch(ev.type){
    case "yellow":   return {icon:"🟨", text:`${who} is booked`};
    case "red":      return {icon:"🟥", text:`<b>RED CARD</b> — ${who} is sent off`};
    case "save":     return {icon:"🧤", text:`Fine save to deny ${who}`};
    case "woodwork": return {icon:"🪵", text:`${who} strikes the woodwork!`};
    case "offside":  return {icon:"🚩", text:`${who} is flagged offside`};
    case "chance":   return {icon:"⚽", text:`${who} goes close for ${club.name}`};
    case "sub":      return {icon:"🔁", text:`${club.name} make a change — ${who} comes off`};
    default:         return {icon:"", text:""};
  }
}


/* =========================================================================
   PLAYER CONVERSATIONS, DISCIPLINE AND THE ARMBAND
   Players now come to you with things — some serious, some trivial. How you
   answer moves their morale and, over time, the dressing room. Requests are
   modelled on the sort of thing managers actually field: game time, a new
   deal, a day off for a family occasion, a grievance about a team-mate.
   ========================================================================= */

const CONVERSATION_TYPES = [
  { id:"gametime", weight:22, title:"Wants more game time",
    ask:p=>`${fullName(p)} has asked why he isn't playing. He wants assurances about his role.`,
    options:[
      {label:"Promise him a starting place", morale:+6, promise:"starting", risk:"He'll be furious if you don't follow through."},
      {label:"Tell him to earn it in training", morale:-1, note:"Honest, if unwelcome."},
      {label:"Tell him he can leave", morale:-6, listed:true},
    ]},
  { id:"newdeal", weight:16, title:"Wants a new contract",
    ask:p=>`${fullName(p)} feels his form deserves improved terms. His deal has ${p.contractYears||1} year(s) left.`,
    options:[
      {label:"Open talks", renew:true, morale:+5},
      {label:"Ask him to wait until the summer", morale:-2},
      {label:"Refuse", morale:-7},
    ]},
  { id:"dayoff", weight:14, title:"Asking for time off",
    ask:p=>{
      const reason = pick(["his brother's wedding","the birth of his child","his mother's birthday",
        "a family funeral back home","his own wedding","his daughter's first birthday"]);
      return `${fullName(p)} has asked for a few days off for ${reason}.`;
    },
    options:[
      {label:"Of course — go", morale:+5, note:"He'll miss a session or two."},
      {label:"After the weekend's game", morale:+1},
      {label:"Refuse — we need you", morale:-6},
    ]},
  { id:"teammate", weight:10, title:"Unhappy with a team-mate",
    ask:p=>`${fullName(p)} has come to you about a fallout in the dressing room.`,
    options:[
      {label:"Back him", morale:+4, otherMorale:-3},
      {label:"Tell them to sort it out", morale:-1},
      {label:"Fine them both", morale:-4, fine:true},
    ]},
  { id:"captaincy", weight:8, title:"Wants the armband",
    ask:p=>`${fullName(p)} believes he should be captain.`,
    options:[
      {label:"Make him captain", captain:true, morale:+8},
      {label:"Tell him it's under review", morale:0},
      {label:"He's not ready", morale:-5},
    ]},
  { id:"praise", weight:12, title:"Wants recognition",
    ask:p=>`${fullName(p)} feels his run of form has gone unnoticed.`,
    options:[
      {label:"Praise him publicly", morale:+6, note:"The rest of the squad notice too."},
      {label:"Keep his feet on the ground", morale:-2},
    ]},
  { id:"transferask", weight:9, title:"Wants to leave",
    ask:p=>`${fullName(p)} has told you he wants to move on.`,
    options:[
      {label:"List him", listed:true, morale:+3},
      {label:"Talk him round", morale:+2, note:"Buys you time, not loyalty."},
      {label:"He's going nowhere", morale:-8},
    ]},
];

function rollConversation(){
  const total = CONVERSATION_TYPES.reduce((s,c)=>s+c.weight,0);
  let r = Math.random()*total;
  for(const c of CONVERSATION_TYPES){ r -= c.weight; if(r<=0) return c; }
  return CONVERSATION_TYPES[0];
}

// Weekly: someone in the squad may want a word.
function generateConversations(){
  if(!state.conversations) state.conversations = [];
  if(state.conversations.length >= 3) return;
  const sq = state.squads[state.clubId] || [];
  if(sq.length === 0) return;
  if(Math.random() > 0.18) return;                 // not every week

  // Unhappy or out-of-favour players are the likeliest to knock on the door.
  const weighted = sq.filter(p=>!p.loanedFrom).map(p=>{
    let w = 1;
    if(p.morale <= 8) w += 4;
    const share = (p.apps||0) / Math.max(1, state.seasonStats.played);
    if(share < 0.3 && state.seasonStats.played >= 6) w += 3;
    if(ratingOf(p) >= 75) w += 1;
    if(p.contractYears === 1) w += 2;
    return {p, w};
  });
  const total = weighted.reduce((s,x)=>s+x.w,0);
  let r = Math.random()*total;
  let chosen = weighted[0];
  for(const x of weighted){ r -= x.w; if(r<=0){ chosen = x; break; } }
  if(!chosen) return;

  const type = rollConversation();
  state.conversations.push({
    id: "c"+Math.random().toString(36).slice(2,8),
    playerId: chosen.p.id, typeId: type.id,
    text: type.ask(chosen.p), title: type.title,
    week: state.week, season: state.season,
  });
  pushNews("A player wants a word",
    `${fullName(chosen.p)}: ${type.title.toLowerCase()}.`, "board");
}

function answerConversation(conv, optionIndex){
  const type = CONVERSATION_TYPES.find(t=>t.id===conv.typeId);
  const p = (state.squads[state.clubId]||[]).find(x=>x.id===conv.playerId);
  state.conversations = (state.conversations||[]).filter(c=>c.id!==conv.id);
  if(!type || !p){ saveState(); return {ok:true}; }
  const opt = type.options[optionIndex];
  if(!opt){ saveState(); return {ok:true}; }

  p.morale = clamp(p.morale + (opt.morale||0), 1, 20);
  let outcome = opt.label;

  if(opt.promise === "starting"){
    p.promisedStart = { untilWeek: state.week + 8 };   // broken promises cost you later
  }
  if(opt.listed){ p.listed = true; outcome += " — he is now transfer listed."; }
  if(opt.captain){ setCaptain(p.id); outcome += ` — ${fullName(p)} is your new captain.`; }
  if(opt.renew){
    const r = renewContract(p);
    outcome += r.ok ? ` — new deal agreed at ${fmtMoney(r.wage)}/week.`
                    : ` — but ${r.reason}`;
    if(!r.ok) p.morale = clamp(p.morale - 4, 1, 20);
  }
  if(opt.fine){
    const amount = issueFine(p, 1);
    outcome += ` — fined ${fmtMoney(amount)}.`;
  }
  if(opt.otherMorale){
    const others = (state.squads[state.clubId]||[]).filter(x=>x.id!==p.id);
    if(others.length){ const o = pick(others); o.morale = clamp(o.morale + opt.otherMorale, 1, 20); }
  }
  saveState(true);
  return {ok:true, outcome};
}

// Promises are remembered. Break one and he finds out.
function checkPromises(){
  const sq = state.squads[state.clubId] || [];
  sq.forEach(p=>{
    if(!p.promisedStart) return;
    if(state.week <= p.promisedStart.untilWeek) return;
    const share = (p.apps||0) / Math.max(1, state.seasonStats.played);
    if(share < 0.5){
      p.morale = clamp(p.morale - 8, 1, 20);
      pushNews("Promise broken",
        `${fullName(p)} was promised a starting place and hasn't had one. He is furious.`, "board");
    }
    p.promisedStart = null;
  });
}

/* ---- Fines ---- */
// Weeks' wages, as clubs actually do it.
function issueFine(p, weeks){
  const amount = Math.round((p.wage || wageDemand(p)) * (weeks||1));
  const club = clubById(state.clubId);
  club.balance += amount;
  p.morale = clamp(p.morale - (weeks>=2 ? 6 : 3), 1, 20);
  p.finesReceived = (p.finesReceived||0) + 1;
  pushNews("Player fined",
    `${fullName(p)} has been fined ${weeks||1} week${(weeks||1)>1?"s":""}' wages (${fmtMoney(amount)}).`, "board");
  return amount;
}

/* ---- Captaincy ---- */
// A captain rating built from the things that actually make one: experience,
// personality (proxied by morale stability), standing in the side and service.
function captaincyRating(p){
  const exp = clamp((p.careerApps||0) / 300, 0, 1) * 30;
  const age = p.age >= 28 ? 22 : p.age >= 25 ? 16 : p.age >= 22 ? 9 : 3;
  const standing = clamp((ratingOf(p) - 50) / 45, 0, 1) * 24;
  const service = clamp((p.apps||0) / 30, 0, 1) * 10;
  const temperament = clamp((p.morale - 8) / 12, 0, 1) * 10 - clamp((p.reds||0)*2, 0, 6);
  const homegrown = p.isYouth ? 4 : 0;
  return clamp(Math.round(exp + age + standing + service + temperament + homegrown), 1, 99);
}

function setCaptain(playerId){
  const sq = state.squads[state.clubId] || [];
  sq.forEach(p=>{ p.isCaptain = false; p.isViceCaptain = false; });
  const cap = sq.find(p=>p.id===playerId);
  if(cap){
    cap.isCaptain = true;
    cap.morale = clamp(cap.morale + 4, 1, 20);
    // Vice-captain: next best leader.
    const vice = sq.filter(p=>p.id!==playerId).sort((a,b)=>captaincyRating(b)-captaincyRating(a))[0];
    if(vice) vice.isViceCaptain = true;
    state.captainId = playerId;
  }
  saveState();
}

function currentCaptain(){
  const sq = state.squads[state.clubId] || [];
  return sq.find(p=>p.isCaptain) || null;
}

// A settled, well-chosen captain lifts the dressing room.
function captaincyBonus(){
  const cap = currentCaptain();
  if(!cap) return 0.98;                     // no captain is a small negative
  if(!isAvailable(cap)) return 0.995;
  return 1 + (captaincyRating(cap) - 55) * 0.0009;
}

// At the start of each season the board expect you to name a captain.
function promptCaptainSelection(){
  const sq = state.squads[state.clubId] || [];
  if(sq.length === 0) return;
  const existing = currentCaptain();
  if(existing && isAvailable(existing)) return;
  const best = sq.slice().sort((a,b)=>captaincyRating(b)-captaincyRating(a))[0];
  if(best){
    setCaptain(best.id);
    pushNews("Captain named",
      `${fullName(best)} will wear the armband this season. You can change this on the Squad screen.`, "board");
  }
}



/* =========================================================================
   THE FOOTBALL CALENDAR
   A real year rather than a 46-slot list. Weeks map to the actual shape of a
   season: pre-season in July, the campaign from August to May, then a summer
   break. Crucially, pre-season is played through like any other week — you
   advance, you play friendlies, and the transfer window is open around you.

   Fixture congestion is handled properly too. A 46-game division cannot fit
   into 42 available weeks, so those leagues get midweek rounds — a Saturday
   and a Tuesday in the same week, exactly as the EFL does it.
   ========================================================================= */
const CALENDAR_WEEKS = 52;
const PRESEASON_START = 1,  PRESEASON_END = 6;      // July: tour and friendlies
const SEASON_START    = 7,  SEASON_END    = 48;     // August to late May
const SUMMER_START    = 49, SUMMER_END    = 52;     // June: contracts, awards
const PLAYABLE_WEEKS  = SEASON_END - SEASON_START + 1;   // 42

function calendarPhase(week){
  if(week <= PRESEASON_END) return "preseason";
  if(week <= SEASON_END) return "season";
  return "summer";
}
function phaseLabel(week){
  const p = calendarPhase(week);
  return p === "preseason" ? "Pre-season" : p === "summer" ? "Close season" : "Matchweek";
}

// Rough month for a given week, for flavour and weather.
const WEEK_MONTHS = ["Jul","Jul","Jul","Jul","Aug","Aug","Aug","Aug","Aug","Sep","Sep","Sep","Sep",
  "Oct","Oct","Oct","Oct","Nov","Nov","Nov","Nov","Dec","Dec","Dec","Dec","Jan","Jan","Jan","Jan",
  "Feb","Feb","Feb","Feb","Mar","Mar","Mar","Mar","Apr","Apr","Apr","Apr","May","May","May","May",
  "Jun","Jun","Jun","Jun","Jun","Jun","Jun"];
function monthForWeek(week){ return WEEK_MONTHS[clamp(week,1,52)-1] || "Jun"; }

/* ---- Scheduling with midweek rounds ----
   Spreads a league's rounds across the available weeks. If there are more
   rounds than weeks, the surplus is doubled up as midweek fixtures, favouring
   the traditional congested spells — late August, Boxing Week and Easter.   */
function buildRoundSchedule(totalRounds){
  const weeks = PLAYABLE_WEEKS;
  const schedule = [];                     // schedule[i] = {week, midweek}
  if(totalRounds <= weeks){
    // Comfortable: one round a week, spread evenly with the odd blank.
    const step = weeks / totalRounds;
    for(let r=0; r<totalRounds; r++){
      schedule.push({week: SEASON_START + Math.floor(r*step), midweek:false});
    }
    return schedule;
  }
  // Congested: every week gets a round, and the extras become midweek games.
  const extra = totalRounds - weeks;
  // Midweek rounds cluster where football actually schedules them.
  const preferred = [];
  const zones = [[3,7],[19,24],[33,38],[10,14]];    // late Aug, Christmas, Easter, autumn
  zones.forEach(([a,b])=>{ for(let w=a; w<=b; w++) preferred.push(w); });
  const midweekAt = new Set(preferred.slice(0, extra).map(offset=>SEASON_START + offset));
  let r = 0;
  for(let w=SEASON_START; w<=SEASON_END && r<totalRounds; w++){
    schedule.push({week:w, midweek:false}); r++;
    if(midweekAt.has(w) && r<totalRounds){ schedule.push({week:w, midweek:true}); r++; }
  }
  // Anything still unplaced goes into the closing weeks.
  let w = SEASON_END;
  while(r < totalRounds){ schedule.push({week:w, midweek:true}); r++; w--; }
  return schedule;
}

/* ---- Pre-season friendlies as real fixtures ---- */
// Built into the user's own calendar so they're played by advancing the week.
function schedulePreSeason(destId){
  const club = clubById(state.clubId);
  const dest = TOUR_DESTINATIONS.find(d=>d.id===destId) || TOUR_DESTINATIONS[TOUR_DESTINATIONS.length-1];
  const fee = tourFeeFor(dest, club);
  club.balance += fee;
  const opponents = buildTourFixtures(dest.id);
  // Four friendlies across the pre-season weeks, leaving the last one clear.
  const weeks = [PRESEASON_START+1, PRESEASON_START+2, PRESEASON_START+3, PRESEASON_START+4];
  state.preSeason = {
    dest: dest.id, name: dest.name, icon: dest.icon, fee, chosen: true,
    fixtures: opponents.map((oppId,i)=>({
      opp: oppId, week: weeks[i], played:false, hg:0, ag:0,
    })),
  };
  (state.squads[state.clubId]||[]).forEach(p=>{
    p.condition = clamp((p.condition||100) + dest.fitness, 20, 100);
  });
  if(dest.reputation) club.stature = clamp((club.stature||9) + dest.reputation*0.02, 4, 18.6);
  pushNews("Pre-season tour confirmed",
    `${club.name} head to ${dest.name}, banking ${fmtMoney(fee)}. Four friendlies are scheduled across the next month.`, "board");
  saveState();
  return state.preSeason;
}

function preSeasonFixtureThisWeek(){
  const ps = state.preSeason;
  if(!ps || !ps.fixtures) return null;
  return ps.fixtures.find(f=>f.week === state.week && !f.played) || null;
}

// Played through advanceWeek like any other match.
function playPreSeasonFixture(fx){
  const oppId = fx.opp;
  const ctx = buildMatchContext(state.clubId, oppId, null, "friendly");
  const {hg, ag} = simulateScore(state.squads[state.clubId], state.squads[oppId], ctx);
  fx.hg = hg; fx.ag = ag; fx.played = true;
  // Friendlies build sharpness rather than draining it.
  (state.squads[state.clubId]||[]).forEach(p=>{
    p.condition = clamp((p.condition||100) + rndInt(2,6), 20, 100);
  });
  recordQuickStats(oppId, ag, hg);
  return {home:state.clubId, away:oppId, hg, ag, week:state.week, ctx};
}

/* =========================================================================
   THE SHAPE OF A SEASON
   Pre-season tour, kit sponsorship, stadium naming rights and an end-of-season
   awards night. These are the beats that make one season feel different to the
   next rather than just another 46 weeks of fixtures.
   ========================================================================= */

/* ---- Pre-season tour ---- */
const TOUR_DESTINATIONS = [
  {id:"usa",       name:"United States",  icon:"🇺🇸", fee:[400000,4500000], fitness:12, reputation:6},
  {id:"asia",      name:"Southeast Asia", icon:"🇸🇬", fee:[350000,4000000], fitness:10, reputation:7},
  {id:"japan",     name:"Japan",          icon:"🇯🇵", fee:[300000,3200000], fitness:11, reputation:6},
  {id:"australia", name:"Australia",      icon:"🇦🇺", fee:[250000,2600000], fitness:11, reputation:5},
  {id:"gulf",      name:"The Gulf",       icon:"🇦🇪", fee:[500000,5000000], fitness:8,  reputation:4},
  {id:"spain",     name:"Spain",          icon:"🇪🇸", fee:[80000,700000],   fitness:16, reputation:2},
  {id:"portugal",  name:"Portugal",       icon:"🇵🇹", fee:[70000,600000],   fitness:16, reputation:2},
  {id:"germany",   name:"Austria & Germany", icon:"🇦🇹", fee:[90000,750000], fitness:17, reputation:2},
  {id:"home",      name:"Stay at home",   icon:"🏠", fee:[0,0],            fitness:14, reputation:0},
];

function tourFeeFor(dest, club){
  const pull = clubPrestige(club) / 99;
  return Math.round(dest.fee[0] + (dest.fee[1] - dest.fee[0]) * pull);
}

// Four friendlies against clubs from the host nation (or nearby sides at home).
function buildTourFixtures(destId){
  const club = clubById(state.clubId);
  const nationByDest = {spain:"spain", portugal:"portugal", germany:"germany"};
  const hostNation = nationByDest[destId];
  let pool;
  if(hostNation){
    pool = Object.values(CLUB_META).filter(c=>c.leagueNation===hostNation && !c.hidden);
  } else if(destId === "home"){
    pool = Object.values(CLUB_META).filter(c=>c.tier===club.tier && c.id!==club.id && !c.hidden);
  } else {
    // Touring sides play invited European clubs plus local opposition.
    pool = Object.values(CLUB_META).filter(c=>!c.hidden && c.id!==club.id &&
      Math.abs(clubPrestige(c) - clubPrestige(club)) < 26);
  }
  if(!pool.length) pool = Object.values(CLUB_META).filter(c=>!c.hidden && c.id!==club.id);
  return shuffleArr(pool).slice(0,4).map(c=>c.id);
}

function startPreSeason(destId){
  const dest = TOUR_DESTINATIONS.find(d=>d.id===destId) || TOUR_DESTINATIONS[TOUR_DESTINATIONS.length-1];
  const club = clubById(state.clubId);
  const fee = tourFeeFor(dest, club);
  club.balance += fee;
  state.preSeason = {
    dest: dest.id, name: dest.name, icon: dest.icon, fee,
    opponents: buildTourFixtures(dest.id),
    played: [], index: 0, done: false,
  };
  // Touring lifts sharpness and, abroad, the club's profile.
  (state.squads[state.clubId]||[]).forEach(p=>{
    p.condition = clamp((p.condition||100) + dest.fitness, 20, 100);
  });
  if(dest.reputation) club.stature = clamp((club.stature||9) + dest.reputation*0.02, 4, 18.6);
  pushNews("Pre-season tour",
    `${club.name} will spend pre-season in ${dest.name}, banking ${fmtMoney(fee)} in appearance fees. Four friendlies arranged.`, "board");
  return state.preSeason;
}

// Plays the next friendly. Results don't count, but sharpness and morale do.
function playFriendly(){
  const ps = state.preSeason;
  if(!ps || ps.done) return null;
  const oppId = ps.opponents[ps.index];
  if(!oppId){ ps.done = true; return null; }
  const opp = clubById(oppId);
  const ctx = buildMatchContext(state.clubId, oppId, null, "friendly");
  const {hg, ag} = simulateScore(state.squads[state.clubId], state.squads[oppId], ctx);
  ps.played.push({opp:oppId, hg, ag});
  ps.index++;
  if(ps.index >= ps.opponents.length) ps.done = true;

  (state.squads[state.clubId]||[]).forEach(p=>{
    p.condition = clamp((p.condition||100) - rndInt(3,8), 20, 100);
    if(hg > ag) p.morale = clamp(p.morale + 1, 1, 20);
  });
  return {opp, hg, ag, ctx, remaining: ps.opponents.length - ps.index};
}

/* ---- Pre-season briefings ----
   The reminders a manager would actually get before a campaign starts.       */
function preSeasonBriefings(){
  const club = clubById(state.clubId);
  const sq = state.squads[state.clubId] || [];
  const out = [];

  const expiring = sq.filter(p=>(p.contractYears||9) <= 1);
  if(expiring.length) out.push({icon:"📄", title:"Contracts running down",
    text:`${expiring.length} player${expiring.length>1?"s are":" is"} into the final year: ${expiring.slice(0,4).map(p=>fullName(p)).join(", ")}${expiring.length>4?"…":""}. Renew or risk losing them for nothing.`});

  const thin = {};
  ["GK","DF","MD","FW"].forEach(pos=>{ thin[pos] = sq.filter(p=>p.pos===pos).length; });
  const need = Object.keys(thin).filter(pos=> thin[pos] < ({GK:2,DF:5,MD:5,FW:3})[pos]);
  if(need.length) out.push({icon:"⚠️", title:"Squad gaps",
    text:`You are light at ${need.join(", ")}. The window is open now.`});

  if(state.boardObjective) out.push({icon:"📋", title:"Board expectations", text: state.boardObjective.text});

  const cap = currentCaptain();
  out.push({icon:"🅒", title:"Captain",
    text: cap ? `${fullName(cap)} will wear the armband.` : "You have not named a captain."});

  const head = wageHeadroom(state.clubId);
  out.push({icon:"💷", title:"Budget",
    text:`Wage budget ${fmtMoney(club.wageBudget||0)}/week, ${fmtMoney(Math.max(0,head))} spare. Maximum ${fmtMoney(maxWageFor(club))} for any one player.`});

  const young = sq.filter(p=>p.age<=20 && potentialOf(p) - ratingOf(p) >= 12);
  if(young.length) out.push({icon:"⭐", title:"Ones to watch",
    text:`${young.slice(0,3).map(p=>`${fullName(p)} (${ratingOf(p)}→${potentialOf(p)})`).join(", ")} could push on with game time.`});

  return out;
}

/* ---- Kit sponsorship ---- */
const SPONSOR_NAMES = ["Northgate","Vantiq","Halcyon","Brightside","Kestrel","Orbit Energy","Meridian",
  "Ironclad","Bluewave","Fairstone","Sunline","Redwood","Anchor","Vertex","Lantern","Crestwell"];
const SPONSOR_SUFFIX = ["Group","Bank","Energy","Airlines","Logistics","Insurance","Motors","Telecom","Foods","Sports"];

function generateSponsorOffers(){
  const club = clubById(state.clubId);
  const base = (TIER_SPONSOR[club.tier] || 800) * 46;    // roughly a season's worth
  const pull = 0.7 + clubPrestige(club)/99 * 0.9;
  const offers = [];
  for(let i=0;i<3;i++){
    const name = pick(SPONSOR_NAMES) + " " + pick(SPONSOR_SUFFIX);
    // Shorter deals pay more per year; longer ones are security.
    const years = [1,2,3][i];
    const perYear = Math.round(base * pull * (years===1 ? 1.25 : years===2 ? 1.05 : 0.9) * rnd(0.85,1.2));
    const bonus = Math.round(perYear * (years===1 ? 0.35 : 0.2));
    offers.push({name, years, perYear, bonus,
      note: years===1 ? "Highest annual fee, but you renegotiate next summer."
          : years===3 ? "Lower fee, locked in for three seasons."
          : "A balance of the two."});
  }
  return offers;
}

function acceptSponsor(offer){
  const club = clubById(state.clubId);
  club.sponsor = {name:offer.name, years:offer.years, perYear:offer.perYear, since:state.season};
  club.balance += offer.perYear;
  pushNews("Shirt sponsor agreed",
    `${club.name} have signed a ${offer.years}-year kit deal with ${offer.name} worth ${fmtMoney(offer.perYear)} a season.`, "board");
  saveState();
}

/* ---- Stadium naming rights ---- */
function generateNamingOffers(){
  const club = clubById(state.clubId);
  // Naming rights scale with capacity and league standing — a National League
  // ground is worth a local firm's money, not a multinational's.
  const perYear = Math.round((club.capacity * 12 + clubPrestige(club) * 9000) * rnd(0.8,1.25));
  const offers = [];
  for(let i=0;i<2;i++){
    const brand = pick(SPONSOR_NAMES) + " " + pick(["Arena","Stadium","Park","Ground","Field"]);
    const years = i===0 ? 5 : 10;
    offers.push({brand, years,
      perYear: Math.round(perYear * (years===5 ? 1 : 0.82)),
      upfront: Math.round(perYear * (years===5 ? 0.8 : 1.6))});
  }
  return offers;
}

function acceptNamingRights(offer){
  const club = clubById(state.clubId);
  club.stadiumName = offer.brand;
  club.namingDeal = {brand:offer.brand, years:offer.years, perYear:offer.perYear, since:state.season};
  club.balance += offer.upfront;
  pushNews("Stadium renamed",
    `The ground will be known as the ${offer.brand} for the next ${offer.years} years, worth ${fmtMoney(offer.perYear)} a season plus ${fmtMoney(offer.upfront)} up front.`, "board");
  saveState();
}

function stadiumDisplayName(club){
  return club.stadiumName || (club.name + " Stadium");
}

/* ---- Sponsorship income, paid annually ---- */
function paySponsorIncome(){
  const club = clubById(state.clubId);
  let total = 0;
  if(club.sponsor){
    club.sponsor.years--;
    if(club.sponsor.years > 0){ club.balance += club.sponsor.perYear; total += club.sponsor.perYear; }
    else { pushNews("Sponsorship expired", `The deal with ${club.sponsor.name} has run its course.`, "board"); club.sponsor = null; }
  }
  if(club.namingDeal){
    club.namingDeal.years--;
    if(club.namingDeal.years > 0){ club.balance += club.namingDeal.perYear; total += club.namingDeal.perYear; }
    else { pushNews("Naming rights expired", `The ${club.namingDeal.brand} deal has ended.`, "board");
           club.namingDeal = null; club.stadiumName = null; }
  }
  return total;
}

/* =========================================================================
   END-OF-SEASON AWARDS NIGHT
   Every league's winners are computed from the stats actually recorded that
   season, across all 27 divisions. The ceremony shows your own club's winners
   if you have any; if you don't, it shows the Ballon d'Or and each major
   league's Player of the Season instead, so the night still means something.
   ========================================================================= */

function buildCeremony(awardsResult){
  const season = state.season - 1;             // the season just finished
  const myClub = clubById(state.clubId);
  const mine = [];
  const leagueWinners = [];

  (awardsResult && awardsResult.leagues || []).forEach(l=>{
    const entry = {
      leagueId: l.leagueId,
      league: leagueDisplayName(l.leagueId),
      potm: l.potm || null,
      young: l.young || null,
      boot: l.boot || null,
      glove: l.glove || null,
      toty: l.toty || [],
    };
    leagueWinners.push(entry);

    // Anything won by one of your own players.
    [["Player of the Season", l.potm], ["Young Player", l.young],
     ["Golden Boot", l.boot], ["Golden Glove", l.glove]].forEach(([label, p])=>{
      if(p && p.clubId === state.clubId) mine.push({label, player:p, league:entry.league});
    });
    (l.toty||[]).forEach(p=>{
      if(p && p.clubId === state.clubId) mine.push({label:"Team of the Season", player:p, league:entry.league});
    });
  });

  const ballon = awardsResult ? awardsResult.ballonDor : null;
  if(ballon && ballon.clubId === state.clubId) mine.unshift({label:"Ballon d'Or", player:ballon, league:"World"});

  // The headline divisions, for when you have no winners of your own.
  const majors = ["premierleague","laliga","seriea","bundesliga","ligue1","championship"];
  const majorWinners = leagueWinners
    .filter(l=>majors.indexOf(l.leagueId) !== -1 && l.potm)
    .sort((a,b)=>majors.indexOf(a.leagueId)-majors.indexOf(b.leagueId));

  return {season, mine, ballon, leagueWinners, majorWinners, clubName: myClub ? myClub.name : ""};
}

function renderCeremony(data){
  const body = document.getElementById("ceremonyBody");
  if(!body) return;
  const line = (p, label, extra)=>`
    <div class="cer-row">
      ${avatarSVG(p, 40)}
      <div class="cer-info">
        <div class="cer-label">${label}</div>
        <div class="cer-name">${flagFor(p.nat)} ${fullName(p)}</div>
