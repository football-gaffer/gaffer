        <div class="cer-sub">${clubById(p.clubId)?clubById(p.clubId).name:""}${extra?" · "+extra:""}</div>
      </div>
    </div>`;

  let html = `<div class="cer-head">
      <div class="cer-title">Awards Night</div>
      <div class="cer-season">End of season ${data.season}</div>
    </div>`;

  if(data.mine.length){
    html += `<div class="section-title" style="margin-top:4px;">${data.clubName} winners</div>`;
    // Group Team of the Season into one row rather than eleven.
    const toty = data.mine.filter(m=>m.label==="Team of the Season");
    const solo = data.mine.filter(m=>m.label!=="Team of the Season");
    html += solo.map(m=>line(m.player, m.label, m.league)).join("");
    if(toty.length) html += `<div class="cer-toty">
        <div class="cer-label">Team of the Season</div>
        <div class="cer-name">${toty.map(m=>fullName(m.player)).join(", ")}</div>
      </div>`;
  } else {
    html += `<div class="cer-none">No silverware for ${data.clubName} this year. Elsewhere in the game:</div>`;
    if(data.ballon) html += line(data.ballon, "Ballon d'Or", "World Player of the Year");
    html += `<div class="section-title">League Players of the Season</div>`;
    html += data.majorWinners.map(l=>line(l.potm, l.league, l.potm.goals ? l.potm.goals+" goals" : "")).join("");
  }

  html += `<button class="btn-primary" id="cerClose" style="margin-top:16px;">Continue</button>`;
  body.innerHTML = html;
  document.getElementById("cerClose").onclick = ()=>{
    document.getElementById("ceremonyBackdrop").classList.remove("open");
  };
  document.getElementById("ceremonyBackdrop").classList.add("open");
}

/* =========================================================================
   NEGOTIATION — no more instant sales.
   A player leaves only when a club bids and you accept. Your own bids sit with
   the selling club for a few days while they think, and their patience runs
   down if you lowball or keep haggling. Deadline day is when the odd late
   deal actually lands.
   ========================================================================= */

// A bid you have made that the other club is still considering.
function submitBid(p, fee, kind){
  if(!state.pendingBids) state.pendingBids = [];
  const buyer = clubById(state.clubId);
  const from = clubById(p.clubId);
  if(!from) return {ok:false, code:"TRF-01", reason:"That club could not be found."};
  if(state.pendingBids.some(b=>b.playerId===p.id))
    return {ok:false, code:"TRF-04", reason:`You already have a bid in for ${fullName(p)}. Wait for their answer.`};

  const win = transferWindowOpen();
  if(!win) return {ok:false, code:"WIN-01",
    reason:`The window is shut. It reopens in ${weeksUntilWindow()} week${weeksUntilWindow()===1?"":"s"}.`};

  const ask = negotiatedFee(p, kind || "buy");
  const ratio = fee / Math.max(1, ask);

  // Patience: how many rounds of haggling they will tolerate before walking.
  // A derisory opening bid burns most of it immediately.
  let patience = 3;
  if(ratio < 0.6) patience = 1;
  else if(ratio < 0.8) patience = 2;
  if(isKeyPlayer(p)) patience -= 1;
  if(p.listed) patience += 1;
  patience = clamp(patience, 1, 4);

  state.pendingBids.push({
    playerId: p.id, clubId: p.clubId, fee, ask, kind: kind || "buy",
    week: state.week, season: state.season,
    patience, rounds: 0, status: "considering",
    respondWeek: state.week + rndInt(1,3),        // clubs take a few days
  });
  pushNews("Bid submitted",
    `You have bid ${fmtMoney(fee)} for ${fullName(p)} of ${from.name}. They will consider it.`, "transfer");
  saveState(true);
  return {ok:true, patience};
}

// Called weekly: selling clubs answer bids, counter, or walk away.
function processPendingBids(){
  if(!state.pendingBids || !state.pendingBids.length) return [];
  const resolved = [];
  const buyer = clubById(state.clubId);

  state.pendingBids = state.pendingBids.filter(bid=>{
    if(state.week < bid.respondWeek) return true;          // still thinking
    const p = (state.squads[bid.clubId]||[]).find(x=>x.id===bid.playerId);
    const from = clubById(bid.clubId);
    if(!p || !from){ return false; }                        // he moved on

    const ratio = bid.fee / Math.max(1, bid.ask);
    const interest = joiningInterest(p, buyer);

    // Comfortably over the asking price and he fancies it — done.
    if(ratio >= 0.98 && interest >= 0.35){
      const res = completeSignedDeal(p, bid);
      resolved.push({bid, outcome: res.ok ? "accepted" : "failed", player:p, from, detail:res});
      return false;
    }
    // Close enough that they'll counter rather than refuse.
    if(ratio >= 0.72 && bid.rounds < bid.patience){
      bid.rounds++;
      bid.counter = Math.round(bid.ask * rnd(1.0, 1.12));
      bid.status = "countered";
      bid.respondWeek = state.week + rndInt(1,2);
      resolved.push({bid, outcome:"countered", player:p, from});
      return true;
    }
    // Out of patience, or the bid was never serious.
    resolved.push({bid, outcome: interest < 0.2 ? "player-refused" : "rejected", player:p, from});
    return false;
  });

  resolved.forEach(r=>{
    const nm = fullName(r.player);
    if(r.outcome === "accepted")
      pushNews("Bid accepted", `${r.from.name} have accepted your bid for ${nm}. He has signed.`, "transfer");
    else if(r.outcome === "countered")
      pushNews("Counter offer", `${r.from.name} value ${nm} at ${fmtMoney(r.bid.counter)}. Meet it or walk away.`, "transfer");
    else if(r.outcome === "player-refused")
      pushNews("Terms rejected", `${nm} has turned down the move.`, "transfer");
    else if(r.outcome === "rejected")
      pushNews("Bid rejected", `${r.from.name} have rejected your bid for ${nm} and ended talks.`, "transfer");
  });
  return resolved;
}

function completeSignedDeal(p, bid){
  const buyer = clubById(state.clubId);
  const wageCheck = canAffordWages(buyer, p, 1);
  if(!wageCheck.ok) return wageCheck;
  if(state.squads[buyer.id].length >= SQUAD_MAX)
    return {ok:false, code:"TRF-05", reason:"Your squad is full."};
  const agreedWage = wageDemand(p);
  const res = buyPlayer(p, bid.fee);
  if(!res.ok) return res;
  p.wage = agreedWage;
  p.contractYears = defaultContractYears(p);
  const clauses = proposeClauses(p, bid.fee);
  p.clauses = (p.clauses||[]).concat(clauses.map(c=>Object.assign({},c,{club:bid.clubId})));
  checkAchievements({signedPlayer:true, signedFee:bid.fee});
  return {ok:true};
}

function raiseBid(bid){
  const p = (state.squads[bid.clubId]||[]).find(x=>x.id===bid.playerId);
  if(!p) return {ok:false, code:"TRF-06", reason:"He is no longer available."};
  const buyer = clubById(state.clubId);
  const fee = bid.counter || Math.round(bid.ask * 1.05);
  if(buyer.balance < fee) return {ok:false, code:"TRF-07", reason:"You cannot afford their valuation."};
  bid.fee = fee; bid.status = "considering"; bid.respondWeek = state.week + 1;
  saveState(true);
  return {ok:true, fee};
}
function withdrawBid(bid){
  state.pendingBids = (state.pendingBids||[]).filter(b=>b.playerId!==bid.playerId);
  saveState();
}

/* ---- Deadline day ---- */
function isDeadlineWeek(){
  const w = transferWindowOpen();
  return !!(w && state.week === w.to);
}

/* ---- Deals agreed for the NEXT window (deliberately rare) ---- */
function agreeFutureTransfer(p, fee){
  if(!state.futureDeals) state.futureDeals = [];
  state.futureDeals.push({playerId:p.id, from:p.clubId, fee, season:state.season});
  pushNews("Pre-contract agreed",
    `${fullName(p)} will join in the next window for ${fmtMoney(fee)}.`, "transfer");
}
function completeFutureDeals(){
  const done = [];
  (state.futureDeals||[]).forEach(d=>{
    const p = (state.squads[d.from]||[]).find(x=>x.id===d.playerId);
    if(!p) return;
    const res = completeSignedDeal(p, {fee:d.fee, clubId:d.from});
    if(res.ok) done.push(p);
  });
  state.futureDeals = [];
  if(done.length) pushNews("Signings completed",
    done.map(p=>fullName(p)).join(", ") + " have now joined.", "transfer");
  return done;
}


/* =========================================================================
   PLAYER MATCH RATINGS AND LEAGUE STATISTICS
   Every player in every league now carries a per-match rating, so awards are
   decided on performance rather than goals alone, and the game can show real
   leaderboards: scorers, assists, clean sheets and average rating.
   ========================================================================= */

// A performance mark out of 10 for one appearance. Built from the things that
// actually drive a rating: the result, individual contribution, and position.
function computeMatchRating(p, ctx){
  const won = ctx.gf > ctx.ga, drew = ctx.gf === ctx.ga;
  let r = 6.4;                                   // par for a quiet afternoon
  r += won ? 0.55 : drew ? 0.05 : -0.35;

  if(p.pos === "GK"){
    if(ctx.ga === 0) r += 1.0;
    else r -= Math.min(ctx.ga * 0.28, 1.3);
  } else if(p.pos === "DF"){
    if(ctx.ga === 0) r += 0.7;
    else r -= Math.min(ctx.ga * 0.2, 1.0);
  }
  r += (ctx.goals || 0) * 0.95;
  r += (ctx.assists || 0) * 0.55;
  if(ctx.red) r -= 2.2;
  else if(ctx.yellow) r -= 0.25;

  // Better players are more consistently good, but anyone can have a night.
  const quality = (ratingOf(p) - 60) / 40;
  r += quality * 0.35 + rnd(-0.55, 0.55);
  // Fatigue tells in the numbers.
  if((p.condition !== undefined) && p.condition < 60) r -= 0.3;
  return clamp(Math.round(r * 10) / 10, 3.0, 10.0);
}

// Records one appearance: rating, and the running season average.
function recordRating(p, rating){
  p.ratingSum = (p.ratingSum || 0) + rating;
  p.ratingCount = (p.ratingCount || 0) + 1;
  p.lastRating = rating;
  if(!p.form) p.form = [];
  p.form.push(rating);
  if(p.form.length > 6) p.form.shift();
}

function averageRating(p){
  if(!p.ratingCount) return null;
  return Math.round((p.ratingSum / p.ratingCount) * 10) / 10;
}

/* ---- League leaderboards ---- */
// Every club in a division, every player who has actually featured.
function leaguePlayers(leagueId){
  const league = state.tiers[leagueId];
  if(!league) return [];
  const out = [];
  league.clubIds.forEach(cid=>{
    (state.squads[cid] || []).forEach(p=>{ if((p.apps||0) > 0) out.push(p); });
  });
  return out;
}

const LEADERBOARDS = {
  goals:      {label:"Goals",       get:p=>p.goals||0,        min:1, fmt:v=>v},
  assists:    {label:"Assists",     get:p=>p.assists||0,      min:1, fmt:v=>v},
  cleanSheets:{label:"Clean sheets",get:p=>p.cleanSheets||0,  min:1, fmt:v=>v,
               filter:p=>p.pos==="GK"||p.pos==="DF"},
  rating:     {label:"Avg rating",  get:p=>averageRating(p)||0, min:0.1, fmt:v=>v.toFixed(2),
               // A rating table needs a meaningful sample, not one good game.
               qualify:p=>(p.apps||0) >= 5},
};

function leaderboard(leagueId, key, limit){
  const def = LEADERBOARDS[key];
  if(!def) return [];
  let players = leaguePlayers(leagueId);
  if(def.filter) players = players.filter(def.filter);
  if(def.qualify) players = players.filter(def.qualify);
  return players
    .filter(p=>def.get(p) >= def.min)
    .sort((a,b)=> def.get(b) - def.get(a) || (b.apps||0) - (a.apps||0))
    .slice(0, limit || 15);
}

// Awards now weigh performance as well as output.
function awardScoreWithRating(p, leaguePos, leagueSize){
  const base = awardScore(p, leaguePos, leagueSize);
  const avg = averageRating(p);
  if(avg === null) return base;
  // A 7.5 average across a season is a genuinely strong year.
  return base + (avg - 6.5) * 14 * clamp((p.apps||0)/25, 0, 1);
}

/* =========================================================================
   AVAILABILITY — one source of truth for "can I actually get this player?"
   The market lists and the offer screen BOTH read this, so the list can never
   show you somebody you could never sign. Previously the loan list included
   any under-23 with headroom, which is why Lamine Yamal appeared in it.
   ========================================================================= */

// Where a player sits in his own club's pecking order. 0 = best player there.
let _rankCache = {}, _rankKey = "";
// Ranking a squad means sorting it; doing that per player made the transfer
// list quadratic. One sort per club per week, shared by everyone in it.
function squadRank(p){
  const sq = state.squads[p.clubId];
  if(!sq) return 99;
  const key = state.season + ":" + state.week;
  if(_rankKey !== key){ _rankCache = {}; _rankKey = key; }
  let ranks = _rankCache[p.clubId];
  if(!ranks){
    ranks = {};
    sq.slice().sort((a,b)=> ratingOf(b) - ratingOf(a)).forEach((x,i)=>{ ranks[x.id] = i; });
    _rankCache[p.clubId] = ranks;
  }
  return ranks[p.id] === undefined ? 99 : ranks[p.id];
}

// Is this player a genuine first-team regular at his club?
function isKeyPlayer(p){
  const rank = squadRank(p);
  const sq = state.squads[p.clubId] || [];
  // Top 11 anywhere, or a standout at a big club, is untouchable-ish.
  if(rank < 11) return true;
  const club = clubById(p.clubId);
  if(club && ratingOf(p) >= clubPrestige(club) + 6) return true;
  return false;
}

/* Returns {status, label, reason}
     "listed"       — the club wants him gone
     "available"    — realistically signable by you
     "loan"         — his club would sanction a loan to a club like yours
     "stretch"      — signable but a real push
     "unattainable" — out of your reach; not shown by default          */
function playerAvailability(p, myClub){
  const from = clubById(p.clubId);
  if(isFreeAgent(p)) return {status:"available", label:"Free agent"};
  if(!from || !myClub) return {status:"unattainable", label:"Unavailable"};
  if(p.loanedFrom) return {status:"unattainable", label:"Already on loan elsewhere",
    reason:"He is on loan at another club this season."};

  const standing = clubPrestige(myClub);
  const rating = ratingOf(p);
  const theirStanding = clubPrestige(from);
  const key = isKeyPlayer(p);

  // Wages are the hard wall — if the board won't sanction it, nothing else matters.
  const demand = wageDemand(p);
  const affordable = demand <= maxWageFor(myClub);

  if(p.listed){
    if(!affordable) return {status:"unattainable", label:"Wages beyond you",
      reason:`He wants ${fmtMoney(demand)}/week; your ceiling is ${fmtMoney(maxWageFor(myClub))}.`};
    return {status:"listed", label:"Transfer listed"};
  }

  // Permanent reach: a club can stretch about 16 points above its standing.
  if(rating > standing + 16 || !affordable){
    // A loan may still be possible for a fringe youngster — checked below.
    const loanOK = !key && p.age <= 23 && rating <= standing + 12 &&
                   demand * 0.65 <= maxWageFor(myClub);
    if(loanOK) return {status:"loan", label:"Loan only"};
    return {status:"unattainable",
      label: !affordable ? "Wages beyond you" : "Beyond your club's level",
      reason: !affordable
        ? `He wants ${fmtMoney(demand)}/week; your board sanctions ${fmtMoney(maxWageFor(myClub))} at most.`
        : `Rated ${rating}. A club of your standing can realistically reach about ${Math.round(standing+16)}.`};
  }

  if(key && theirStanding > standing + 10)
    return {status:"unattainable", label:"Not for sale",
      reason:`${from.name} regard him as a first-team player and won't deal with a club at your level.`};

  if(rating > standing + 8) return {status:"stretch", label:"Ambitious"};
  return {status:"available", label:"Attainable"};
}

// A club will only loan OUT a player who is genuinely surplus to requirements.
function isLoanable(p, myClub){
  if(isFreeAgent(p) || p.listed || p.loanedFrom) return false;
  const from = clubById(p.clubId);
  if(!from || from.id === state.clubId) return false;
  if(p.age > 23) return false;                 // loan market is for development
  if(isKeyPlayer(p)) return false;             // nobody loans out their best XI
  if((p.potential || p.overall) <= p.overall) return false;   // needs room to grow
  if(!myClub) return true;
  return playerAvailability(p, myClub).status === "loan" ||
         playerAvailability(p, myClub).status === "available" ||
         playerAvailability(p, myClub).status === "stretch";
}


/* ---- Free agent pool ---- */
function releaseToFreeAgents(p){
  p.clubId = "__free__";
  p.listed = false;
  p.loanedFrom = null;
  p.contractYears = 0;
  if(!state.freeAgents) state.freeAgents = [];
  state.freeAgents.push(p);
  // Keep the pool from growing forever across a long save.
  if(state.freeAgents.length > 320){
    state.freeAgents.sort((a,b)=> (b.overall + (b.potential||b.overall)*0.4) - (a.overall + (a.potential||a.overall)*0.4));
    state.freeAgents.length = 280;
  }
}

// Runs each close season: clubs release surplus and ageing players, and list
// others for sale. This is what keeps the market alive year after year.
function runMarketRefresh(){
  if(!state.freeAgents) state.freeAgents = [];

  // Ageing free agents retire out of the pool rather than lingering forever.
  state.freeAgents = state.freeAgents.filter(p=>{
    p.age++;
    developPlayer(p, null);
    return p.age < 37 && Math.random() > 0.10;
  });

  Object.values(CLUB_META).forEach(club=>{
    const sq = state.squads[club.id];
    if(!sq) return;

    // Clear last season's listings.
    sq.forEach(p=>{ p.listed = false; });
    if(club.id === state.clubId) return;   // the player manages their own list

    // Release: over-30 fringe players and academy kids who won't make it.
    for(let i=sq.length-1; i>=0; i--){
      const p = sq[i];
      const squadAvg = sq.reduce((s,x)=>s+x.overall,0)/sq.length;
      const surplus = p.overall < squadAvg - 2.5;
      const tooOld = p.age >= 33 && p.overall < squadAvg - 1;
      const deadEnd = p.age >= 20 && p.isYouth && (p.potential||p.overall) < squadAvg - 1.5;
      if((surplus || tooOld || deadEnd) && sq.length > 17 && !p.isReal && Math.random() < 0.5){
        sq.splice(i,1);
        releaseToFreeAgents(p);
      }
    }

    // List: a couple of players the club would happily sell.
    // Clubs list fringe players, never their first-team regulars.
    const listCount = rndInt(1,4);
    const candidates = sq.slice()
      .filter(x=>!isKeyPlayer(x))
      .sort((a,b)=>a.overall-b.overall);
    for(let i=0; i<listCount && i<candidates.length; i++){
      if(Math.random() < 0.6) candidates[i].listed = true;
    }
  });

  // A handful of genuinely good players hit the market every summer.
  // Free agents are veterans at the end of their contracts and squad players
  // nobody renewed — not a club's best defender. Releasing a 29-year-old
  // first-choice centre-back was simply wrong.
  const bargainCount = rndInt(6,14);
  for(let i=0;i<bargainCount;i++){
    const clubId = pick(Object.keys(state.squads).filter(id=>id!==state.clubId));
    const sq = state.squads[clubId];
    if(!sq || sq.length<=17) continue;
    const candidates = sq.filter(x=>
      x.age >= 33 &&                    // genuinely at the end
      !isKeyPlayer(x) &&                // not part of the first XI
      !x.isReal                         // never release a documented real player this way
    );
    if(!candidates.length) continue;
    const p = candidates.sort((a,b)=>b.overall-a.overall)[0];
    state.squads[clubId] = sq.filter(x=>x.id!==p.id);
    releaseToFreeAgents(p);
  }
}

/* ---- Loans ---- */
function loanInPlayer(player){
  const buyer = clubById(state.clubId);
  const fee = loanFee(player);
  if(buyer.balance < fee) return {ok:false, reason:"Can't afford the loan fee."};
  if(state.squads[buyer.id].length >= SQUAD_MAX) return {ok:false, reason:"Your squad is full (30 maximum)."};
  const loanInterest = signingInterest(player, buyer, "loan");
  if(!loanInterest.willing) return {ok:false, reason:`${fullName(player)} ${loanInterest.reason}.`};
  const parentId = player.clubId;
  buyer.balance -= fee;
  const parent = clubById(parentId);
  if(parent) parent.balance += fee;
  state.squads[parentId] = state.squads[parentId].filter(p=>p.id!==player.id);
  player.loanedFrom = parentId;
  player.wage = Math.round(wageDemand(player) * 0.65);   // parent covers the rest         // remembered so he goes home in the summer
  player.clubId = buyer.id;
  state.squads[buyer.id].push(player);
  pushNews("Loan signing", `${fullName(player)} joins on loan from ${parent?parent.name:"his club"} for ${fmtMoney(fee)}.`, "transfer");
  saveState(true);
  return {ok:true, fee};
}

// Called at rollover: every loanee returns to his parent club.
function returnLoanees(){
  const returned = [];
  Object.keys(state.squads).forEach(clubId=>{
    const sq = state.squads[clubId];
    for(let i=sq.length-1;i>=0;i--){
      const p = sq[i];
      if(!p.loanedFrom) continue;
      const parentId = p.loanedFrom;
      p.loanedFrom = null;
      if(!state.squads[parentId]){ continue; }   // parent club vanished somehow; keep him
      sq.splice(i,1);
      p.clubId = parentId;
      state.squads[parentId].push(p);
      if(clubId===state.clubId) returned.push(p);
    }
  });
  return returned;
}

/* ---- Free agent signing ---- */
function signFreeAgent(player){
  const club = clubById(state.clubId);
  if(state.squads[club.id].length >= SQUAD_MAX) return {ok:false, reason:"Your squad is full (30 maximum)."};
  const signingBonus = Math.round(playerWage(player, club.tier) * 12); // one-off, stands in for agent fees
  if(club.balance < signingBonus) return {ok:false, reason:"Can't afford the signing bonus."};
  club.balance -= signingBonus;
  state.freeAgents = (state.freeAgents||[]).filter(p=>p.id!==player.id);
  player.clubId = club.id;
  player.listed = false;
  state.squads[club.id].push(player);
  pushNews("Free transfer", `${fullName(player)} signs on a free. Bonus paid: ${fmtMoney(signingBonus)}.`, "transfer");
  checkAchievements({signedPlayer:true, signedFee:0});
  saveState(true);
  return {ok:true, bonus:signingBonus};
}

/* ---- Listing your own players ---- */
function toggleListed(player){
  player.listed = !player.listed;
  saveState();
  return player.listed;
}

/* =========================================================================
   EUROPEAN COMPETITIONS
   Champions League / Europa League / Conference League each run the modern
   36-team league phase (8 matches per club, one combined table), then the
   knockout playoff for 9th-24th, R16, QF, SF and Final. The UEFA Super Cup is
   a one-off between the previous season's CL and EL winners.
   ========================================================================= */
const EURO_COMPS = {
  ucl:  {id:"ucl",  name:"Champions League",  short:"UCL",  prize:[2200000,3000000,4200000,6500000,11000000,18000000], winner:28000000, entryFee:20000000},
  uel:  {id:"uel",  name:"Europa League",     short:"UEL",  prize:[600000,900000,1400000,2200000,3800000,6200000],     winner:10500000, entryFee:5000000},
  uecl: {id:"uecl", name:"Conference League", short:"UECL", prize:[250000,400000,650000,1000000,1700000,2900000],       winner:4500000,  entryFee:3000000},
};
// League-phase rounds then knockout rounds, mapped onto the 46-week calendar.
const EURO_LEAGUE_WEEKS = [10,13,15,18,20,22,24,28];
const EURO_KO_WEEKS = {playoff:31, r16:34, qf:39, sf:43, final:47};

// UEFA-style allocation: the strongest associations get four Champions League
// places, the next tier two or three, and so on down to a single entrant for
// the smallest. Everyone also gets Europa and Conference places. This replaces
// the old flat "4/2/1 for everyone" which handed Scotland the same as Spain.
function euroSlotsFor(nationId){
  const n = NATIONS[nationId];
  const rank = n ? n.coeff : 30;
  if(rank <= 4)  return {ucl:4, uel:2, uecl:1};   // England, Spain, Italy, Germany
  if(rank <= 6)  return {ucl:3, uel:2, uecl:1};   // France, Netherlands
  if(rank <= 10) return {ucl:2, uel:2, uecl:1};   // Portugal, Belgium, Scotland, Turkey
  if(rank <= 15) return {ucl:2, uel:1, uecl:1};
  return {ucl:1, uel:1, uecl:2};                   // smallest associations
}

function qualifyForEurope(){
  // Real qualification. Each nation's places are filled strictly by final league
  // position, working through the nations in UEFA coefficient order, using the
  // EURO_SLOTS table (which totals exactly 36 per competition once the seven
  // domestic-cup places are added). Domestic cup winners take a Europa League
  // spot; if they already qualified through the league, the place passes down
  // the table, exactly as it does in reality.
  const entrants = {ucl:[], uel:[], uecl:[]};
  const taken = new Set();
  const nationOrder = (typeof rankedNations === "function" && state.coeff)
    ? rankedNations()
    : Object.keys(EURO_SLOTS).sort((a,b)=>((NATIONS[a]||{}).coeff||99)-((NATIONS[b]||{}).coeff||99));

  nationOrder.forEach(nationId=>{
    const slots = EURO_SLOTS[nationId];
    const leagueId = getAllLeagueIds().find(l=> isTopDivision(l) && leagueNationId(l)===nationId);
    if(!slots || !leagueId || !state.tiers[leagueId]) return;
    const table = computeTable(leagueId).map(r=>r.id);
    let idx = 0;
    const take = (comp, n)=>{
      let placed = 0;
      while(placed < n && idx < table.length){
        const id = table[idx++];
        if(taken.has(id)) continue;
        taken.add(id);
        entrants[comp].push(id);
        placed++;
      }
    };
    take("ucl",  slots.ucl);
    take("uel",  slots.uel);
    take("uecl", slots.uecl);
  });

  // Seven Europa League places for domestic cup winners, topped up from the
  // best clubs who narrowly missed out if the cups were won by qualifiers.
  // Every nation's domestic cup winner takes a Europa League place.
  const cupPlaces = [];
  nationalCupWinners().forEach(id=>{
    if(id && !taken.has(id) && CLUB_META[id] && isTopDivision(CLUB_META[id].tier)){
      taken.add(id); cupPlaces.push(id);
    }
  });
  if(cupPlaces.length < 7){
    // Spread the remaining places one per nation, in coefficient order, rather
    // than handing all of them to England simply because it is listed first.
    const queues = nationOrder.map(nationId=>{
      const leagueId = getAllLeagueIds().find(l=> isTopDivision(l) && leagueNationId(l)===nationId);
      if(!leagueId || !state.tiers[leagueId]) return [];
      return computeTable(leagueId).map(r=>r.id).filter(id=>!taken.has(id));
    });
    let round = 0;
    while(cupPlaces.length < 7 && round < 40){
      let placedThisRound = false;
      for(let q = 0; q < queues.length && cupPlaces.length < 7; q++){
        const id = queues[q][round];
        if(!id || taken.has(id)) continue;
        taken.add(id);
        cupPlaces.push(id);
        placedThisRound = true;
      }
      if(!placedThisRound && round > 3) break;
      round++;
    }
  }
  cupPlaces.slice(0,7).forEach(id=>{ taken.add(id); entrants.uel.push(id); });

  return entrants;
}

function initEuroForSeason(){
  const entrants = qualifyForEurope();
  state.euro = {};
  Object.keys(EURO_COMPS).forEach(key=>{
    let pool = entrants[key].slice();
    // Pad or trim to a 36-team league phase.
    // Fill remaining slots with the strongest TOP-DIVISION clubs that just missed
    // out. Padding at random previously put League Two sides in the Conference League.
    if(pool.length < 36){
      const inPool = new Set(pool);
      const nextBest = Object.values(CLUB_META)
        .filter(c=>!c.hidden && !inPool.has(c.id) && isTopDivision(c.tier))
        .map(c=>({id:c.id, s:(c.stature||9) + clamp((c.balance||0)/1e8,0,2)}))
        .sort((a,b)=>b.s-a.s);
      for(const cand of nextBest){
        if(pool.length >= 36) break;
        pool.push(cand.id); inPool.add(cand.id);
      }
    }
    // Keep qualification order — the league phase table should reflect who
    // actually earned their place, not a reshuffle.
    pool = pool.slice(0,36);
    const table = {};
    pool.forEach(id=> table[id] = {id, played:0, won:0, drawn:0, lost:0, gf:0, ga:0, pts:0});
    state.euro[key] = {clubIds:pool, table, round:0, stage:"league", bracket:null, champion:null};
  });
  // Super Cup between last season's winners, if we have them.
  const h = state.honours||{};
  state.superCup = (h.lastUclWinner && h.lastUelWinner)
    ? {a:h.lastUclWinner, b:h.lastUelWinner, played:false} : null;
}

// One league-phase round: every club plays one random opponent it hasn't met.
function playEuroLeagueRound(key){
  const comp = state.euro[key];
  if(!comp || comp.stage!=="league") return null;
  const pool = shuffleArr(comp.clubIds.slice());
  let userMatch = null;
  for(let i=0;i+1<pool.length;i+=2){
    const a = pool[i], b = pool[i+1];
    const {hg,ag} = simulateScore(state.squads[a], state.squads[b]);
    applyEuroResult(comp, a, b, hg, ag);
    if(a===state.clubId || b===state.clubId){
      userMatch = {home:a, away:b, hg, ag, week:state.week};
      clubById(state.clubId).balance += EURO_COMPS[key].prize[0];
    }
  }
  comp.round++;
  if(comp.round >= EURO_LEAGUE_WEEKS.length){
    comp.stage = "ko";
    seedEuroKnockout(key);
  }
  return userMatch;
}

function applyEuroResult(comp, a, b, hg, ag){
  // Coefficient points, exactly as UEFA awards them.
  if(hg>ag){ addCoeffPoints(a, COEFF_WIN); }
  else if(ag>hg){ addCoeffPoints(b, COEFF_WIN); }
  else { addCoeffPoints(a, COEFF_DRAW); addCoeffPoints(b, COEFF_DRAW); }
  const ra = comp.table[a], rb = comp.table[b];
  ra.played++; rb.played++; ra.gf+=hg; ra.ga+=ag; rb.gf+=ag; rb.ga+=hg;
  if(hg>ag){ ra.won++; ra.pts+=3; rb.lost++; }
  else if(ag>hg){ rb.won++; rb.pts+=3; ra.lost++; }
  else { ra.drawn++; rb.drawn++; ra.pts++; rb.pts++; }
}

function euroSortedTable(key){
  const comp = state.euro[key];
  return Object.values(comp.table).sort((x,y)=> y.pts-x.pts || (y.gf-y.ga)-(x.gf-x.ga) || y.gf-x.gf);
}

function seedEuroKnockout(key){
  const comp = state.euro[key];
  const sorted = euroSortedTable(key).map(r=>r.id);
  comp.top8 = sorted.slice(0,8);            // straight to the R16
  comp.playoffPool = sorted.slice(8,24);    // 9th-24th contest the playoff round
  comp.eliminated = sorted.slice(24);
  comp.bracket = null;
  comp.koStage = "playoff";
}

// Resolves one knockout round; returns the user's tie if they were in it.
function playEuroKnockoutRound(key, stage){
  const comp = state.euro[key];
  if(!comp || comp.champion || comp.stage!=="ko") return null;
  let pairs;
  if(stage==="playoff"){
    pairs = pairUp(comp.playoffPool);
  } else {
    pairs = pairUp(comp.bracket || []);
  }
  if(!pairs || pairs.length===0) return null;

  const winners = [];
  let userTie = null;
  const prizeIdx = {playoff:1, r16:2, qf:3, sf:4, final:5}[stage] || 1;
  const roundBonus = COEFF_ROUND_BONUS[stage] || 0;
  pairs.forEach(([a,b])=>{
    if(!a || !b){ winners.push(a||b); return; }
    const res = resolveCupTie(a,b);
    winners.push(res.winner);
    // Both clubs earn their nation coefficient credit for reaching this round.
    addCoeffPoints(a, roundBonus); addCoeffPoints(b, roundBonus);
    if(res.winner) addCoeffPoints(res.winner, COEFF_WIN);
    if(a!==state.clubId && b!==state.clubId){
      recordQuickStats(a, res.hg, res.ag); recordQuickStats(b, res.ag, res.hg);
    }
    if(a===state.clubId || b===state.clubId){
      clubById(state.clubId).balance += EURO_COMPS[key].prize[prizeIdx];
      userTie = {a, b, hg:res.hg, ag:res.ag, prize:EURO_COMPS[key].prize[prizeIdx], stage};
    }
  });

  if(stage==="playoff"){
    comp.bracket = shuffleArr(comp.top8.concat(winners)); // 16 clubs into the R16
    comp.koStage = "r16";
  } else if(winners.length===1){
    comp.champion = winners[0];
    if(comp.champion===state.clubId) clubById(state.clubId).balance += EURO_COMPS[key].winner;
  } else {
    comp.bracket = winners;
    comp.koStage = {r16:"qf", qf:"sf", sf:"final"}[stage] || "final";
  }
  return userTie;
}

function pairUp(ids){
  const out = [];
  for(let i=0;i+1<ids.length;i+=2) out.push([ids[i], ids[i+1]]);
  return out;
}

function userEuroComp(){
  if(!state.euro) return null;
  for(const key of Object.keys(EURO_COMPS)){
    const c = state.euro[key];
    if(c && c.clubIds.includes(state.clubId)) return key;
  }
  return null;
}


// Picks a believable 4-4-2 from the available squad, best-rated first in each slot.
// Everything match-related (appearances, ratings, scorers, injuries) uses this same XI,
// so a player can never score in a match he didn't play in.
function selectStartingXI(squad){
  // For the user's own club, honour the manager's selection.
  if(squad.length && squad[0].clubId === state.clubId && typeof userStartingXI === "function" && state.tactics){
    const chosen = userStartingXI();
    if(chosen && chosen.length === 11) return chosen;
  }
  const avail = squad.filter(isAvailable);
  const byPos = pos => avail.filter(p=>p.pos===pos).sort((a,b)=>b.overall-a.overall);
  const xi = [].concat(byPos("GK").slice(0,1), byPos("DF").slice(0,4), byPos("MD").slice(0,4), byPos("FW").slice(0,2));
  // If injuries leave a hole, backfill with the best remaining available player.
  if(xi.length<11){
    const rest = avail.filter(p=>!xi.includes(p)).sort((a,b)=>b.overall-a.overall);
    xi.push(...rest.slice(0, 11-xi.length));
  }
  return xi;
}

function buildMatchDetail(homeId, awayId, hg, ag){
  const homeSquad = state.squads[homeId], awaySquad = state.squads[awayId];
  const hr = teamRatings(homeSquad), ar = teamRatings(awaySquad);

  let possession = Math.round(50 + ((hr.attack+hr.defense)-(ar.attack+ar.defense))*1.6 + rnd(-6,6));
  possession = clamp(possession, 26, 74);
  const homeShots = clamp(Math.round(hg*2.4 + rnd(3,10)), hg, 30);
  const awayShots = clamp(Math.round(ag*2.4 + rnd(2,9)), ag, 30);

  function pickScorers(squad, count){
    const pool = selectStartingXI(squad).filter(p=>p.pos!=="GK");
    if(pool.length===0) return [];
    const weighted = [];
    pool.forEach(p=>{
      const w = p.pos==="FW"?6 : p.pos==="MD"?3 : 1;
      for(let i=0;i<w;i++) weighted.push(p);
    });
    const out = [];
    for(let i=0;i<count;i++) out.push(weighted[rndInt(0,weighted.length)]);
    return out;
  }
  const homeScorers = pickScorers(homeSquad, hg);
  const awayScorers = pickScorers(awaySquad, ag);

  // Per-player ratings: baseline by ability, nudged by result and goals scored.
  function rateSquad(squad, goalsFor, goalsAgainst, scorers){
    const ratings = {};
    selectStartingXI(squad).forEach(p=>{
      let r = 6.0 + (p.overall-10)*0.06 + rnd(-0.6,0.6);
      if(goalsFor>goalsAgainst) r += 0.5; else if(goalsFor<goalsAgainst) r -= 0.35;
      if(p.pos==="GK" && goalsAgainst===0) r += 0.7;
      r += scorers.filter(s=>s && s.id===p.id).length * 0.85;
      ratings[p.id] = clamp(Math.round(r*10)/10, 4.0, 10.0);
    });
    return ratings;
  }
  const ratings = Object.assign({}, rateSquad(homeSquad, hg, ag, homeScorers), rateSquad(awaySquad, ag, hg, awayScorers));

  let motmId = null, motmBest = -1;
  Object.keys(ratings).forEach(id=>{ if(ratings[id]>motmBest){ motmBest=ratings[id]; motmId=id; } });

  // Injuries: small per-match chance per involved player, softened by the user's
  // medical centre level.
  const injuries = [];
  [homeId, awayId].forEach(clubId=>{
    const medical = clubId===state.clubId ? clubById(clubId).facilities.medical : 2;
    selectStartingXI(state.squads[clubId]).forEach(p=>{
      const prone = p.injuryProne ? 1.6 : 1;
      if(Math.random() < 0.014*prone/(1+(medical-1)*0.2)){
        const inj = applyInjury(p, medical);
        injuries.push({player:p, clubId, weeks:inj.weeks, name:inj.type.name, careerEnding:inj.careerEnding});
      }
    });
  });

  return {possession, homeShots, awayShots, homeScorers, awayScorers, ratings, motmId, motmBest, injuries};
}

// Cheap per-match stat recording for the ~10,000 AI fixtures a season. No
// ratings, no injuries, no event feed — just goals, assists, appearances and
// clean sheets, which is everything the leaderboards and awards need. Without
// this only the user's own players ever scored, so there were no AI stars.
function recordQuickStats(clubId, goalsFor, goalsAgainst){
  const sq = state.squads[clubId];
  if(!sq || sq.length===0) return;
  const available = sq.filter(isAvailable);
  if(available.length===0) return;

  // Appearances: roughly a starting XI's worth of the available squad.
  const playChance = Math.min(1, 11/available.length);
  const featured = [];
  available.forEach(p=>{
    if(Math.random() < playChance){
      p.apps++; p.careerApps++;
      if(goalsAgainst===0 && (p.pos==="GK"||p.pos==="DF")) p.cleanSheets++;
      featured.push(p);
    }
  });

  const outfield = available.filter(p=>p.pos!=="GK");
  if(outfield.length===0) return;
  for(let g=0; g<goalsFor; g++){
    const roll = Math.random();
    let pool = roll < 0.58 ? outfield.filter(p=>p.pos==="FW")
             : roll < 0.90 ? outfield.filter(p=>p.pos==="MD")
             : outfield.filter(p=>p.pos==="DF");
    if(!pool || pool.length===0) pool = outfield;
    // Better players score more often within their group.
    pool = pool.slice().sort((a,b)=>b.overall-a.overall);
    // A gentle bias toward the better players, not a hard one — too steep and a
    // single striker hoovers up 45+ league goals a season, which no one does.
    const idx = Math.min(Math.floor(Math.pow(Math.random(), 1.25) * pool.length), pool.length-1);
    const scorer = pool[idx];
    if(!scorer) continue;
    scorer.goals++; scorer.careerGoals++;
    scorer._mGoals = (scorer._mGoals||0) + 1;
    if(Math.random() < 0.55){
      const helper = outfield[rndInt(0, outfield.length)];
      if(helper && helper !== scorer){ helper.assists++; helper._mAssists = (helper._mAssists||0)+1; }
    }
  }

  // Rate everyone who played, then clear the per-match tallies.
  featured.forEach(p=>{
    recordRating(p, computeMatchRating(p, {
      gf: goalsFor, ga: goalsAgainst,
      goals: p._mGoals || 0, assists: p._mAssists || 0,
    }));
    p._mGoals = 0; p._mAssists = 0;
  });
}

function commitMatchStats(homeId, awayId, hg, ag, detail){
  // Route the user's own players through the same rating record as everyone
  // else, so league tables and awards compare like with like.
  if(detail && detail.ratings){
    Object.keys(detail.ratings).forEach(pid=>{
      const p = findPlayerById(pid);
      if(p) recordRating(p, detail.ratings[pid]);
    });
  }
  function apply(squad, goalsAgainst, scorers){
    selectStartingXI(squad).forEach(p=>{
      p.apps++; p.careerApps++;
      if(goalsAgainst===0 && (p.pos==="GK"||p.pos==="DF")) p.cleanSheets++;
      const r = detail.ratings[p.id];
      if(r!==undefined){ p.form.push(r); if(p.form.length>5) p.form.shift(); }
    });
    scorers.forEach(s=>{ if(s){ s.goals++; s.careerGoals++; } });
  }
  apply(state.squads[homeId], ag, detail.homeScorers);
  apply(state.squads[awayId], hg, detail.awayScorers);
}

// Ticks down injuries/suspensions everywhere, once per matchweek.
function tickAvailability(){
  Object.keys(state.squads).forEach(clubId=>{
    state.squads[clubId].forEach(p=>{
      if(p.injuryWeeks>0) p.injuryWeeks--;
      if(p.suspensionWeeks>0) p.suspensionWeeks--;
    });
  });
}

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=rndInt(0,i+1); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function nextPow2(n){ let p=1; while(p<n) p*=2; return p; }

// Byes (nulls) land in the tail after a shuffle, and there are always fewer byes than
// half the bracket, so pairing sequentially in blocks of two never puts two byes
// together — every bye pairs with a real club and auto-advances them.
function makeBracketPairs(clubIds){
  const size = nextPow2(clubIds.length);
  const slots = clubIds.slice();
  while(slots.length<size) slots.push(null);
  const pairs = [];
  for(let i=0;i<size;i+=2) pairs.push([slots[i], slots[i+1]]);
  return pairs;
}

function initCupsForSeason(){
  state.cups = {};
  Object.keys(CUP_CONFIG).forEach(key=>{
    const cfg = CUP_CONFIG[key];
    let eligible = [];
    cfg.eligibleTiers.forEach(t=> eligible = eligible.concat(state.tiers[t].clubIds));
    eligible = shuffleArr(eligible);
    state.cups[key] = { round:0, pairings: makeBracketPairs(eligible), champion:null };
  });
}

function resolveCupTie(idA, idB){
  if(idA===null) return {winner:idB, hg:0, ag:0, bye:true};
  if(idB===null) return {winner:idA, hg:0, ag:0, bye:true};
  const {hg,ag} = simulateScore(state.squads[idA], state.squads[idB]);
  let winner;
  if(hg>ag) winner=idA;
  else if(ag>hg) winner=idB;
  else { // drawn — flavour as "won on penalties", weighted by relative attack strength
    const rA = teamRatings(state.squads[idA]).attack, rB = teamRatings(state.squads[idB]).attack;
    winner = Math.random() < rA/(rA+rB) ? idA : idB;
  }
  return {winner, hg, ag, bye:false};
}

// Resolves every tie in the cup's CURRENT round, pays the user's club prize money if
// involved, builds next round's pairings from the winners, and reports back anything
// the UI needs to show (the user's own tie, or a title win).
function advanceCupRound(cupKey){
  const cfg = CUP_CONFIG[cupKey];
  const cup = state.cups[cupKey];
  if(!cup || cup.champion || !cup.pairings) return null;
  const roundIdx = cup.round;
  const winners = [];
  let userTie = null;
  cup.pairings.forEach(([a,b])=>{
    const res = resolveCupTie(a,b);
    winners.push(res.winner);
    if((a===state.clubId || b===state.clubId) && !res.bye){
      clubById(state.clubId).balance += cfg.prizePerRound[roundIdx];
      userTie = {a, b, hg:res.hg, ag:res.ag, prize:cfg.prizePerRound[roundIdx]};
    }
  });
  cup.round++;
  let champion = null;
  if(winners.length===1){
    cup.champion = winners[0];
    cup.pairings = null;
    if(cup.champion===state.clubId){
      clubById(state.clubId).balance += cfg.winnerBonus;
      champion = {prize:cfg.winnerBonus};
    }
  } else {
    const nextPairs = [];
    for(let i=0;i<winners.length;i+=2) nextPairs.push([winners[i], winners[i+1]]);
    cup.pairings = nextPairs;
  }
  return {userTie, champion, cfg, roundIdx};
}

// Read-only peek so the Dashboard can show "you're in the FA Cup this week" BEFORE
// Advance Week is pressed, without mutating any bracket state.
function getUserCupFixtureThisWeek(){
  for(const key in CUP_CONFIG){
    const cfg = CUP_CONFIG[key], cup = state.cups && state.cups[key];
    if(!cup || cup.champion || !cup.pairings) continue;
    if(cfg.weeks[cup.round] !== state.week) continue;
    const pair = cup.pairings.find(([a,b]) => (a===state.clubId||b===state.clubId) && a!==null && b!==null);
    if(pair){
      const oppId = pair[0]===state.clubId ? pair[1] : pair[0];
      return {competition:cfg.name, round:cup.round+1, opponentId:oppId};
    }
  }
  return null;
}

/* ---- Youth intake / squad rotation ---- */

function runYouthRotation(){
  let userGraduates = [];
  let growthLog = [];
  let retirements = [];
  Object.values(CLUB_META).forEach(club=>{
    const squad = state.squads[club.id];
    if(!squad) return;
    const isUser = club.id===state.clubId;

    // Age up, retire the old guard.
    for(let i=squad.length-1;i>=0;i--){
      const pl = squad[i];
      pl.age++;
      if(considerRetirement(pl, club)){
        squad.splice(i,1);
        if(isUser) retirements.push(pl);
      }
    }

    // Development / decline for EVERY player at EVERY club, so the whole world
    // improves and ages around you, not just your own squad.
    squad.forEach(p=>{
      const change = developPlayer(p, club);
      if(isUser && change !== 0) growthLog.push({player:p, change});
      if(isUser) p.morale = clamp(p.morale + club.facilities.medical, 1, 20);
    });

    // Youth intake.
    const youthLevel = isUser ? club.facilities.youth : 2;
    const intakeCount = clamp(1+youthLevel, 2, 6);
    const baseline = (TIER_YOUTH_BASE[club.tier] || 7) + youthLevel;
    for(let i=0;i<intakeCount;i++){
      const pos = pick(["GK","DF","DF","MD","MD","FW"]);
      let overall = clamp(baseline + rndInt(-3,3), 3, 18);
      // The wonderkid roll: roughly 1 in 12 intakes is a genuine gem whose current
      // ability says nothing about where he'll end up. A 16-year-old rated 48 with
      // 90 potential is exactly the National League diamond you want to unearth.
      // A better academy doesn't raise every kid's ceiling — it improves the ODDS
      // of unearthing a special one. Level 5 roughly triples the chance of a
      // generational talent versus level 1, which is what makes the upgrade worth
      // buying and why a big club's academy out-produces a non-league one.
      const academyBonus = (youthLevel - 1) * 0.5 + (isTopDivision(club.tier) ? 0.6 : 0);
      const nat = rollNationality(club);
      const nm = nameForNationality(nat);
      let p;
      // Football runs in families. A former player's son, or a set of twins,
      // occasionally comes through — and the surname makes it visible years on.
      const alumni = squad.filter(x=>!x.isReal && x.age>=30 && (x.careerApps||0)>60);
      if(alumni.length && Math.random() < 0.05){
        p = makeRelatedYouth(pick(alumni), club, academyBonus);
        if(isUser) pushWire(`${p.fatherName}'s son signs for ${club.name}`,
          `${fullName(p)}, son of former ${club.name} player ${p.fatherName}, has been handed his first professional deal.`,
          "personal", club.id);
      } else if(Math.random() < 0.018){
        const n = Math.random() < 0.12 ? 3 : 2;
        const sibs = makeSiblings(club, n, academyBonus);
        sibs.forEach(s=>{ squad.push(s); if(isUser) userGraduates.push(s); });
        if(isUser) pushWire(`${sibs[0].siblingType==="triplet"?"Triplets":"Twins"} sign at ${club.name}`,
          `${sibs.map(s=>fullName(s)).join(", ")} have all been offered professional terms on the same day.`,
          "personal", club.id);
        continue;
      } else {
        p = makePlayer(club.id, nm.first, nm.last, rndInt(16,19), pos, overall, false, nat, academyBonus);
      }
      p.isYouth = true;
      // A genuine wonderkid should arrive RAW: a big gap between what he is now
      // and what he could become. If the roll gave him a high ceiling, pull his
      // starting ability down so there's a real development journey rather than
      // a finished article walking out of the academy.
      // A wonderkid must have a SUPERSTAR ceiling, not merely a good one: 87+
      // on the display scale is internal ~17.2, so we push these up to 17.5-20
      // and drop their starting ability so the journey is real.
      // Only a genuinely exceptional roll counts as a wonderkid, so academies
      // stop printing future world-beaters every single year.
      // The academy decides the ceiling outright. One roll, against the odds
      // for its level — anything else is capped below elite, so upgrading the
      // youth setup is the only way to produce genuine prospects.
      const gemRoll = Math.random();
      const gemOdds = academyGemChance(youthLevel);
      if(gemRoll < gemOdds * 0.18){
        p.potential = rndInt(19,21);                 // generational
      } else if(gemRoll < gemOdds){
        p.potential = rndInt(18,20);                 // elite, 90+
      } else if(gemRoll < gemOdds + 0.10 + youthLevel*0.03){
        p.potential = rndInt(15,17);                 // a good pro, 79-86
      } else {
        p.potential = rndInt(11,15);                 // squad depth
      }
      p.potential = clamp(Math.max(p.potential, p.overall), 1, 20);
      p.potF = clamp(p.potential - Math.random()*0.4, p.overall, 20.5);
      // A high ceiling means a RAW player: pull his starting ability down so
      // there's a genuine development journey rather than a finished article
      // walking out of the academy. The ceiling itself was already set above.
      const isWonderkid = (p.potential - p.overall) >= 5;
      if(isWonderkid){
        const drop = rndInt(3,6);
        ["pace","passing","shooting","defending","physical"].forEach(k=>{
          p[k] = clamp(p[k] - drop, 1, 20);
        });
        recomputeOverall(p);
      }
      squad.push(p);
      if(isUser) userGraduates.push(p);
    }

    // Trim back to target. Ranked by ability PLUS potential, so promising kids
    // survive the cut ahead of finished journeymen.
    // The player manages his own squad — never silently cut it back. AI clubs
    // trim to their working size; yours is only capped at the hard maximum.
    const cap = isUser ? SQUAD_MAX : SQUAD_TARGET;
    if(squad.length > cap){
      squad.sort((a,b)=> (b.overall + (b.potential||b.overall)*0.35) - (a.overall + (a.potential||a.overall)*0.35));
      squad.length = cap;
    }
  });
  return {graduates:userGraduates, growth:growthLog, retirements};
}

// Kept as the public name used across the UI, now backed by real contracts.
function weeklyWageBill(clubId){
  if(typeof wageBill === "function") return wageBill(clubId);
  const club = clubById(clubId);
  return state.squads[clubId].reduce((s,p)=>s+playerWage(p, club.tier), 0);
}

// leagueResult: {played, isHome, won, drawn} for the user's league fixture this week,
// or null on a week they had no league fixture (bye weeks, or a tier sitting out after
// its own season finished early). Returns the breakdown so the UI can show it, not just
// silently apply it to balance.
function applyWeeklyFinance(leagueResult){
  const club = clubById(state.clubId);
  const tier = club.tier;
  const table = computeTable(tier);
  const leagueSize = state.tiers[tier].clubIds.length;
  const position = table.findIndex(r=>r.id===club.id)+1;

  const wages = -weeklyWageBill(club.id);
  let matchday = 0, winBonus = 0;
  if(leagueResult && leagueResult.played){
    // Real gate receipts (attendance x ticket price) rather than a flat figure.
    if(leagueResult.isHome) matchday = leagueResult.gate || 0;
    if(leagueResult.won) winBonus = TIER_WIN_BONUS[tier];
    else if(leagueResult.drawn) winBonus = Math.round(TIER_WIN_BONUS[tier]*0.4);
  }
  // Cup gate receipts banked this week — the lower-league payday.
  matchday += (state.pendingCupGate || 0);
  state.pendingCupGate = 0;
  const sponsorship = Math.round(TIER_SPONSOR[tier] * (1 + 0.1*(club.facilities.stadium-1)));
  const adverts = TIER_ADVERT[tier];
  const posMult = leagueSize>1 ? 1 + (leagueSize-position)/(leagueSize-1)*0.6 : 1;
  const tv = Math.round(TIER_TV_BASE[tier] * posMult);

  const total = wages+matchday+winBonus+sponsorship+adverts+tv;
  club.balance += total;
  state.lastFinance = {wages,matchday,winBonus,sponsorship,adverts,tv,total,week:state.week};
  return state.lastFinance;
}

function buyPlayer(player, overridePrice){
  const buyer = clubById(state.clubId);
  const seller = clubById(player.clubId);
  const price = overridePrice !== undefined ? overridePrice : playerAskingPrice(player, seller.tier);
  if(buyer.balance < price) return {ok:false, reason:"Not enough budget."};
  if(state.squads[buyer.id].length >= SQUAD_MAX) return {ok:false, reason:"Your squad is full (30 maximum)."};
  const interest = signingInterest(player, buyer, "buy");
  if(!interest.willing) return {ok:false, reason:`${fullName(player)} ${interest.reason}.`};
  buyer.balance -= price; seller.balance += price;
  state.squads[seller.id] = state.squads[seller.id].filter(p=>p.id!==player.id);
  player.clubId = buyer.id;
  player.listed = false;
  state.squads[buyer.id].push(player);
  pushNews("Transfer completed", `${fullName(player)} joins from ${seller.name} for ${fmtMoney(price)}.`, "transfer");
  checkAchievements({signedPlayer:true, signedFee:price});
  saveState(true);
  return {ok:true, price};
}

function sellPlayer(player){
  const club = clubById(state.clubId);
  const gross = playerAskingPrice(player, club.tier);
  const price = applySellOn(player, gross);   // former clubs take their cut first
  club.balance += price;
  state.squads[club.id] = state.squads[club.id].filter(p=>p.id!==player.id);
  pushNews("Player sold", `${fullName(player)} has left the club for ${fmtMoney(price)}.`, "transfer");
  checkAchievements({soldPlayer:true, soldFee:price});
  saveState();
  return price;
}

function releasePlayer(player){
  state.squads[player.clubId] = state.squads[player.clubId].filter(p=>p.id!==player.id);
  releaseToFreeAgents(player);   // he joins the free agent pool, as in real football
  saveState();
}

/* =========================================================================
   FACILITY PRICING — the same money in every division.
   Costs used to scale off your own league's wealth, which meant a National
   League club could max out for pocket change and then arrive in the Premier
   League fully upgraded for a fifth of what a top-flight club had paid. Now a
   level is a level: identical everywhere, climbing steeply. Level 1 is within
   anyone's reach; level 5 is Premier League money wherever you are, so a
   non-league side realistically reaches level 2, rarely 3.
   ========================================================================= */
// Raised again: clubs were still maxing out too quickly. Level 2 is a real
// season's saving for a lower-league side, level 4 is a top-flight project and
// level 5 is a decade of success anywhere.
const FACILITY_COSTS = {
  //          to L2      to L3       to L4        to L5
  stadium:  [  900000,  6500000,  32000000,  120000000],
  training: [  650000,  4800000,  24000000,   90000000],
  youth:    [  550000,  4000000,  20000000,   75000000],
  medical:  [  450000,  3200000,  16000000,   60000000],
};

function facilityCost(tierId, key, currentLevel){
  const table = FACILITY_COSTS[key] || FACILITY_COSTS.training;
  return table[clamp(currentLevel - 1, 0, table.length - 1)];
}

// Upkeep: a big ground and a full medical department cost money every week, so
// upgrading is a commitment rather than a one-off purchase.
function facilityUpkeep(club){
  let total = 0;
  Object.keys(club.facilities || {}).forEach(k=>{
    const lvl = (club.facilities[k]||1) - 1;
    // Upkeep climbs with each level rather than being flat per step.
    total += lvl * lvl * ({stadium:1400, training:1000, youth:800, medical:700}[k] || 800);
  });
  return Math.round(total);
}

// Each stadium level adds real seats, and the figure is shown before you buy.
const STADIUM_CAPACITY_STEP = {2:0.20, 3:0.35, 4:0.55, 5:0.85};
function stadiumCapacityAt(club, level){
  const base = club.baseCapacity || club.capacity;
  let cap = base;
  for(let l=2; l<=clamp(level,1,5); l++) cap = Math.round(cap * (1 + STADIUM_CAPACITY_STEP[l]));
  return cap;
}

function upgradeFacility(key){
  const club = clubById(state.clubId);
  const level = club.facilities[key];
  if(level>=5) return false;
  const cost = facilityCost(club.tier, key, level);
  if(club.balance < cost) return false;
  club.balance -= cost;
  club.facilities[key] = level+1;
  // A bigger ground means more seats, and the gate money that follows.
  if(key === "stadium"){
    if(!club.baseCapacity) club.baseCapacity = club.capacity;
    const before = club.capacity;
    club.capacity = stadiumCapacityAt(club, level+1);
    pushNews("Stadium expanded",
      `${stadiumDisplayName(club)} now holds ${club.capacity.toLocaleString()}, up from ${before.toLocaleString()}.`, "board");
  }
  saveState();
  return true;
}

   RENDER
   ========================================================================= */

function initials(name){
  const skip = new Set(["&","and","of","the"]);
  return name.split(" ").filter(w=>!skip.has(w.toLowerCase())).map(w=>w[0].toUpperCase()).slice(0,3).join("");
}

// 6 deterministic crest variants combining shape + color-layout, so every
// club looks distinct without touching any real badge design.
function crestSVG(club, size){
  size = size||40;
  const w=size, h=size*1.1;
  const variant = club.crestVariant||0;
  const P = club.primary, S = club.secondary;
  let shapePoints, fillDefs;
  const isRound = variant>=3;
  shapePoints = isRound
    ? `${w/2},2 ${w-2},${h*0.32} ${w-2},${h*0.66} ${w/2},${h-2} 2,${h*0.66} 2,${h*0.32}`
    : `2,2 ${w-2},2 ${w-2},${h*0.62} ${w/2},${h-2} 2,${h*0.62}`;
  const layout = variant % 3; // 0: band, 1: diagonal halves, 2: vertical halves
  let inner = "";
  const clipId = "clip"+club.id;
  if(layout===0){
    inner = `<rect x="0" y="${h*0.5}" width="${w}" height="${h*0.16}" fill="${S}"/>`;
  } else if(layout===1){
    inner = `<polygon points="0,0 ${w},0 0,${h}" fill="${S}" opacity="0.85"/>`;
  } else {
    inner = `<rect x="${w/2}" y="0" width="${w/2}" height="${h}" fill="${S}" opacity="0.85"/>`;
  }
  return `<div class="shield" style="width:${w}px;height:${h}px;">
    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <defs><clipPath id="${clipId}"><polygon points="${shapePoints}"/></clipPath></defs>
      <polygon points="${shapePoints}" fill="${P}"/>
      <g clip-path="url(#${clipId})">${inner}</g>
    </svg>
    <div class="initials" style="color:${isLight(P)&&layout!==0?"#14110A":S}; font-size:${size*0.32}px; top:-1px;">${initials(club.name)}</div>
  </div>`;
}

function isLight(hex){
  const c = hex.replace("#","");
  const r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
  return (0.299*r+0.587*g+0.114*b) > 150;
}
function ordinal(n){
  const r = n%100;
  if(r>=11&&r<=13) return n+"th";
  switch(n%10){case 1:return n+"st"; case 2:return n+"nd"; case 3:return n+"rd"; default:return n+"th";}
}
function fmtMoney(v){
  const sign = v<0?"-":"";
  v = Math.abs(v);
  if(v >= 1e6)  return sign+"£"+(v/1e6).toFixed(1)+"M";
  if(v >= 10000) return sign+"£"+Math.round(v/1000)+"K";
  if(v >= 1000)  return sign+"£"+(v/1000).toFixed(1)+"K";  // £2.4K rather than "£2K"
  return sign+"£"+Math.round(v);                            // small wages must not read "£0K"
}
// Defensive: a missing or unknown id must never take a whole screen down.
function tierName(id){ const t = TIERS.find(x=>x.id===id); return t ? t.name : (FOREIGN_LEAGUES[id] ? FOREIGN_LEAGUES[id].name : "League"); }
function tierShort(id){ const t = TIERS.find(x=>x.id===id); return t ? t.short : (FOREIGN_LEAGUES[id] ? FOREIGN_LEAGUES[id].short : "—"); }

function showAchievementToast(a){
  const el = document.createElement("div");
  el.className = "ach-toast";
  el.innerHTML = `<div class="ach-icon">🏅</div><div><div class="ach-unlocked">Achievement unlocked</div><div class="ach-name">${a.name}</div></div>`;
  document.getElementById("shell").appendChild(el);
  requestAnimationFrame(()=> el.classList.add("show"));
  playTone(660,0.12,0,"triangle"); playTone(880,0.2,0.1,"triangle");
  setTimeout(()=>{ el.classList.remove("show"); setTimeout(()=>el.remove(), 350); }, 3200);
}

// Errors get a proper dialog with a code you can read and report, rather than
// a toast that slides off screen before you've finished reading it.
// Rich diagnostic dialog. Shows the code, what area it maps to, the real
// JavaScript message and the failing line — everything needed to fix it.
// A player has asked for a word. Answering moves his morale, and some answers
// carry a promise you'll be held to.
function openConversation(conv){
  const p = (state.squads[state.clubId]||[]).find(x=>x.id===conv.playerId);
  const type = CONVERSATION_TYPES.find(t=>t.id===conv.typeId);
  const body = document.getElementById("convBody");
  if(!p || !type || !body){ state.conversations = (state.conversations||[]).filter(c=>c.id!==conv.id); return; }

  body.innerHTML = `
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
      ${avatarSVG(p,52)}
      <div>
        <h2 style="margin:0; font-size:19px;">${fullName(p)}</h2>
        <div class="sub" style="margin:2px 0 0;">${conv.title} · ${p.pos} · ${ratingOf(p)}</div>
      </div>
    </div>
    <div class="conv-speech">${conv.text}</div>
    <div id="convOpts"></div>`;

  const opts = document.getElementById("convOpts");
  type.options.forEach((o,i)=>{
    const b = document.createElement("button");
    b.className = "btn-secondary conv-opt";
    b.innerHTML = `${o.label}${o.note?`<span class="conv-note">${o.note}</span>`:""}${o.risk?`<span class="conv-note" style="color:var(--accent);">${o.risk}</span>`:""}`;
    b.onclick = ()=>{
      const r = answerConversation(conv, i);
      document.getElementById("convBackdrop").classList.remove("open");
      if(r.outcome) toast(r.outcome.length > 70 ? r.outcome.slice(0,70)+"…" : r.outcome, 3200);
      playClickSound();
      render();
    };
    opts.appendChild(b);
  });
  document.getElementById("convBackdrop").classList.add("open");
}

function showErrorDetail(code, entry){

    `<b>${area}</b><br><span style="color:var(--text-dim);">${(entry.msg||"").slice(0,180)}</span>` +
    (entry.where ? `<br><span style="font-size:10.5px; color:var(--text-dim); opacity:0.8;">${entry.where}</span>` : "") +
    `<br><span style="font-size:10.5px; color:var(--text-dim);">Season ${entry.season}, week ${entry.week}</span>`;

}

function showError(code, message, title){

/* =========================================================================
   ERROR CODES
   Every code maps to one specific place in the game, so quoting the code is
   enough to know exactly what to look at. The dialog also shows the real
   JavaScript message and line number, which is what "Script error." was
   hiding — that generic string appears when an error escapes to the global
   handler with no context, so we now catch errors at the source instead.

     BOOT-xx  startup and first paint
     RND-xx   a screen failed to draw   (01 dashboard 02 squad 03 transfers
                                         04 table 05 club 06 inbox 07 news
                                         08 pitch 09 tactics 10 start 11 select
                                         12 player card 13 match screen)
     SIM-xx   simulating a week or match
     SEA-xx   end-of-season rollover
     TRF-xx   transfers, loans, contracts
     FIN-xx   wages, budgets, FFP
     SAV-xx   saving or loading
     DAT-xx   player/club data integrity
   ========================================================================= */
const ERROR_AREAS = {
  "BOOT-01":"Startup — building the club database",
  "BOOT-02":"Startup — loading your saved career",
  "BOOT-03":"Startup — drawing the title screen",
  "RND-01":"Dashboard screen", "RND-02":"Squad screen", "RND-03":"Transfer market",
  "RND-04":"League table", "RND-05":"Club screen", "RND-06":"Inbox",
  "RND-07":"News", "RND-08":"Pitch / team selection", "RND-09":"Tactics",
  "RND-10":"Title screen", "RND-11":"Club select", "RND-12":"Player card",
  "RND-13":"Match screen",
  "SIM-01":"Advancing the week", "SIM-02":"Simulating a match",
  "SIM-03":"Cup round", "SIM-04":"European round",
  "SEA-01":"End-of-season rollover", "SEA-02":"Promotion and relegation",
  "SEA-03":"Youth intake", "SEA-04":"Awards",
  "TRF-01":"Making an offer", "TRF-02":"Loan move", "TRF-03":"Contract renewal",
  "FIN-01":"Weekly finances", "FIN-02":"Wage budget",
  "SAV-01":"Saving your career", "SAV-02":"Loading your career",
  "DAT-01":"Player data",
};

// The last few errors, so a pattern is visible rather than one snapshot.
let ERROR_LOG = [];

function describeError(e){
  if(!e) return {msg:"Unknown error", where:""};
  const msg = e.message || String(e);
  let where = "";
  if(e.stack){
    // First stack frame that isn't the reporter itself.
    const lines = e.stack.split("\n").slice(1);
    const frame = lines.find(l=>l.indexOf("reportError")===-1 && l.indexOf("guard")===-1) || lines[0] || "";
    where = frame.trim().replace(/^at\s+/,"").slice(0, 120);
  }
  return {msg, where};
}

function reportError(code, e, extra){
  const {msg, where} = describeError(e);
  const entry = {code, msg, where, extra: extra||"",
    week: (typeof state!=="undefined" && state) ? state.week : "-",
    season: (typeof state!=="undefined" && state) ? state.season : "-"};
  ERROR_LOG.unshift(entry);
  if(ERROR_LOG.length > 8) ERROR_LOG.length = 8;
  try{ console.error("["+code+"]", msg, where); }catch(_){}
  showErrorDetail(code, entry);
  return entry;
}

// Wraps a function so any failure inside it is reported against a specific
// code, with the real message — never a bare "Script error."
function guard(code, fn, fallback){
  return function(){
    try{ return fn.apply(this, arguments); }
    catch(e){ reportError(code, e); return fallback; }
  };
}

function toast(text, duration){
  duration = duration || 2600;
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = text;
  document.getElementById("shell").appendChild(el);
  requestAnimationFrame(()=> el.classList.add("show"));
  setTimeout(()=>{ el.classList.remove("show"); setTimeout(()=>el.remove(), 300); }, duration);
}

/* =========================================================================
   THE PITCH VIEW — see your shape, tap to change it.
   Tap a player on the pitch to lift him out of the side, then tap a name in
   the squad list to drop him into the empty slot. Much easier to read than a
   flat list when deciding who to drop or where to blood a youngster.
   ========================================================================= */
let pitchSelection = null;

// x/y as percentages of the pitch, goalkeeper first, back to front.
const FORMATION_LAYOUT = {
  "4-4-2":   [[50,92],[16,72],[38,75],[62,75],[84,72],[14,48],[38,50],[62,50],[86,48],[38,20],[62,20]],
  "4-3-3":   [[50,92],[16,72],[38,75],[62,75],[84,72],[30,52],[50,55],[70,52],[18,22],[50,16],[82,22]],
  "4-2-3-1": [[50,92],[16,72],[38,75],[62,75],[84,72],[38,58],[62,58],[18,36],[50,34],[82,36],[50,14]],
  "3-5-2":   [[50,92],[28,76],[50,78],[72,76],[10,50],[32,52],[50,54],[68,52],[90,50],[38,20],[62,20]],
  "5-3-2":   [[50,92],[10,70],[30,76],[50,78],[70,76],[90,70],[30,50],[50,52],[70,50],[38,22],[62,22]],
  "4-5-1":   [[50,92],[16,72],[38,75],[62,75],[84,72],[12,50],[34,52],[50,54],[66,52],[88,50],[50,18]],
  "3-4-3":   [[50,92],[28,76],[50,78],[72,76],[16,52],[40,54],[60,54],[84,52],[20,22],[50,16],[80,22]],
  "5-4-1":   [[50,92],[10,70],[30,76],[50,78],[70,76],[90,70],[16,50],[40,52],[60,52],[84,50],[50,18]],
};
function pitchLayoutFor(f){ return FORMATION_LAYOUT[f] || FORMATION_LAYOUT["4-4-2"]; }

function renderPitch(host){
  if(!state || !state.clubId || !state.squads) return;   // no career loaded yet
  const squad = state.squads[state.clubId] || [];
  const fname = (state.tactics && state.tactics.formation) || "4-4-2";
  const layout = pitchLayoutFor(fname);
  const slots = formationSlots(fname);

  if(!state.lineup || !Array.isArray(state.lineup)){
    state.lineup = autoPickXI(squad, fname).map(p=>p.id);
  }
  while(state.lineup.length < 11) state.lineup.push(null);
  const xi = state.lineup.map(id=> id ? (squad.find(p=>p.id===id) || null) : null);

  const markers = layout.map((pos,i)=>{
    const p = xi[i];
    const needed = slots[i] || "";
    const sel = pitchSelection === i ? " selected" : "";
    if(!p){
      return `<button class="pitch-slot empty${sel}" data-slot="${i}" style="left:${pos[0]}%; top:${pos[1]}%;">
        <span class="ps-pos">${needed}</span></button>`;
    }
    const wrong = p.pos !== needed ? " wrong" : "";
    return `<button class="pitch-slot${sel}${wrong}" data-slot="${i}" style="left:${pos[0]}%; top:${pos[1]}%;">
      <span class="ps-rating num">${ratingOf(p)}</span>
      <span class="ps-name">${p.last || p.first}</span>
      ${wrong?`<span class="ps-warn">${needed}</span>`:""}
    </button>`;
  }).join("");

  const bench = squad.filter(p=> state.lineup.indexOf(p.id) === -1);
  const picked = xi.filter(Boolean).length;

  host.innerHTML = `
    <div class="pitch-wrap">
      <div class="pitch-col">
        <div class="pitch"><div class="pitch-lines"></div>${markers}</div>
        <div class="pitch-hint">${pitchSelection===null
          ? (picked<11 ? "Tap an empty shirt, then pick a player below" : "Tap a player to take him out of the side")
          : "Now tap his replacement below"}</div>
        <div class="stat-row" style="margin-top:0;">
          <div class="stat-box"><div class="v num">${fname}</div><div class="l">Shape</div></div>
          <div class="stat-box"><div class="v num">${picked}/11</div><div class="l">Selected</div></div>
          <div class="stat-box"><div class="v num">${squad.length}/${SQUAD_MAX}</div><div class="l">Squad</div></div>
        </div>
        <button class="btn-secondary" id="pitchAuto">Auto-pick best XI</button>
      </div>
      <aside class="bench-col">
        <div class="section-title">Squad (${bench.length} available)</div>
        <div class="list" id="pitchBench"></div>
      </aside>
    </div>`;

  host.querySelectorAll(".pitch-slot").forEach(btn=>{
    btn.onclick = ()=>{
      const i = +btn.dataset.slot;
      if(state.lineup[i]){ state.lineup[i] = null; pitchSelection = i; }
      else { pitchSelection = (pitchSelection === i) ? null : i; }
      playClickSound(); saveState(); renderSquad();
    };
  });

  const autoBtn = document.getElementById("pitchAuto");
  if(autoBtn) autoBtn.onclick = ()=>{
    state.lineup = autoPickXI(squad, fname).map(p=>p.id);
    pitchSelection = null; saveState(); toast("Best available XI selected"); renderSquad();
  };

  affordableOnly:false, mode:"all", minAge:16, maxAge:99, minRating:0, maxRating:99,
  minPrice:0, maxPrice:Infinity, minPriceStep:0, maxPriceStep:60 };

function renderPillTabs(container, options, activeValue, onSelect){
  container.innerHTML = "";
  options.forEach(opt=>{
    const btn = document.createElement("button");
    btn.className = "tier-tab"+(opt.value===activeValue?" active":"");

// Builds the candidate pool for whichever market tab is active.
function transferPool(){
  const out = [];
  const mode = transferFilters.mode;
  if(mode==="free"){
    const me = clubById(state.clubId);
    (state.freeAgents||[]).forEach(p=>{
      const avail = playerAvailability(p, me);
      if(!transferFilters.showUnattainable && avail.status === "unattainable") return;
      out.push({p, club:null, price:0, kind:"free", avail});
    });
    return out;
  }
  const myClub = clubById(state.clubId);
  for(const clubId in state.squads){
    if(clubId===state.clubId) continue;
    const club = clubById(clubId);
    if(!club) continue;
    state.squads[clubId].forEach(p=>{
      if(p.loanedFrom) return;                       // already out on loan elsewhere
      if(mode==="listed" && !p.listed) return;
      if(mode==="loan" && !isLoanable(p, myClub)) return;

      const avail = playerAvailability(p, myClub);
      // Unless you deliberately ask to see everyone, the lists only show players
      // your club could realistically get. No more scrolling past Haaland.
      if(!transferFilters.showUnattainable && avail.status === "unattainable") return;
      if(mode === "loan" && avail.status === "unattainable") return;

      const price = mode==="loan" ? loanFee(p) : effectivePrice(p);
      out.push({p, club, price, avail,
        kind: mode==="loan" ? "loan" : (p.listed ? "listed" : "buy")});
    });
  }
  return out;
}

function getTransferResults(){
  const q = transferFilters.query.trim().toLowerCase();
  const myClub = clubById(state.clubId);
  let results = transferPool().filter(({p, club, price})=>{
    if(transferFilters.position!=="ALL" && p.pos!==transferFilters.position) return false;
    if(transferFilters.tier!=="ALL" && (!club || club.tier!==transferFilters.tier)) return false;
    if(q && !fullName(p).toLowerCase().includes(q)) return false;
    if(transferFilters.affordableOnly && price > myClub.balance) return false;
    if(p.age > transferFilters.maxAge) return false;
    if(transferFilters.minAge && p.age < transferFilters.minAge) return false;
    const rr = ratingOf(p);
    if(rr < transferFilters.minRating) return false;
    if(transferFilters.maxRating && rr > transferFilters.maxRating) return false;
    if(transferFilters.minPrice && price < transferFilters.minPrice) return false;
    if(transferFilters.maxPrice && transferFilters.maxPrice !== Infinity && price > transferFilters.maxPrice) return false;
    return true;
  });
  const cmp = {
    // Sort on the SAME value the row displays, or the list looks scrambled.
    rating_desc: (a,b)=>ratingOf(b.p)-ratingOf(a.p),
    potential_desc: (a,b)=>potentialOf(b.p)-potentialOf(a.p),
    price_asc: (a,b)=>a.price-b.price,
    price_desc: (a,b)=>b.price-a.price,
    age_asc: (a,b)=>a.p.age-b.p.age,
    age_desc: (a,b)=>b.p.age-a.p.age,
  };
  results.sort(cmp[transferFilters.sort] || cmp.rating_desc);
  return results;
}

function renderOffersList(wrap){

  // Your outstanding bids, with how much patience the selling club has left.
  if(bids.length){
    const bidBox = document.createElement("div");

      const p = (state.squads[b.clubId]||[]).find(x=>x.id===b.playerId);
      const from = clubById(b.clubId);
      if(!p || !from) return;
      const left = Math.max(0, b.patience - b.rounds);
      const pips = "●".repeat(left) + "○".repeat(Math.max(0, b.patience - left));
      const row = document.createElement("div");
      row.className = "row"; row.style.flexWrap = "wrap";

          <span class="price-line" style="color:${left<=1?'var(--bad)':'var(--text-dim)'};">
            ${b.status==="countered"?"Countered":"Considering"} · patience ${pips}
          </span>
        </span>
        <span class="ovr-pair"><span class="ovr num">${ratingOf(p)}</span><span class="pot num">${potentialOf(p)}</span></span>

          <button class="btn-secondary bid-raise" style="flex:1; margin-top:0;">Meet ${fmtMoney(b.counter)}</button>
          <button class="btn-secondary btn-danger bid-drop" style="flex:1; margin-top:0;">Withdraw</button>

      };
      row.querySelector(".bid-drop").onclick = ()=>{ withdrawBid(b); toast("Bid withdrawn"); render(); };
      list.appendChild(row);
    });
    bidBox.appendChild(list);
    wrap.appendChild(bidBox);
  }
  const countEl = document.getElementById("transferCount");
  if(countEl) countEl.textContent = offers.length + (offers.length===1?" offer":" offers");
  if(offers.length===0){
    const none = document.createElement("div");
    none.className = "empty-hint";
    none.textContent = bids.length
      ? "No incoming offers. Transfer-list a player to attract bids."
      : "No offers or bids. Transfer-list a player to attract interest.";
    wrap.appendChild(none);
    return;
  }
  const list = document.createElement("div");

  offers.forEach(o=>{
    const p = (state.squads[state.clubId]||[]).find(x=>x.id===o.playerId);
    const buyer = clubById(o.clubId);
    if(!p || !buyer) return;
    const value = playerAskingPrice(p, clubById(state.clubId).tier);
    const pct = Math.round(o.fee/value*100);
    const row = document.createElement("div");
    row.className = "row";
    row.style.flexWrap = "wrap";
    row.innerHTML = `<span class="pos-tag">${p.pos}</span>
      <span class="pinfo">
        <span class="name-line">${flagFor(p.nat)} ${fullName(p)} ${p.listed?'<span class="mkt-badge listed">LISTED</span>':''}</span>
        <span class="sub-line">${buyer.name} bid ${fmtMoney(o.fee)} · ${pct}% of value</span>
      </span>
      <span class="ovr-pair"><span class="ovr num">${ratingOf(p)}</span><span class="pot num">${potentialOf(p)}</span></span>
      <span class="btn-row" style="width:100%; margin-top:8px;">

        <button class="btn-secondary btn-danger offer-reject" style="flex:1; margin-top:0;">Reject</button>

  });

function renderTransferResultsOnly(){
  const wrap = document.getElementById("transferResultsWrap");
  if(!wrap) return;
  if(transferFilters.mode==="offers"){ renderOffersList(wrap); return; }
  const results = getTransferResults();
  const myClub = clubById(state.clubId);
  const countEl = document.getElementById("transferCount");
  if(countEl) countEl.textContent = results.length + (results.length===1?" player":" players");

  if(results.length===0){
    wrap.innerHTML = `<div class="empty-hint">No players match these filters.</div>`;
    return;
  }
  const shown = results.slice(0, transferShown);
  const list = document.createElement("div");
  list.className = "list";
  shown.forEach(({p, club, price, kind})=>{
    const affordable = price<=myClub.balance;
    const pot = potentialOf(p), cur = ratingOf(p);
    const badge = kind==="free" ? '<span class="mkt-badge free">FREE</span>'
      : kind==="listed" ? '<span class="mkt-badge listed">LISTED</span>'
      : kind==="loan" ? '<span class="mkt-badge loan">LOAN</span>' : '';
    const where = kind==="free" ? "Free agent" : (club.name + (club.hidden?" (2nd tier)":""));
    const priceText = kind==="free" ? "Free transfer"
      : kind==="loan" ? `Loan fee ${fmtMoney(price)}` : fmtMoney(price);
    const row = document.createElement("div");
    row.className = "row market-row";
    row.innerHTML = `<span class="pos-tag">${p.pos}</span>
      <span class="pinfo">
        <span class="name-line">${flagFor(p.nat)} ${fullName(p)} ${badge}</span>
        <span class="sub-line">${where} · age ${p.age}</span>
        <span class="price-line" style="color:${affordable?'var(--good)':'var(--bad)'};">${priceText}</span>
      </span>
      <span class="ovr-pair">
        <span class="ovr num">${cur}</span>
        <span class="pot num">${pot}</span>
      </span>`;
    row.onclick = ()=> openMarketModal(p, kind, price);

  });
  wrap.innerHTML = "";

  if(results.length > transferShown){
    const more = document.createElement("button");

    wrap.appendChild(more);
  } else if(results.length > 60){
    const end = document.createElement("div");
    end.className = "empty-hint"; end.style.padding = "14px";
    end.textContent = `That's all ${results.length} players.`;
    wrap.appendChild(end);
  }
}
